<script>
/* sql.js: SQLite compiled to WebAssembly. Classic script, so it is injected
   on demand rather than imported. Loaded at boot because it IS the store. */
window.__SQLJS_BASE = "https://cdn.jsdelivr.net/npm/sql.js@1/dist/";
window.__loadSqlJs = function () {
  if (window.__sqlPromise) return window.__sqlPromise;
  window.__sqlPromise = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = window.__SQLJS_BASE + "sql-wasm.js";
    s.onload = function () {
      if (typeof initSqlJs !== "function") return reject(new Error("sql.js did not initialise"));
      initSqlJs({ locateFile: function (f) { return window.__SQLJS_BASE + f; } }).then(resolve, reject);
    };
    s.onerror = function () { reject(new Error("sql.js CDN unreachable")); };
    document.head.appendChild(s);
  });
  return window.__sqlPromise;
};
</script>

<script type="module">
/* Transformers.js is an ES module, so it loads here and hands the pipeline
   back to the classic script below. Lazy on purpose: nothing downloads until
   the user turns semantic matching on. */
window.__loadTransformers = async function (onProgress) {
  const mod = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
  mod.env.allowLocalModels = false;
  mod.env.useBrowserCache = true;
  return await mod.pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2", {
    quantized: true,
    progress_callback: onProgress,
  });
};
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ==========================================================================

   ========================================================================== */

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap');

.qb {
  --paper:#E7EAF0; --card:#FFFFFF; --ink:#141A26; --soft:#5C6478;
  --rule:#D2D8E4; --indigo:#2D3BD4; --clear:#0C7F5C; --warn:#A96B04;
  --collide:#C42B41; --gold:#B48A16; --violet:#6B3FA0;
  --surface2:#FBFCFD; --track:#DFE3EB; --chipbg:#F4F6F9; --divider:#EEF0F5;
  --placeholder:#9AA1B2; --ledoff:#C3C9D6; --cellbg:#F3F5F9;
  --warnbg:#FDF6E7; --warnborder:#EBD9A8; --warntext:#6B4A02;
  --stopbg:#FCEDEF; --stopborder:#F0C6CD; --stoptext:#8C1526;
  --okbg:#EAF6F1; --okborder:#BFE0D3; --oktext:#08503B;
  --mlbg:#F3EFFA; --mlborder:#DACCEF; --mltext:#3F2168;
  --shadow-sm:rgba(20,26,38,.05); --shadow-lg:rgba(20,26,38,.4);
  --solid:#141A26; --solid2:#232B44; --on-solid:#FFFFFF;
  --grad:linear-gradient(90deg,var(--indigo),var(--violet));
  --grotesk:'Space Grotesk',Futura,'Trebuchet MS',sans-serif;
  --serif:'Newsreader',Georgia,'Iowan Old Style',serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  background:
    radial-gradient(900px 460px at 100% -10%, rgba(45,59,212,.09), transparent 62%),
    var(--paper);
  color:var(--ink); font-family:var(--grotesk);
  min-height:100vh; padding:0 0 96px; -webkit-font-smoothing:antialiased;
  transition:background-color .2s ease, color .2s ease;
}
.qb[data-theme="dark"] {
  --paper:#10131C; --card:#181C29; --ink:#EAECF3; --soft:#8A93AC;
  --rule:#2B3145; --indigo:#8B96FF; --clear:#3FDA9E; --warn:#E3B248;
  --collide:#FF7A8A; --gold:#E6C25E; --violet:#BA9CE8;
  --surface2:#12151F; --track:#262C3E; --chipbg:#1E2333; --divider:#252B3D;
  --placeholder:#5C6478; --ledoff:#3A4157; --cellbg:#1B2032;
  --warnbg:#2B240F; --warnborder:#4A3D14; --warntext:#F0C766;
  --stopbg:#2E141A; --stopborder:#5A2530; --stoptext:#FF9CA8;
  --okbg:#0F2A21; --okborder:#1E4B3B; --oktext:#5FE3B8;
  --mlbg:#211A38; --mlborder:#3B2E5C; --mltext:#CBB6F2;
  --shadow-sm:rgba(0,0,0,.28); --shadow-lg:rgba(0,0,0,.6);
  --solid:#8B96FF; --solid2:#BA9CE8; --on-solid:#12151F;
  background:
    radial-gradient(900px 460px at 100% -10%, rgba(139,150,255,.10), transparent 62%),
    var(--paper);
}
.qb[data-theme="dark"] .grade button{background:var(--card);}
.qb[data-theme="dark"] textarea.q:focus, .qb[data-theme="dark"] input.t:focus{background:var(--card);}
.qb *{box-sizing:border-box;}
.qb button{font-family:var(--grotesk); cursor:pointer;}
.qb :focus-visible{outline:2px solid var(--indigo); outline-offset:2px;}
.wrap{max-width:520px; margin:0 auto; padding:60px clamp(14px,4vw,18px); width:100%;}

/* ---- app shell: single column on mobile, sidebar + canvas from tablet up ---- */
.shell{max-width:1180px; margin:0 auto; padding:0 clamp(14px,4vw,32px); width:100%;}
.sidebar{padding:24px 0 8px;}
.main{padding:2px 0 72px; min-width:0;}
@media (min-width:900px){
  .shell{display:flex; align-items:flex-start;}
  .sidebar{width:236px; flex-shrink:0; position:sticky; top:28px;
    padding:40px 30px 40px 0; border-right:1px solid var(--rule); margin-right:36px;}
  .main{flex:1; max-width:720px; padding:40px 0 80px;}
}

.brand{margin-bottom:20px;}
.mast-eyebrow{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--soft); margin-bottom:8px;}
.brand h1{font-size:29px; font-weight:700; letter-spacing:-.035em; margin:0; line-height:1;}
.brand h1 em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
.brand p{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--soft); margin:9px 0 0;}

.side-stats{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:18px;}

.stamp{border:1.5px dashed var(--indigo); border-radius:10px; padding:6px 13px; text-align:center;
  transform:rotate(-2deg); background:rgba(45,59,212,.05); flex-shrink:0;}
.stamp b{display:block; font-family:var(--grotesk); font-size:22px; font-weight:700; line-height:1;
  letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--indigo);}
.stamp span{display:block; font-family:var(--mono); font-size:8.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--soft); margin-top:3px; white-space:nowrap;}
.stamp.zero{border-color:var(--rule); background:transparent;}
.stamp.zero b{color:var(--soft);}

.mlpill{flex-shrink:0; font-family:var(--mono); font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; border:1px solid var(--rule); background:var(--card);
  border-radius:99px; padding:6px 10px; color:var(--soft); display:flex; align-items:center; gap:6px;}
.mlpill .led{width:6px; height:6px; border-radius:99px; background:var(--ledoff);}
.mlpill.on{border-color:var(--violet); color:var(--violet);}
.mlpill.on .led{background:var(--violet);}
.mlpill.load .led{background:var(--warn); animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.25;}}

.theme-toggle{flex-shrink:0; font-family:var(--mono); font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; border:1px solid var(--rule); background:var(--card);
  border-radius:99px; padding:6px 10px; color:var(--soft);}
.theme-toggle:hover{border-color:var(--indigo); color:var(--indigo);}

.tabs{display:flex; gap:3px; background:var(--card); border:1px solid var(--rule);
  border-radius:11px; padding:4px; margin:6px 0 18px; box-shadow:0 1px 2px var(--shadow-sm);}
.tabs button{flex:1; border:0; background:transparent; color:var(--soft); font-size:12px;
  font-weight:500; padding:9px 2px; border-radius:8px;}
.tabs button.on{background:linear-gradient(135deg,var(--solid),var(--solid2)); color:var(--on-solid);}
.tabs .badge{font-family:var(--mono); font-size:10px; margin-left:4px; opacity:.75;}

.mode-toggle{display:flex; gap:3px; background:var(--card); border:1px solid var(--rule);
  border-radius:11px; padding:4px; margin-bottom:14px; box-shadow:0 1px 2px var(--shadow-sm);}
.mode-toggle button{flex:1; border:0; background:transparent; color:var(--soft); font-size:12.5px;
  font-weight:500; padding:9px 10px; border-radius:8px;}
.mode-toggle button.on{background:linear-gradient(135deg,var(--solid),var(--solid2)); color:var(--on-solid);}

.rev-flip{transition:transform .16s ease, opacity .16s ease; transform-origin:center;}
.rev-flip.flip{transform:scaleX(.94); opacity:.5;}
@media (min-width:900px){
  .sidebar .tabs{flex-direction:column; background:transparent; border:0; padding:0;
    box-shadow:none; gap:2px; margin:4px 0 0;}
  .sidebar .tabs button{flex:none; text-align:left; padding:10px 12px; font-size:13px; border-radius:9px;}
  .sidebar .tabs button.on{box-shadow:0 6px 16px -9px var(--shadow-lg);}
}

.card{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:18px;
  box-shadow:0 1px 2px var(--shadow-sm), 0 10px 26px -20px var(--shadow-lg);}
.card + .card{margin-top:14px;}
.eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--soft); display:block; margin-bottom:9px;}

textarea.q, input.t{width:100%; border:1px solid var(--rule); border-radius:10px; background:var(--surface2);
  padding:12px 13px; font-family:var(--serif); font-size:17.5px; color:var(--ink); resize:vertical;}
input.t{font-family:var(--grotesk); font-size:14.5px;}
textarea.q{min-height:88px; line-height:1.45;}
textarea.q:focus, input.t:focus{background:var(--card); border-color:var(--indigo);}
textarea.q::placeholder, input.t::placeholder{color:var(--placeholder);}
textarea.sm{min-height:110px; font-size:15px;}
textarea.xl{min-height:320px; font-size:16.5px;}
textarea.mono{font-family:var(--mono); font-size:13.5px; line-height:1.55; white-space:pre;}
.code-block{margin-top:10px; padding:12px 14px; background:var(--surface2); border:1px solid var(--rule);
  border-radius:10px; font-family:var(--mono); font-size:12.5px; line-height:1.6; color:var(--ink);
  white-space:pre; overflow-x:auto;}

.expand-btn{display:inline-flex; align-items:center; gap:5px; border:0; background:transparent;
  color:var(--soft); font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  padding:0; margin-top:7px;}
.expand-btn:hover{color:var(--indigo);}

.modal-backdrop{position:fixed; inset:0; background:rgba(8,10,16,.5); display:flex;
  align-items:center; justify-content:center; padding:20px; z-index:80;}
.modal-panel{background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:22px;
  width:100%; max-width:640px; max-height:86vh; overflow:auto; box-shadow:0 24px 64px -20px rgba(0,0,0,.5);}
.modal-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;}
select.t{width:100%; border:1px solid var(--rule); border-radius:10px; padding:11px 12px;
  font-size:14px; background:var(--surface2); font-family:var(--grotesk); color:var(--ink);}

/* gauge */
.gauge{margin-top:14px;}
.gauge-top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
.gauge-num{font-size:44px; font-weight:700; letter-spacing:-.04em; line-height:.85;
  font-variant-numeric:tabular-nums;}
.gauge-num span{font-size:16px; font-weight:500; letter-spacing:0;}
.gauge-verdict{text-align:right;}
.gauge-verdict b{display:block; font-size:13px; letter-spacing:-.01em;}
.gauge-verdict small{font-family:var(--mono); font-size:10px; color:var(--soft);
  letter-spacing:.06em; text-transform:uppercase;}
.ticks{display:flex; gap:2px; margin-top:11px;}
.ticks i{flex:1; height:12px; border-radius:2px; background:var(--track);
  transition:background .18s ease, transform .18s ease;}
.ticks i.lit{transform:scaleY(1.34);}
.ticks-scale{display:flex; justify-content:space-between; font-family:var(--mono); font-size:9.5px;
  color:var(--soft); letter-spacing:.08em; margin-top:6px;}
.split{display:flex; gap:14px; margin-top:9px; font-family:var(--mono); font-size:9.5px;
  color:var(--soft); letter-spacing:.07em; text-transform:uppercase;}
.split b{color:var(--ink); font-weight:500;}

.near{margin-top:14px; border-top:1px dashed var(--rule); padding-top:12px;}
.near-row{display:flex; gap:11px; align-items:baseline; padding:8px 0;}
.near-row + .near-row{border-top:1px solid var(--divider);}
.pct{font-family:var(--mono); font-size:12px; font-weight:500; min-width:38px;
  font-variant-numeric:tabular-nums;}
.near-q{font-family:var(--serif); font-size:15px; line-height:1.38; flex:1;}
.near-meta{font-family:var(--mono); font-size:9.5px; color:var(--soft); text-transform:uppercase;
  letter-spacing:.1em; margin-top:3px;}

.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px;}
.chip{border:1px solid var(--rule); background:var(--chipbg); color:var(--ink); border-radius:99px;
  padding:6px 11px; font-size:12.5px; font-weight:500;}
.chip.on{background:var(--solid); color:var(--on-solid); border-color:var(--solid);}
.chip.ghost{background:transparent; border-style:dashed; color:var(--soft);}
.chip .x{opacity:.55; margin-left:6px;}
.chip .conf{font-family:var(--mono); font-size:9.5px; opacity:.6; margin-left:6px;}

.btn{border:1px solid var(--solid); background:var(--solid); color:var(--on-solid); border-radius:10px;
  padding:12px 16px; font-size:14px; font-weight:500; width:100%; box-shadow:0 1px 2px var(--shadow-sm);}
.btn[disabled]{opacity:.34; cursor:not-allowed;}
.btn.line{background:transparent; color:var(--ink);}
.btn.danger{background:var(--collide); border-color:var(--collide); color:#fff;}
.btn.violet{background:var(--violet); border-color:var(--violet); color:#fff;}
.btn.tiny{width:auto; padding:7px 12px; font-size:12.5px; border-radius:8px;}
.row{display:flex; gap:8px; flex-wrap:wrap;}
.row .btn{flex:1;}

.note{font-size:13px; line-height:1.5; color:var(--soft); margin:10px 0 0;}
.note b{color:var(--ink);}
.hint{font-size:12px; color:var(--soft); margin-top:6px; line-height:1.45;}
.alert{border-radius:10px; padding:11px 13px; font-size:13.5px; line-height:1.45; margin-top:12px;}
.alert.warn{background:var(--warnbg); border:1px solid var(--warnborder); color:var(--warntext);}
.alert.stop{background:var(--stopbg); border:1px solid var(--stopborder); color:var(--stoptext);}
.alert.ok{background:var(--okbg); border:1px solid var(--okborder); color:var(--oktext);}
.alert.info{background:var(--chipbg); border:1px solid var(--rule); color:var(--ink);}
.alert.ml{background:var(--mlbg); border:1px solid var(--mlborder); color:var(--mltext);}
.alert b{display:block; margin-bottom:3px;}
.field + .field{margin-top:15px;}

.bar{height:5px; background:var(--track); border-radius:99px; overflow:hidden; margin-top:9px;}
.bar i{display:block; height:100%; background:var(--violet); border-radius:99px; transition:width .3s ease;}

.item{border-top:1px solid var(--rule); padding:15px 0;}
.item:first-child{border-top:0;}
.item-q{font-family:var(--serif); font-size:17px; line-height:1.4;}
.item-meta{display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-top:8px;
  font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--soft);}
.dot{width:5px; height:5px; border-radius:99px; background:var(--rule); display:inline-block;}
.item-ans{font-family:var(--serif); font-size:15px; line-height:1.5; color:var(--soft);
  margin-top:9px; padding-left:11px; border-left:2px solid var(--rule);}
.variant{margin-left:14px; padding-left:12px; border-left:2px solid var(--indigo);}

.rev-q{font-family:var(--serif); font-size:23px; line-height:1.32; letter-spacing:-.01em;}
.timer{font-family:var(--mono); font-size:34px; font-weight:500; font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;}
.timer-bar{height:4px; background:var(--track); border-radius:99px; overflow:hidden; margin-top:10px;}
.timer-bar i{display:block; height:100%; background:var(--indigo); border-radius:99px; transition:width .9s linear;}
.grade{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;}
.grade button{border:1px solid var(--rule); background:var(--card); border-radius:10px; padding:12px 8px; text-align:left;}
.grade button.rec{border-color:var(--indigo); box-shadow:0 0 0 2px rgba(45,59,212,.11);}
.grade b{display:block; font-size:13.5px;}
.grade small{font-family:var(--mono); font-size:9.5px; color:var(--soft); letter-spacing:.07em; text-transform:uppercase;}

.mic{display:flex; align-items:center; gap:10px; margin-top:14px;}
.mic-orb{width:44px; height:44px; border-radius:99px; border:1px solid var(--rule); background:var(--chipbg);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px;}
.mic-orb.live{background:var(--collide); border-color:var(--collide); color:#fff; animation:pulse 1.4s ease-in-out infinite;}
.transcript{font-family:var(--serif); font-size:15px; line-height:1.5; color:var(--soft);
  margin-top:12px; padding:11px 13px; background:var(--surface2); border:1px solid var(--rule); border-radius:10px;
  max-height:170px; overflow:auto;}
.transcript em{font-style:normal; color:var(--placeholder);}

.beat{display:flex; gap:9px; align-items:flex-start; padding:9px 0;}
.beat + .beat{border-top:1px solid var(--divider);}
.beat-mark{font-family:var(--mono); font-size:12px; width:20px; flex-shrink:0; text-align:center; padding-top:1px;}
.beat-txt{font-family:var(--serif); font-size:15px; line-height:1.42; flex:1;}
.beat.miss .beat-txt{color:var(--collide);}
.beat-score{font-family:var(--mono); font-size:9.5px; color:var(--soft); letter-spacing:.06em;}

.cov{display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--rule);}
.cov:first-of-type{border-top:0;}
.cov-name{flex:1; font-size:14px; font-weight:500; letter-spacing:-.01em; min-width:0;}
.cov-name small{display:block; font-family:var(--mono); font-size:9.5px; color:var(--soft);
  letter-spacing:.08em; text-transform:uppercase; font-weight:400; margin-top:2px;}
.cells{display:flex; gap:3px;}
.cell{width:26px; height:26px; border-radius:6px; border:1px solid var(--rule); background:var(--cellbg);
  font-family:var(--mono); font-size:10px; color:var(--soft); display:flex; align-items:center;
  justify-content:center; padding:0;}
.cell.has{background:var(--solid); border-color:var(--solid); color:var(--on-solid);}
.cell.strong{background:var(--clear); border-color:var(--clear); color:#fff;}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; font-family:var(--mono);
  font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--soft);}

.stat-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.stat{flex:1 1 100px; min-width:100px; background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:12px;
  position:relative; overflow:hidden; box-shadow:0 1px 2px var(--shadow-sm), 0 8px 20px -17px var(--shadow-lg);}
.stat::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--grad);}
.stat b{display:block; font-size:24px; font-weight:700; letter-spacing:-.03em; line-height:1;
  font-variant-numeric:tabular-nums;}
.stat small{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--soft); display:block; margin-top:6px;}

/* ---------------------------- lexical layer ---------------------------- */
const STOP = new Set(("a an the is are was were be been being am do does did doing you your yours my mine i we our us it its of to in on at for with and or as that this these those from by can could would should will shall may might what why how when which who whom whose please tell about explain describe give any some there their they them he she").split(" "));

const stem = (w) => {
  if (w.length <= 4) return w;
  if (w.endsWith("ies")) return w.slice(0, -3) + "y";
  if (w.endsWith("ing")) return w.slice(0, -3);
  if (w.endsWith("ed")) return w.slice(0, -2);
  if (w.endsWith("es")) return w.slice(0, -2);
  if (w.endsWith("s") && !w.endsWith("ss")) return w.slice(0, -1);
  return w;
};
const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
const toks = (s) => {
  const set = new Set();
  norm(s).split(" ").forEach((w) => { if (w && !STOP.has(w)) set.add(stem(w)); });
  return set;
};
const trigrams = (s) => {
  const t = " " + norm(s) + " ";
  const set = new Set();
  for (let i = 0; i < t.length - 2; i++) set.add(t.slice(i, i + 3));
  return set;
};
const dice = (a, b) => { if (!a.size || !b.size) return 0; let h = 0; a.forEach((x) => { if (b.has(x)) h++; }); return (2 * h) / (a.size + b.size); };
const jaccard = (a, b) => { if (!a.size || !b.size) return 0; let h = 0; a.forEach((x) => { if (b.has(x)) h++; }); return h / (a.size + b.size - h); };

function lexScore(a, b) {
  const ta = toks(a), tb = toks(b);
  if (ta.size && tb.size && ta.size === tb.size) {
    let same = true; ta.forEach((x) => { if (!tb.has(x)) same = false; });
    if (same) return 100;
  }
  return Math.round(Math.min(100, (0.55 * dice(trigrams(a), trigrams(b)) + 0.45 * jaccard(ta, tb)) * 118));
}

/* --------------------------- semantic layer ---------------------------- */
/* MiniLM cosine sits ~0.10-0.30 for unrelated text and ~0.55-0.95 for
   paraphrases, so remap that live band onto 0-100 before blending. */
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const semScore = (cos) => Math.round(clamp01((cos - 0.30) / 0.60) * 100);

function cosine(a, b) {
  if (!a || !b) return 0;
  let d = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
  return na && nb ? d / Math.sqrt(na * nb) : 0;
}

/* Blended verdict used everywhere a duplicate could hide.
   A weighted average alone under-reports the interesting case: a true
   paraphrase scores ~90 on meaning and ~10 on wording, averaging to a shrug.
   So each channel can also carry the verdict on its own, slightly discounted. */
function blend(lex, sem) {
  if (sem === null) return { score: lex, lex, sem: null };
  const avg = 0.6 * sem + 0.4 * lex;
  return { score: Math.round(Math.max(avg, sem - 12, lex - 8)), lex, sem };
}

const band = (n) => (n >= 82 ? "collide" : n >= 62 ? "near" : n >= 40 ? "echo" : "clear");
const BAND_COLOR = { collide: "var(--collide)", near: "var(--warn)", echo: "var(--gold)", clear: "var(--clear)" };
const BAND_TEXT = {
  collide: ["Already in the bank", "blocked"],
  near: ["Very close to an existing question", "check before saving"],
  echo: ["Some overlap", "probably a different angle"],
  clear: ["Nothing like it yet", "clear to save"],
};

function guessAngleLexical(q) {
  const s = norm(q);
  if (/\b(tell me about a time|time you|time when|describe a time|describe a situation|walk me through a project|have you ever)\b/.test(s)) return "story";
  if (/\b(debug|debugging|troubleshoot|slow|slower|regress|root cause|investigate|find out why|diagnose)\b/.test(s)) return "debug";
  if (/\b(scale|scaling|10x|100x|million|throughput|traffic|load|bottleneck|capacity|shard)\b/.test(s)) return "scale";
  if (/\b(fail|fails|failure|breaks|break|crash|leak|race|deadlock|what happens if|goes wrong|edge case)\b/.test(s)) return "fail";
  if (/\b(vs|versus|difference|instead of|prefer|trade off|tradeoff|when would you|why choose|pros and cons|downside)\b/.test(s)) return "trade";
  return "def";
}

/* ---------------------------- FSRS scheduler ---------------------------- */
/* Free Spaced Repetition Scheduler, v4.5 formulation with default weights.
   Replaces fixed Leitner boxes: each card carries its own stability (days
   until recall falls to 90%) and difficulty (1-10), fitted from your grades. */
const W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.0310,
           1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.5870, 0.2272, 2.8755];
const DECAY = -0.5;
const FACTOR = Math.pow(0.9, 1 / DECAY) - 1; /* 0.234568 */
const DAY = 86400000;
const now = () => Date.now();
const clampD = (d) => Math.min(10, Math.max(1, d));

/* grades: 1 Again, 2 Hard, 3 Good, 4 Easy */
const retrievability = (elapsedDays, S) => (S > 0 ? Math.pow(1 + FACTOR * (elapsedDays / S), DECAY) : 0);
const intervalFor = (S, retention) => (S / FACTOR) * (Math.pow(retention, 1 / DECAY) - 1);

const initStability = (g) => Math.max(0.1, W[g - 1]);
const initDifficulty = (g) => clampD(W[4] - (g - 3) * W[5]);

function nextDifficulty(D, g) {
  const d1 = D - W[6] * (g - 3);
  return clampD(W[7] * initDifficulty(3) + (1 - W[7]) * d1);
}
function stabilityRecall(D, S, R, g) {
  const hard = g === 2 ? W[15] : 1;
  const easy = g === 4 ? W[16] : 1;
  const inc = Math.exp(W[8]) * (11 - D) * Math.pow(S, -W[9]) * (Math.exp(W[10] * (1 - R)) - 1) * hard * easy;
  return S * (1 + inc);
}
function stabilityLapse(D, S, R) {
  return Math.min(S, W[11] * Math.pow(D, -W[12]) * (Math.pow(S + 1, W[13]) - 1) * Math.exp(W[14] * (1 - R)));
}

/** Returns the updated scheduling fields for a card given a grade. */
function schedule(card, g, retention) {
  const ret = retention || 0.9;
  const t = now();
  let S, D, R;
  if (!card.reps || card.stability == null) {
    S = initStability(g);
    D = initDifficulty(g);
    R = 1;
  } else {
    const elapsed = Math.max(0, (t - (card.last || card.created || t)) / DAY);
    R = retrievability(elapsed, card.stability);
    D = nextDifficulty(card.difficultyF != null ? card.difficultyF : 5, g);
    S = g === 1 ? stabilityLapse(D, card.stability, R) : stabilityRecall(D, card.stability, R, g);
  }
  S = Math.max(0.1, Math.min(36500, S));
  let days = intervalFor(S, ret);
  if (g === 1) days = Math.min(days, 0.007); /* ~10 minutes */
  else days = Math.max(1, Math.min(365, days));
  /* fuzz so a big import does not all come due on one day */
  if (days >= 3) days = days * (0.95 + Math.random() * 0.1);
  return {
    stability: S,
    difficultyF: D,
    lastR: R,
    reps: (card.reps || 0) + 1,
    lapses: (card.lapses || 0) + (g === 1 ? 1 : 0),
    last: t,
    due: t + days * DAY,
    interval: days,
  };
}
function previewDays(card, g, retention) {
  const probe = schedule({ ...card }, g, retention);
  return probe.interval < 1 ? "10 min" : Math.round(probe.interval) + "d";
}
const isDue = (q) => q.due <= now();
const fmtDue = (q) => {
  if (q.due <= now()) return "due now";
  const d = (q.due - now()) / DAY;
  if (d < 1) return "due in " + Math.max(1, Math.round(d * 24)) + "h";
  if (d < 2) return "due tomorrow";
  if (d < 60) return "due in " + Math.round(d) + "d";
  return "due in " + Math.round(d / 30) + "mo";
};
/* strength label from stability, replacing the old box number */
const strengthOf = (q) => {
  const s = q.stability || 0;
  if (!q.reps) return "new";
  if (s < 2) return "fragile";
  if (s < 10) return "settling";
  if (s < 45) return "solid";
  return "durable";
};

/* --------------------------- concept helpers --------------------------- */
const cnorm = (s) => norm(s).replace(/\s+/g, "");
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

function resolveConcept(input, concepts) {
  const k = cnorm(input);
  if (!k) return { kind: "empty" };
  for (const c of concepts) {
    if (cnorm(c.name) === k || (c.aliases || []).some((a) => cnorm(a) === k)) return { kind: "exact", concept: c };
  }
  let best = null, score = 0;
  for (const c of concepts) { const s = lexScore(c.name, input); if (s > score) { score = s; best = c; } }
  if (best && score >= 66) return { kind: "similar", concept: best, score };
  return { kind: "new" };
}

/* -------------------------- answer beat parsing ------------------------- */
function splitBeats(answer) {
  if (!answer) return [];
  return answer
    .split(/\n+|(?<=[.;!?])\s+/)
    .map((s) => s.trim().replace(/^[-*\u2022]\s*/, ""))
    .filter((s) => s.length >= 12);
}
function splitSentences(t) {
  if (!t) return [];
  return t.split(/(?<=[.;!?])\s+|\n+/).map((s) => s.trim()).filter((s) => s.length > 3);
}
/* lexical fallback coverage when embeddings are off */
function lexCoverage(beat, transcript) {
  const b = toks(beat), t = toks(transcript);
  if (!b.size) return 0;
  let hit = 0; b.forEach((w) => { if (t.has(w)) hit++; });
  return hit / b.size;
}

/* ======================================================================
   STORAGE — SQLite compiled to WASM, persisted as one real database file
   in the Origin Private File System.

   Why this shape:
   - sql.js holds the database in memory and hands back the raw bytes, so
     the file on disk is a byte-for-byte valid SQLite database. You can pull
     it out and open it in DB Browser or the sqlite3 CLI.
   - Writes go through OPFS createWritable(), which commits atomically on
     close, so a crash mid-save cannot leave a half-written database.
   - No COOP/COEP headers needed, which matters because GitHub Pages cannot
     set them. That rules out sqlite-wasm's SAHPool VFS.
   - The cost is a whole-file rewrite per save, debounced. Fine into the
     thousands of rows; it is the honest trade for one portable file.
   - If OPFS or the CDN is unavailable, everything falls back to IndexedDB
     and the app behaves identically.
   ====================================================================== */

const SCHEMA = `
CREATE TABLE IF NOT EXISTS concepts (
  id TEXT PRIMARY KEY, name TEXT NOT NULL, aliases TEXT DEFAULT '[]'
);
CREATE TABLE IF NOT EXISTS languages (
  id TEXT PRIMARY KEY, name TEXT NOT NULL, aliases TEXT DEFAULT '[]'
);
CREATE TABLE IF NOT EXISTS questions (
  id TEXT PRIMARY KEY,
  text TEXT NOT NULL,
  answer TEXT,
  code_example TEXT,
  concept_id TEXT REFERENCES concepts(id) ON DELETE SET NULL,
  language_id TEXT REFERENCES languages(id) ON DELETE SET NULL,
  angle TEXT DEFAULT 'def',
  difficulty TEXT DEFAULT 'medium',
  due INTEGER, created INTEGER, last INTEGER,
  reps INTEGER DEFAULT 0, lapses INTEGER DEFAULT 0,
  stability REAL, difficulty_f REAL, interval REAL,
  variant_of TEXT
);
CREATE INDEX IF NOT EXISTS idx_q_due ON questions(due);
CREATE INDEX IF NOT EXISTS idx_q_concept ON questions(concept_id);
CREATE INDEX IF NOT EXISTS idx_q_language ON questions(language_id);
CREATE INDEX IF NOT EXISTS idx_q_variant ON questions(variant_of);
CREATE TABLE IF NOT EXISTS vectors (
  id TEXT PRIMARY KEY REFERENCES questions(id) ON DELETE CASCADE,
  dim INTEGER NOT NULL, v BLOB NOT NULL
);
CREATE TABLE IF NOT EXISTS reviews (
  rid INTEGER PRIMARY KEY AUTOINCREMENT,
  qid TEXT, at INTEGER, grade INTEGER, elapsed INTEGER,
  stability REAL, difficulty REAL, interval REAL,
  coverage REAL, transcript_len INTEGER
);
CREATE INDEX IF NOT EXISTS idx_r_qid ON reviews(qid);
CREATE TABLE IF NOT EXISTS meta (k TEXT PRIMARY KEY, v TEXT);
`;
const SCHEMA_VERSION = 1;
const DB_FILE = "bank.sqlite3";
const LEGACY_KEY = "qbank:v1";
const IDB_NAME = "qbank";

/* `CREATE TABLE IF NOT EXISTS` never touches a table that already exists on
   disk, so a database saved before the languages feature shipped needs an
   explicit ALTER TABLE to grow the new column. Safe to call every boot. */
function ensureLanguageColumn(db) {
  const info = db.exec("PRAGMA table_info(questions)");
  const names = info.length ? info[0].values.map((r) => r[1]) : [];
  if (!names.includes("language_id")) db.run("ALTER TABLE questions ADD COLUMN language_id TEXT");
  if (!names.includes("code_example")) db.run("ALTER TABLE questions ADD COLUMN code_example TEXT");
}

/* ---- row mapping: snake_case on disk, camelCase in the app ---- */
const rowToQ = (r) => ({
  id: r.id, text: r.text, answer: r.answer || "", codeExample: r.code_example || "",
  conceptId: r.concept_id || null,
  languageId: r.language_id || null,
  angle: r.angle || "def", difficulty: r.difficulty || "medium",
  due: r.due, created: r.created, last: r.last,
  reps: r.reps || 0, lapses: r.lapses || 0,
  stability: r.stability, difficultyF: r.difficulty_f, interval: r.interval,
  variantOf: r.variant_of || null,
});
const qToRow = (q) => [
  q.id, q.text, q.answer || "", q.codeExample || "", q.conceptId || null, q.languageId || null, q.angle || "def", q.difficulty || "medium",
  q.due || null, q.created || null, q.last || null,
  q.reps || 0, q.lapses || 0,
  q.stability == null ? null : q.stability,
  q.difficultyF == null ? null : q.difficultyF,
  q.interval == null ? null : q.interval,
  q.variantOf || null,
];
const Q_COLS = "id,text,answer,code_example,concept_id,language_id,angle,difficulty,due,created,last,reps,lapses,stability,difficulty_f,interval,variant_of";
const Q_MARKS = "(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)";

/* ====================== fallback backend: IndexedDB ==================== */
let _idb = null;
function openIDB() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
    const req = indexedDB.open(IDB_NAME, 2);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      const tx = e.target.transaction;
      let qStore;
      if (!db.objectStoreNames.contains("questions")) {
        qStore = db.createObjectStore("questions", { keyPath: "id" });
        qStore.createIndex("due", "due"); qStore.createIndex("conceptId", "conceptId");
      } else {
        qStore = tx.objectStore("questions");
      }
      if (!qStore.indexNames.contains("languageId")) qStore.createIndex("languageId", "languageId");
      if (!db.objectStoreNames.contains("concepts")) db.createObjectStore("concepts", { keyPath: "id" });
      if (!db.objectStoreNames.contains("languages")) db.createObjectStore("languages", { keyPath: "id" });
      if (!db.objectStoreNames.contains("vectors")) db.createObjectStore("vectors", { keyPath: "id" });
      if (!db.objectStoreNames.contains("reviews")) db.createObjectStore("reviews", { keyPath: "rid", autoIncrement: true });
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "k" });
    };
    req.onsuccess = () => { _idb = req.result; resolve(_idb); };
    req.onerror = () => reject(req.error);
  });
}
function idbTx(store, mode, fn) {
  return openIDB().then((db) => new Promise((resolve, reject) => {
    const t = db.transaction(store, mode), s = t.objectStore(store);
    let out; try { out = fn(s); } catch (e) { reject(e); return; }
    t.oncomplete = () => resolve(out && out.result !== undefined ? out.result : out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  }));
}
const IDB = {
  all: (s) => idbTx(s, "readonly", (o) => o.getAll()),
  put: (s, row) => idbTx(s, "readwrite", (o) => o.put(row)),
  putMany: (s, rows) => idbTx(s, "readwrite", (o) => { rows.forEach((r) => o.put(r)); }),
  del: (s, id) => idbTx(s, "readwrite", (o) => o.delete(id)),
  clear: (s) => idbTx(s, "readwrite", (o) => o.clear()),
};

/* ============================ the store =============================== */
const Storage = {
  backend: "none",        /* sqlite | idb | none */
  reason: null,           /* why we fell back */
  db: null,               /* sql.js Database */
  handle: null,           /* OPFS FileHandle */
  bytes: 0,
  persisted: false,
  saving: false,
  dirty: false,
  timer: null,
  lastSaved: null,
  onError: () => {},

  async init() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        this.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
      }
    } catch (e) {}

    try {
      if (!navigator.storage || !navigator.storage.getDirectory) throw new Error("OPFS not supported in this browser");
      if (!window.__loadSqlJs) throw new Error("sql.js loader missing");
      const SQL = await window.__loadSqlJs();
      const root = await navigator.storage.getDirectory();
      this.handle = await root.getFileHandle(DB_FILE, { create: true });
      if (!this.handle.createWritable) throw new Error("OPFS is read-only here");
      const file = await this.handle.getFile();
      const buf = new Uint8Array(await file.arrayBuffer());
      this.db = buf.byteLength ? new SQL.Database(buf) : new SQL.Database();
      this.db.run(SCHEMA);
      ensureLanguageColumn(this.db);
      this.db.run("INSERT OR REPLACE INTO meta(k,v) VALUES('schema_version',?)", [String(SCHEMA_VERSION)]);
      this.bytes = buf.byteLength;
      this.backend = "sqlite";
      if (!buf.byteLength) await this.flush();
    } catch (e) {
      this.reason = (e && e.message) || "unknown";
      try { await openIDB(); this.backend = "idb"; } catch (e2) { this.backend = "none"; throw e2; }
    }

    /* best-effort flush when the tab goes away */
    const bye = () => { if (this.dirty) this.flush(); };
    window.addEventListener("pagehide", bye);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") bye(); });
    return this.backend;
  },

  /* ---- SQL helpers ---- */
  all(sql, params) {
    const st = this.db.prepare(sql);
    if (params) st.bind(params);
    const out = [];
    while (st.step()) out.push(st.getAsObject());
    st.free();
    return out;
  },
  run(sql, params) { this.db.run(sql, params || []); this.markDirty(); },

  markDirty() {
    this.dirty = true;
    if (this.timer) return;
    this.timer = setTimeout(() => { this.timer = null; this.flush(); }, 500);
  },

  /** Serialise the whole database and commit it atomically. */
  async flush() {
    if (this.backend !== "sqlite" || !this.dirty || this.saving) return;
    this.saving = true;
    let bytes;
    try { bytes = this.db.export(); this.dirty = false; }
    catch (e) { this.saving = false; this.onError("Could not serialise the database."); return; }
    try {
      const w = await this.handle.createWritable();
      await w.write(bytes);
      await w.close();
      this.bytes = bytes.byteLength;
      this.lastSaved = Date.now();
    } catch (e) {
      this.dirty = true;
      this.onError("Writing " + DB_FILE + " failed: " + ((e && e.message) || "unknown") + ". Data is still in memory — export a backup now.");
    } finally {
      this.saving = false;
      if (this.dirty) this.markDirty();
    }
  },

  /** Raw bytes of the database, for download or inspection. */
  async exportFile() {
    if (this.backend === "sqlite") { await this.flush(); return this.db.export(); }
    return null;
  },

  async importFile(bytes) {
    if (this.backend !== "sqlite") throw new Error("SQLite is not the active backend here");
    const SQL = await window.__loadSqlJs();
    const probe = new SQL.Database(new Uint8Array(bytes));
    const t = probe.exec("SELECT count(*) c FROM sqlite_master WHERE type='table' AND name IN ('questions','concepts')");
    const found = t.length ? t[0].values[0][0] : 0;
    if (found < 2) { probe.close(); throw new Error("that file is not a Bank database"); }
    probe.run(SCHEMA);
    ensureLanguageColumn(probe);
    if (this.db) this.db.close();
    this.db = probe;
    this.dirty = true;
    await this.flush();
  },

  info() {
    return {
      backend: this.backend, reason: this.reason, bytes: this.bytes,
      persisted: this.persisted, file: DB_FILE, lastSaved: this.lastSaved, dirty: this.dirty,
    };
  },
};

/* One-way migration flags. These must survive a wipe, otherwise clearing the
   bank makes it look empty and every migration source floods back in on the
   next refresh. Kept in localStorage first (a SQLite wipe cannot touch it),
   mirrored into meta as a backup for when localStorage is unavailable. */
const MIG = {
  key: (kind) => "qbank:migrated:" + kind,
  read(kind) {
    try { if (localStorage.getItem(this.key(kind))) return true; } catch (e) {}
    if (Storage.backend === "sqlite" && Storage.db) {
      try { if (Storage.all("SELECT v FROM meta WHERE k=?", ["migrated:" + kind]).length) return true; } catch (e) {}
    }
    return false;
  },
  write(kind) {
    try { localStorage.setItem(this.key(kind), String(Date.now())); } catch (e) {}
    if (Storage.backend === "sqlite" && Storage.db) {
      try { Storage.run("INSERT OR REPLACE INTO meta(k,v) VALUES(?,?)", ["migrated:" + kind, String(Date.now())]); } catch (e) {}
    }
  },
};

/* ====================== Repo — the app's only API ====================== */
/* Identical surface for both backends, so no view code knows the difference. */
const Repo = {
  async load() {
    if (Storage.backend === "sqlite") {
      const questions = Storage.all("SELECT " + Q_COLS + " FROM questions").map(rowToQ);
      const concepts = Storage.all("SELECT id,name,aliases FROM concepts").map((r) => {
        let aliases = [];
        try { aliases = JSON.parse(r.aliases || "[]"); } catch (e) {}
        return { id: r.id, name: r.name, aliases };
      });
      const languages = Storage.all("SELECT id,name,aliases FROM languages").map((r) => {
        let aliases = [];
        try { aliases = JSON.parse(r.aliases || "[]"); } catch (e) {}
        return { id: r.id, name: r.name, aliases };
      });
      const m = Storage.all("SELECT v FROM meta WHERE k='settings'");
      let settings = {};
      if (m.length) { try { settings = JSON.parse(m[0].v); } catch (e) {} }
      return { questions, concepts, languages, settings };
    }
    const [questions, concepts, languages, meta] = await Promise.all([IDB.all("questions"), IDB.all("concepts"), IDB.all("languages"), IDB.all("meta")]);
    const s = meta.find((x) => x.k === "settings");
    return { questions, concepts, languages, settings: (s && s.v) || {} };
  },

  async saveQuestion(q) {
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT OR REPLACE INTO questions(" + Q_COLS + ") VALUES " + Q_MARKS, qToRow(q));
      return;
    }
    return IDB.put("questions", q);
  },
  async saveQuestions(qs) {
    if (Storage.backend === "sqlite") {
      Storage.db.run("BEGIN");
      try {
        const st = Storage.db.prepare("INSERT OR REPLACE INTO questions(" + Q_COLS + ") VALUES " + Q_MARKS);
        qs.forEach((q) => { st.run(qToRow(q)); });
        st.free();
        Storage.db.run("COMMIT");
      } catch (e) { Storage.db.run("ROLLBACK"); throw e; }
      Storage.markDirty();
      return;
    }
    return IDB.putMany("questions", qs);
  },
  async removeQuestion(id) {
    if (Storage.backend === "sqlite") {
      Storage.run("DELETE FROM questions WHERE id=? OR variant_of=?", [id, id]);
      Storage.run("DELETE FROM vectors WHERE id=?", [id]);
      return;
    }
    await IDB.del("questions", id);
    return IDB.del("vectors", id);
  },
  async saveConcept(c) {
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT OR REPLACE INTO concepts(id,name,aliases) VALUES (?,?,?)",
        [c.id, c.name, JSON.stringify(c.aliases || [])]);
      return;
    }
    return IDB.put("concepts", c);
  },
  async saveConcepts(cs) { for (const c of cs) await this.saveConcept(c); },
  async removeConcept(id) {
    if (Storage.backend === "sqlite") { Storage.run("DELETE FROM concepts WHERE id=?", [id]); return; }
    return IDB.del("concepts", id);
  },
  async saveLanguage(l) {
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT OR REPLACE INTO languages(id,name,aliases) VALUES (?,?,?)",
        [l.id, l.name, JSON.stringify(l.aliases || [])]);
      return;
    }
    return IDB.put("languages", l);
  },
  async saveLanguages(ls) { for (const l of ls) await this.saveLanguage(l); },
  async removeLanguage(id) {
    if (Storage.backend === "sqlite") { Storage.run("DELETE FROM languages WHERE id=?", [id]); return; }
    return IDB.del("languages", id);
  },
  async saveSettings(v) {
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT OR REPLACE INTO meta(k,v) VALUES('settings',?)", [JSON.stringify(v)]);
      return;
    }
    return IDB.put("meta", { k: "settings", v });
  },

  /* vectors live as raw little-endian float32 blobs: 1536 bytes each */
  async allVectors() {
    const m = new Map();
    if (Storage.backend === "sqlite") {
      Storage.all("SELECT id,v FROM vectors").forEach((r) => {
        const u8 = r.v instanceof Uint8Array ? r.v : new Uint8Array(r.v);
        const copy = new Uint8Array(u8.length);
        copy.set(u8);
        m.set(r.id, new Float32Array(copy.buffer));
      });
      return m;
    }
    (await IDB.all("vectors")).forEach((r) => m.set(r.id, r.v));
    return m;
  },
  async putVector(id, v) {
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT OR REPLACE INTO vectors(id,dim,v) VALUES (?,?,?)",
        [id, v.length, new Uint8Array(v.buffer, v.byteOffset, v.byteLength)]);
      return;
    }
    return IDB.put("vectors", { id, v });
  },
  async removeVector(id) {
    if (Storage.backend === "sqlite") { Storage.run("DELETE FROM vectors WHERE id=?", [id]); return; }
    return IDB.del("vectors", id);
  },
  async clearVectors() {
    if (Storage.backend === "sqlite") { Storage.run("DELETE FROM vectors"); return; }
    return IDB.clear("vectors");
  },

  async logReview(r) {
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT INTO reviews(qid,at,grade,elapsed,stability,difficulty,interval,coverage,transcript_len) VALUES (?,?,?,?,?,?,?,?,?)",
        [r.qid, r.at, r.grade, r.elapsed, r.stability, r.difficulty, r.interval,
         r.coverage == null ? null : r.coverage, r.transcriptLen || 0]);
      return;
    }
    return IDB.put("reviews", r);
  },
  async allReviews() {
    if (Storage.backend === "sqlite") return Storage.all("SELECT * FROM reviews ORDER BY at");
    return IDB.all("reviews");
  },

  /** Aggregates the old code did in JS. Free once the data is in SQL. */
  async stats() {
    if (Storage.backend !== "sqlite") return null;
    const g = (sql) => { const r = Storage.all(sql); return r.length ? r[0] : {}; };
    return {
      totals: g("SELECT count(*) questions, count(DISTINCT concept_id) concepts, sum(variant_of IS NOT NULL) variants FROM questions"),
      due: g("SELECT count(*) n FROM questions WHERE due<=" + now() + " AND variant_of IS NULL").n,
      reviewed: g("SELECT count(*) n, avg(elapsed) avg_secs, avg(coverage) avg_cov FROM reviews"),
      byAngle: Storage.all("SELECT angle, count(*) n, avg(stability) avg_stab FROM questions WHERE variant_of IS NULL GROUP BY angle"),
      weakest: Storage.all(
        "SELECT c.name, count(q.id) n, count(DISTINCT q.angle) angles, avg(coalesce(q.stability,0)) stab " +
        "FROM concepts c LEFT JOIN questions q ON q.concept_id=c.id AND q.variant_of IS NULL " +
        "GROUP BY c.id ORDER BY angles ASC, stab ASC LIMIT 5"),
      lapsing: Storage.all("SELECT text, lapses FROM questions WHERE lapses>0 ORDER BY lapses DESC LIMIT 5"),
    };
  },

  async wipe() {
    if (Storage.backend === "sqlite") {
      ["reviews", "vectors", "questions", "concepts", "languages", "meta"].forEach((t) => Storage.db.run("DELETE FROM " + t));
      /* DELETE only frees pages inside the file; VACUUM actually shrinks it */
      Storage.db.run("VACUUM");
    }
    /* Clear the migration sources too, or they repopulate on the next refresh. */
    let cleared = { idb: false, legacy: false };
    try {
      await Promise.all(["questions", "concepts", "languages", "vectors", "reviews", "meta"].map((n) => IDB.clear(n)));
      cleared.idb = true;
    } catch (e) {}
    try { localStorage.removeItem(LEGACY_KEY); cleared.legacy = true; } catch (e) {}
    /* Re-assert after the meta table was truncated, so nothing migrates again. */
    MIG.write("idb"); MIG.write("legacy");
    if (Storage.backend === "sqlite") { Storage.markDirty(); await Storage.flush(); }
    return cleared;
  },

  /** IndexedDB -> SQLite, once, on the first run after this upgrade. */
  async migrateIDB() {
    if (Storage.backend !== "sqlite") return 0;
    if (MIG.read("idb")) return 0;
    const have = Storage.all("SELECT count(*) c FROM questions");
    if (have[0].c > 0) { MIG.write("idb"); return 0; }
    let qs = [], cs = [], ls = [], vs = [], rs = [];
    try {
      qs = await IDB.all("questions"); cs = await IDB.all("concepts");
      ls = await IDB.all("languages").catch(() => []);
      vs = await IDB.all("vectors"); rs = await IDB.all("reviews");
    } catch (e) { return 0; }   /* could not read: do not mark, try again later */
    MIG.write("idb");
    if (!qs.length && !cs.length && !ls.length) return 0;
    await this.saveConcepts(cs);
    await this.saveLanguages(ls);
    await this.saveQuestions(qs);
    for (const v of vs) if (v.v) await this.putVector(v.id, v.v);
    for (const r of rs) await this.logReview(r);
    await Storage.flush();
    return qs.length;
  },

  /** localStorage -> whatever backend is active, once. */
  async migrateLegacy() {
    if (MIG.read("legacy")) return 0;
    let raw = null;
    try { raw = localStorage.getItem(LEGACY_KEY); } catch (e) { return 0; }
    if (!raw) { MIG.write("legacy"); return 0; }
    const cur = await this.load();
    if (cur.questions.length) { MIG.write("legacy"); return 0; }
    try {
      const old = JSON.parse(raw);
      const qs = (old.questions || []).map((q) => ({
        ...q,
        stability: q.box ? [0.5, 1.4, 3.7, 9, 21, 55][Math.min(q.box, 5)] : null,
        difficultyF: 5, interval: null,
      }));
      await this.saveConcepts(old.concepts || []);
      await this.saveLanguages(old.languages || []);
      await this.saveQuestions(qs);
      if (Storage.backend === "sqlite") await Storage.flush();
      MIG.write("legacy");
      return qs.length;
    } catch (e) { MIG.write("legacy"); return 0; }
  },
};

const stamp = () => new Date().toISOString().slice(0, 10);

async function saveBlob(data, name, mime) {
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description: "Bank data", accept: { [mime]: ["." + name.split(".").pop()] } }],
      });
      const w = await handle.createWritable();
      await w.write(data); await w.close();
      return { ok: true, how: "picker", name };
    } catch (e) { if (e && e.name === "AbortError") return { ok: false, how: "cancelled" }; }
  }
  const blob = new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return { ok: true, how: "download", name };
}

function mergeImport(current, incoming) {
  const qById = new Map(current.questions.map((q) => [q.id, q]));
  const cById = new Map(current.concepts.map((c) => [c.id, c]));
  const cByName = new Map(current.concepts.map((c) => [cnorm(c.name), c]));
  const lById = new Map((current.languages || []).map((l) => [l.id, l]));
  const lByName = new Map((current.languages || []).map((l) => [cnorm(l.name), l]));
  let added = 0, updated = 0, skipped = 0, newConcepts = 0, newLanguages = 0;
  const remap = new Map();
  const remapLang = new Map();

  (incoming.concepts || []).forEach((c) => {
    const sameName = cByName.get(cnorm(c.name));
    if (cById.has(c.id)) { remap.set(c.id, c.id); return; }
    if (sameName) { remap.set(c.id, sameName.id); return; }
    cById.set(c.id, c); cByName.set(cnorm(c.name), c); remap.set(c.id, c.id); newConcepts++;
  });
  (incoming.languages || []).forEach((l) => {
    const sameName = lByName.get(cnorm(l.name));
    if (lById.has(l.id)) { remapLang.set(l.id, l.id); return; }
    if (sameName) { remapLang.set(l.id, sameName.id); return; }
    lById.set(l.id, l); lByName.set(cnorm(l.name), l); remapLang.set(l.id, l.id); newLanguages++;
  });
  (incoming.questions || []).forEach((q) => {
    const mapped = {
      ...q,
      conceptId: q.conceptId ? (remap.get(q.conceptId) || q.conceptId) : null,
      languageId: q.languageId ? (remapLang.get(q.languageId) || q.languageId) : null,
    };
    const mine = qById.get(q.id);
    if (!mine) {
      const clash = [...qById.values()].find((x) => lexScore(x.text, mapped.text) >= 92);
      if (clash) { skipped++; return; }
      qById.set(mapped.id, mapped); added++;
    } else if ((mapped.last || mapped.created || 0) > (mine.last || mine.created || 0)) {
      qById.set(q.id, mapped); updated++;
    } else skipped++;
  });
  return {
    data: { questions: [...qById.values()], concepts: [...cById.values()], languages: [...lById.values()] },
    report: { added, updated, skipped, newConcepts, newLanguages },
  };
}

/* ====================== ML manager (unchanged surface) ================= */
const ML = {
  state: "off", progress: 0, error: null, extractor: null, angleVecs: null,
  listeners: new Set(), cache: new Map(),
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit() { this.listeners.forEach((f) => f(this.state, this.progress, this.error)); },
  async enable() {
    if (this.state === "ready" || this.state === "loading") return this.state === "ready";
    this.state = "loading"; this.progress = 0; this.error = null; this.emit();
    try {
      if (!window.__loadTransformers) throw new Error("module loader missing");
      this.extractor = await window.__loadTransformers((p) => {
        if (p && p.status === "progress" && p.total) { this.progress = Math.round((p.loaded / p.total) * 100); this.emit(); }
      });
      this.state = "ready"; this.progress = 100; this.emit();
      this.angleVecs = {};
      for (const a of ANGLES) this.angleVecs[a.id] = await this.embed(a.name + ". " + a.probe);
      this.emit();
      return true;
    } catch (e) {
      this.state = "failed"; this.error = (e && e.message) || "load failed"; this.emit(); return false;
    }
  },
  async embed(text) {
    if (this.state !== "ready" || !text) return null;
    const key = text.slice(0, 400);
    if (this.cache.has(key)) return this.cache.get(key);
    const out = await this.extractor(key, { pooling: "mean", normalize: true });
    const v = new Float32Array(out.data);
    if (this.cache.size > 300) this.cache.clear();
    this.cache.set(key, v);
    return v;
  },
  async embedMany(texts) { const o = []; for (const t of texts) o.push(await this.embed(t)); return o; },
};

const DEFAULT_SETTINGS = { talkTarget: 90, retention: 0.9, mlEnabled: false, voice: true, theme: "light" };

/* ============================== app shell ============================== */
function QuestionBank() {
  const [boot, setBoot] = useState("loading");
  const [questions, setQuestions] = useState([]);
  const [concepts, setConcepts] = useState([]);
  const [languages, setLanguages] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [vecs, setVecs] = useState(new Map());
  const [mlState, setMlState] = useState({ state: "off", progress: 0, error: null });
  const [backfill, setBackfill] = useState(null);
  const [tab, setTab] = useState("add");
  const [prefill, setPrefill] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [fatal, setFatal] = useState(null);
  const [notice, setNotice] = useState(null);
  const [store, setStore] = useState(null);
  const [migrated, setMigrated] = useState(null);

  useEffect(() => ML.on((state, progress, error) => setMlState({ state, progress, error })), []);

  useEffect(() => {
    Storage.onError = (m) => setFatal(m);
    (async () => {
      try {
        const backend = await Storage.init();
        const lifted = await Repo.migrateIDB();
        const legacy = await Repo.migrateLegacy();
        const d = await Repo.load();
        const v = await Repo.allVectors();
        setQuestions(d.questions);
        setConcepts(d.concepts);
        setLanguages(d.languages || []);
        setSettings({ ...DEFAULT_SETTINGS, ...d.settings });
        setVecs(v);
        setStore(Storage.info());
        /* smart default: land on Review when there's a queue to clear,
           otherwise Add — so opening the app is never a dead end. */
        const dueNow = d.questions.filter((q) => !q.variantOf && isDue(q)).length;
        setTab(dueNow > 0 ? "review" : "add");
        if (lifted) setMigrated({ from: "IndexedDB", n: lifted });
        else if (legacy) setMigrated({ from: "localStorage", n: legacy });
        setBoot("ready");
        if (backend === "idb") {
          setNotice("Running on IndexedDB instead of the SQLite file: " + (Storage.reason || "unknown") + ". Everything works, but there is no single database file to copy out.");
        }
        if (d.settings && d.settings.mlEnabled) enableML(d.questions, v);
      } catch (e) {
        setFatal("This browser blocked local storage entirely, so nothing can be saved. Private mode often does this — try a normal window.");
        setBoot("ready");
      }
    })();
  }, []);

  /* ---- writes go through here so IndexedDB and memory never diverge ---- */
  const putQ = useCallback(async (q) => {
    setQuestions((prev) => { const i = prev.findIndex((x) => x.id === q.id); if (i < 0) return [q, ...prev]; const c = [...prev]; c[i] = q; return c; });
    try { await Repo.saveQuestion(q); setStore(Storage.info()); } catch (e) { setFatal("Save failed. Your last change is only in memory."); }
  }, []);
  const dropQ = useCallback(async (id) => {
    setQuestions((prev) => prev.filter((x) => x.id !== id && x.variantOf !== id));
    try { await Repo.removeQuestion(id); setStore(Storage.info()); } catch (e) {}
  }, []);
  const putC = useCallback(async (c) => {
    setConcepts((prev) => { const i = prev.findIndex((x) => x.id === c.id); if (i < 0) return [...prev, c]; const n = [...prev]; n[i] = c; return n; });
    try { await Repo.saveConcept(c); } catch (e) {}
  }, []);
  const putL = useCallback(async (l) => {
    setLanguages((prev) => { const i = prev.findIndex((x) => x.id === l.id); if (i < 0) return [...prev, l]; const n = [...prev]; n[i] = l; return n; });
    try { await Repo.saveLanguage(l); } catch (e) {}
  }, []);
  const putSettings = useCallback(async (patch) => {
    setSettings((prev) => { const next = { ...prev, ...patch }; Repo.saveSettings(next).catch(() => {}); return next; });
  }, []);
  const putVec = useCallback(async (id, v) => {
    setVecs((prev) => { const m = new Map(prev); m.set(id, v); return m; });
    try { await Repo.putVector(id, v); } catch (e) {}
  }, []);

  /* ---- turn on embeddings and backfill every question that lacks one ---- */
  const enableML = useCallback(async (qs, existing) => {
    const ok = await ML.enable();

    const have = existing || vecs;

    if (todo.length) {
      setBackfill({ done: 0, total: todo.length });
      const next = new Map(have);
      for (let i = 0; i < todo.length; i++) {
        const v = await ML.embed(todo[i].text);
        if (v) { next.set(todo[i].id, v); Repo.putVector(todo[i].id, v).catch(() => {}); }
        if (i % 3 === 0 || i === todo.length - 1) setBackfill({ done: i + 1, total: todo.length });
      }
      setVecs(next);
      setBackfill(null);
