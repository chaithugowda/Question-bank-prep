function DataView({ ctx, mlState, backfill, store, enableML, setAll }) {
  const { questions, concepts, languages, settings, vecs, putSettings, refreshStore, runSync } = ctx;
  const [msg, setMsg] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const [usage, setUsage] = useState(null);
  const [reviewCount, setReviewCount] = useState(null);
  const [stats, setStats] = useState(null);
  const [sqlBusy, setSqlBusy] = useState(false);
  const [installable, setInstallable] = useState(typeof window !== "undefined" && !!window.__installPrompt);
  const [installed, setInstalled] = useState(
    typeof matchMedia === "function" && matchMedia("(display-mode: standalone)").matches);
  const [tokenDraft, setTokenDraft] = useState("");
  const [syncing, setSyncing] = useState(false);
  const fileRef = useRef(null);
  const dbRef = useRef(null);

  useEffect(() => {
    const on = () => setInstallable(true);
    const off = () => { setInstallable(false); setInstalled(true); };
    window.addEventListener("bank-installable", on);
    window.addEventListener("bank-installed", off);
    return () => { window.removeEventListener("bank-installable", on); window.removeEventListener("bank-installed", off); };
  }, []);

  useEffect(() => {
    if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then((e) => setUsage(e)).catch(() => {});
    Repo.allReviews().then((r) => setReviewCount(r.length)).catch(() => {});
    Repo.stats().then(setStats).catch(() => {});
  }, [questions]);

  async function doExport() {
    const reviews = await Repo.allReviews().catch(() => []);
    const safe = { ...settings }; delete safe.ghToken; delete safe.gistId;
    const text = buildExport({ questions, concepts, languages, settings: safe }, reviews);
    const r = await saveBlob(text, "the-bank-" + stamp() + ".json", "application/json");
    if (r.ok) setMsg({ k: "ok", t: "Backup written", b: r.how === "picker" ? "Saved as " + r.name + " where you chose." : "Downloaded as " + r.name + ". Vectors are left out — they rebuild in seconds." });
    else setMsg({ k: "warn", t: "Cancelled", b: "Nothing was written." });
  }

  async function doImport(file) {
    try {
      const text = await file.text();
      const incoming = JSON.parse(text);
      if (incoming.format !== "thebank") throw new Error("not a Bank backup");
      const { data, report } = mergeImport({ questions, concepts, languages }, incoming);
      await Repo.saveConcepts(data.concepts);
      await Repo.saveLanguages(data.languages);
      await Repo.saveQuestions(data.questions);
      setAll(data.questions, data.concepts, data.languages);
      refreshStore();
      setMsg({ k: "ok", t: "Merged", b: report.added + " added, " + report.updated + " updated, " + report.skipped + " skipped as already here, " + report.newConcepts + " new concepts, " + report.newLanguages + " new languages. Nothing was deleted." });
    } catch (e) {
      setMsg({ k: "warn", t: "Couldn't read that file", b: (e && e.message) || "Pick a .json backup exported from The Bank." });
    }
  }

  const mb = (n) => (n / 1048576).toFixed(1) + " MB";
  const kb = (n) => (n < 1048576 ? Math.max(1, Math.round(n / 1024)) + " KB" : (n / 1048576).toFixed(2) + " MB");

  return (
    <>
      {msg && <div className={"alert " + (msg.k === "ok" ? "ok" : "warn")} style={{ marginTop: 0, marginBottom: 14 }}><b>{msg.t}</b>{msg.b}</div>}

      <div className="card">
        <span className="eyebrow">Sync across devices</span>
        {settings.ghToken ? (
          <>
            <div className="kv"><span>Backend</span><b>private GitHub gist</b></div>
            <div className="kv"><span>Gist</span><b>{settings.gistId ? settings.gistId.slice(0, 12) + "…" : "created on first sync"}</b></div>
            <div className="kv"><span>Last sync</span><b>{settings.lastSyncAt ? new Date(settings.lastSyncAt).toLocaleString() : "never"}</b></div>
            <div className="row" style={{ marginTop: 12 }}>
              <button className="btn" disabled={syncing} onClick={async () => {
                setSyncing(true);
                try {
                  const { report } = await runSync();
                  const bits = [];
                  if (report.questionsIn) bits.push(report.questionsIn + " new");
                  if (report.questionsUpdated) bits.push(report.questionsUpdated + " updated");
                  if (report.questionsDeleted) bits.push(report.questionsDeleted + " deleted elsewhere");
                  if (report.reviewsIn) bits.push(report.reviewsIn + " reviews");
                  setMsg({ k: "ok", t: "Synced",
                    b: bits.length ? "Pulled in " + bits.join(", ") + ". Your copy is pushed back up." : "Already up to date on both sides." });
                } catch (e) {
                  setMsg({ k: "warn", t: "Sync failed", b: (e && e.message) || "Unknown error." });
                }
                setSyncing(false);
              }}>{syncing ? "Syncing…" : "Sync now"}</button>
              <button className="btn line" disabled={syncing} onClick={() => {
                putSettings({ ghToken: "", gistId: settings.gistId || "" });
                setMsg({ k: "ok", t: "Token removed", b: "This device will stop syncing. Your gist and your local data are untouched." });
              }}>Disconnect</button>
            </div>
            <p className="hint">
              Merge is newest-wins per question, and deletions carry across. Editing the same question on two
              devices while both are offline means one edit loses — sync after each session and it never comes up.
            </p>
          </>
        ) : (
          <>
            <p className="note" style={{ marginTop: 0 }}>
              Add questions on your laptop and pull them onto your phone through a <b>private gist</b> that only
              you can read. No server, no account, no cost — and you can delete it at any time.
            </p>
            <p className="note">
              Create a token at <b>github.com/settings/tokens</b> → Generate new token (classic) → tick only
              the <b>gist</b> scope. Nothing else. Paste it below on each device.
            </p>
            <div className="field">
              <input className="t" type="password" autoComplete="off" spellCheck="false"
                value={tokenDraft} onChange={(e) => setTokenDraft(e.target.value)}
                placeholder="ghp_… (gist scope only)" />
            </div>
            <button className="btn violet" style={{ marginTop: 10 }} disabled={!tokenDraft.trim()}
              onClick={() => { putSettings({ ghToken: tokenDraft.trim() }); setTokenDraft("");
                setMsg({ k: "ok", t: "Token saved", b: "Tap Sync now. The first sync creates the gist; on your other device, paste the same token and it will find it." }); }}>
              Save token
            </button>
            <p className="hint">
              The token is stored in this browser in plain text, the same as any logged-in session — so only do
              this on devices you control, and keep the scope to gist alone. It is never included in exports or
              pushed to the gist.
            </p>
          </>
        )}
      </div>

      <div className="card">
        <span className="eyebrow">Install on this device</span>
        {installed ? (
          <>
            <div className="alert ok" style={{ marginTop: 0 }}>
              <b>Running as an installed app</b>
              Full screen, its own icon, and it opens offline — the whole app is cached on this device.
            </div>
            <p className="hint">Your database lives in this install. Uninstalling clears it, so export a backup first.</p>
          </>
        ) : installable ? (
          <>
            <p className="note" style={{ marginTop: 0 }}>
              Add it to your home screen and it opens full screen with no browser bar, starts instantly,
              and works with no signal. Same data, same database file.
            </p>
            <button className="btn violet" style={{ marginTop: 12 }} onClick={async () => {
              const p = window.__installPrompt;
              if (!p) return setMsg({ k: "warn", t: "Not available", b: "Use your browser menu — Chrome calls it Add to Home screen." });
              p.prompt();
              const res = await p.userChoice.catch(() => null);
              window.__installPrompt = null;
              setInstallable(false);
              if (res && res.outcome === "accepted") setMsg({ k: "ok", t: "Installing", b: "Look for The Bank on your home screen and in your app drawer." });
            }}>Install The Bank</button>
            <p className="hint">Long-press the icon afterwards for shortcuts straight into Review, Add or Stats.</p>
          </>
        ) : (
          <>
            <p className="note" style={{ marginTop: 0 }}>
              On Android, open your browser menu and choose <b>Add to Home screen</b> — it installs as a real app
              with its own icon, no browser bar, and full offline support.
              On iPhone it is the Share button, then <b>Add to Home Screen</b>.
            </p>
            <p className="hint">On iOS this also stops Safari clearing your database after a week away.</p>
          </>
        )}
      </div>

      <div className="card">
        <span className="eyebrow">Semantic matching</span>
        {mlState.state === "ready" ? (
          <>
            <div className="alert ml" style={{ marginTop: 0 }}>
              <b>On — {vecs.size} of {questions.length} questions indexed</b>
              The gauge now blends meaning (60%) with wording (40%), so a paraphrase with no shared words still trips it.
              Angles and concepts are auto-tagged from the same vectors.
            </div>
            <div className="row" style={{ marginTop: 10 }}>
              <button className="btn tiny line" onClick={() => putSettings({ mlEnabled: false })}>Don't load it next time</button>
            </div>
          </>
        ) : mlState.state === "loading" || backfill ? (
          <div className="alert ml" style={{ marginTop: 0 }}>
            <b>{backfill ? "Indexing your questions" : "Downloading the model"}</b>
            {backfill ? backfill.done + " of " + backfill.total : "all-MiniLM-L6-v2, about 23 MB, cached after this"}
            <div className="bar"><i style={{ width: (backfill ? Math.round((backfill.done / backfill.total) * 100) : mlState.progress) + "%" }} /></div>
          </div>
        ) : (
          <>
            <p className="note" style={{ marginTop: 0 }}>
              Right now duplicates are caught by wording alone. <b>"What is the event loop?"</b> and
              <b> "How does JavaScript handle async work under the hood?"</b> share no words, so they both get in.
            </p>
            <p className="note">
              Turning this on downloads a 23 MB sentence-embedding model that runs entirely in this browser.
              Nothing is uploaded, there's no API key, and it's cached after the first visit.
            </p>
            {mlState.state === "failed" && (
              <div className="alert warn"><b>Last attempt failed</b>{mlState.error}. Everything still works on wording alone.</div>
            )}
            <button className="btn violet" style={{ marginTop: 12 }} onClick={enableML}>Turn on semantic matching</button>
          </>
        )}
      </div>

      <div className="card">
        <span className="eyebrow">Scheduling</span>
        <div className="field">
          <label className="hint" style={{ marginTop: 0 }} htmlFor="ret">Target retention — how much you're willing to forget</label>
          <select id="ret" className="t" value={String(settings.retention)} onChange={(e) => putSettings({ retention: parseFloat(e.target.value) })}>
            <option value="0.85">85% — fewer reviews, more slips</option>
            <option value="0.9">90% — the default balance</option>
            <option value="0.95">95% — interview next week</option>
          </select>
        </div>
        <div className="field">
          <label className="hint" style={{ marginTop: 0 }} htmlFor="goal">Daily goal — what counts as a day done</label>
          <select id="goal" className="t" value={String(settings.dailyGoal)} onChange={(e) => putSettings({ dailyGoal: parseInt(e.target.value, 10) })}>
            <option value="5">5 cards — keep the streak cheap</option>
            <option value="10">10 cards — the default</option>
            <option value="20">20 cards — serious run-up</option>
            <option value="40">40 cards — interview week</option>
          </select>
        </div>
        <div className="field">
          <label className="hint" style={{ marginTop: 0 }} htmlFor="tt">Spoken answer target</label>
          <select id="tt" className="t" value={String(settings.talkTarget)} onChange={(e) => putSettings({ talkTarget: parseInt(e.target.value, 10) })}>
            <option value="60">60 seconds — screening round</option>
            <option value="90">90 seconds — the default</option>
            <option value="150">150 seconds — system design</option>
          </select>
        </div>
        <p className="note">FSRS tracks a stability and a difficulty per question and fits the interval to your own grades, so raising retention shortens every gap at once.</p>
      </div>

      <div className="card">
        <span className="eyebrow">Where your data lives</span>
        {store && store.backend === "sqlite" ? (
          <>
            <div className="kv"><span>Engine</span><b>SQLite (WASM) · schema v{SCHEMA_VERSION}</b></div>
            <div className="kv"><span>File</span><b>OPFS / {store.file}</b></div>
            <div className="kv"><span>File size</span><b>{kb(store.bytes)}{store.dirty ? " · unsaved changes" : ""}</b></div>
            <div className="kv"><span>Eviction protection</span><b style={{ color: store.persisted ? "var(--clear)" : "var(--warn)" }}>{store.persisted ? "granted" : "not granted"}</b></div>
            <div className="kv"><span>Tables</span><b>questions · concepts · languages · vectors · reviews · meta</b></div>
            <div className="kv"><span>Rows</span><b>{questions.length} q · {concepts.length} c · {languages.length} lang · {vecs.size} vec · {reviewCount === null ? "…" : reviewCount} rev</b></div>
            {usage && <div className="kv"><span>Origin usage</span><b>{mb(usage.usage || 0)} of {mb(usage.quota || 0)}</b></div>}
            <p className="note">
              A real SQLite database, held in memory and committed to one file after every change.
              The write goes through a swap file and commits on close, so a crash mid-save cannot corrupt it.
              {!store.persisted && " Eviction protection was declined, so a browser under storage pressure may clear this — keep an exported copy."}
            </p>
            <div className="row" style={{ marginTop: 12 }}>
              <button className="btn line" disabled={sqlBusy} onClick={async () => {
                setSqlBusy(true);
                const bytes = await Storage.exportFile();
                setSqlBusy(false);
                if (!bytes) return setMsg({ k: "warn", t: "Not available", b: "SQLite is not the active backend." });
                const r = await saveBlob(bytes, "bank-" + stamp() + ".sqlite3", "application/vnd.sqlite3");
                refreshStore();
                setMsg(r.ok
                  ? { k: "ok", t: "Database file written", b: r.name + " — open it in DB Browser for SQLite or query it with the sqlite3 CLI." }
                  : { k: "warn", t: "Cancelled", b: "Nothing was written." });
              }}>{sqlBusy ? "Working…" : "Download the .sqlite3 file"}</button>
              <button className="btn line" onClick={() => dbRef.current && dbRef.current.click()}>Restore from .sqlite3</button>
            </div>
            <input ref={dbRef} type="file" accept=".sqlite3,.sqlite,.db,application/vnd.sqlite3,application/octet-stream" style={{ display: "none" }}
              onChange={async (e) => {
                const f = e.target.files && e.target.files[0]; e.target.value = "";
                if (!f) return;
                try {
                  await Storage.importFile(await f.arrayBuffer());
                  const d = await Repo.load();
                  setAll(d.questions, d.concepts, d.languages);
                  refreshStore();
                  setMsg({ k: "ok", t: "Database replaced", b: "Loaded " + d.questions.length + " questions from " + f.name + ". This overwrote the previous file." });
                } catch (err) {
                  setMsg({ k: "warn", t: "Couldn't open that file", b: (err && err.message) || "Pick a .sqlite3 file exported from The Bank." });
                }
              }} />
            <p className="hint">Restoring replaces the whole database rather than merging. Use the JSON import below when you want to combine two devices.</p>
          </>
        ) : (
          <>
            <div className="kv"><span>Engine</span><b>IndexedDB (fallback)</b></div>
            <div className="kv"><span>Reason</span><b>{store && store.reason ? store.reason : "unknown"}</b></div>
            <div className="kv"><span>Rows</span><b>{questions.length} q · {concepts.length} c · {vecs.size} vec</b></div>
            {usage && <div className="kv"><span>Origin usage</span><b>{mb(usage.usage || 0)} of {mb(usage.quota || 0)}</b></div>}
            <p className="note">
              The SQLite file could not be opened here, so the app is using IndexedDB. Nothing is lost and every feature
              works — you just cannot copy out a single database file. OPFS needs Safari 16.4+, Chrome 108+ or Firefox 111+,
              and it is unavailable over file:// and in some private modes.
            </p>
          </>
        )}
      </div>

      {stats && stats.reviewed && stats.reviewed.n > 0 && (
        <div className="card">
          <span className="eyebrow">What the review log says</span>
          <div className="kv"><span>Reviews recorded</span><b>{stats.reviewed.n}</b></div>
          <div className="kv"><span>Average answer length</span><b>{Math.round(stats.reviewed.avg_secs || 0)}s</b></div>
          {stats.reviewed.avg_cov != null && <div className="kv"><span>Average beat coverage</span><b>{Math.round(stats.reviewed.avg_cov * 100)}%</b></div>}
          {stats.weakest && stats.weakest.length > 0 && (
            <div className="kv"><span>Weakest concept</span><b>{stats.weakest[0].name} · {stats.weakest[0].angles}/6</b></div>
          )}
          {stats.lapsing && stats.lapsing.length > 0 && (
            <p className="note">Most blanked on: “{stats.lapsing[0].text}” — {stats.lapsing[0].lapses} time{stats.lapsing[0].lapses === 1 ? "" : "s"}.</p>
          )}
          <p className="hint">Aggregated with SQL over the reviews table, which is append-only — nothing about your history is overwritten.</p>
        </div>
      )}

      <div className="card">
        <span className="eyebrow">Backup and transfer</span>
        <p className="note" style={{ marginTop: 0 }}>
          One JSON file with every question, concept, language, and review. Vectors are excluded — they're derived data
          that rebuilds in seconds, and including them would triple the file.
        </p>
        <div className="row" style={{ marginTop: 12 }}>
          <button className="btn" onClick={doExport}>Export a backup</button>
          <button className="btn line" onClick={() => fileRef.current && fileRef.current.click()}>Import a backup</button>
        </div>
        <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: "none" }}
          onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) doImport(f); e.target.value = ""; }} />
        <p className="hint">Import merges by id, newest wins, and refuses text duplicates. It never deletes anything you already have — that's how you move between phone and laptop.</p>
      </div>

      <div className="card">
        <span className="eyebrow">Start over</span>
        {confirmReset ? (
          <>
            <p className="note" style={{ marginTop: 0 }}>This truncates every table in bank.sqlite3 and also clears the old IndexedDB and localStorage copies, so nothing comes back on refresh. Export first if you want them back.</p>
            <div className="row" style={{ marginTop: 10 }}>
              <button className="btn danger" onClick={async () => { await Repo.wipe(); setAll([], [], []); refreshStore(); setConfirmReset(false); setMsg({ k: "ok", t: "Cleared", b: "Every table truncated, old IndexedDB and localStorage copies cleared, file vacuumed. It will stay empty." }); }}>Delete everything</button>
              <button className="btn line" onClick={() => setConfirmReset(false)}>Keep it</button>
            </div>
          </>
        ) : (
          <button className="btn line" onClick={() => setConfirmReset(true)}>Clear the bank</button>
        )}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<QuestionBank />);
</script>
</body>
</html>
