<script>
/* PWA plumbing, deliberately outside React so it works before the app boots. */
(function () {
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").then(function (reg) {
        /* A new build is waiting: offer a reload rather than swapping the
           page out mid-session, which would lose an in-progress answer. */
        function offer(worker) {
          var bar = document.createElement("div");
          bar.setAttribute("style",
            "position:fixed;left:12px;right:12px;bottom:12px;z-index:999;display:flex;gap:10px;" +
            "align-items:center;justify-content:space-between;background:#141A26;color:#fff;" +
            "border-radius:12px;padding:12px 14px;font:13px/1.4 system-ui,sans-serif;" +
            "box-shadow:0 12px 30px -12px rgba(0,0,0,.5)");
          bar.innerHTML = "<span>A new version is ready.</span>";
          var btn = document.createElement("button");
          btn.textContent = "Reload";
          btn.setAttribute("style",
            "background:#fff;color:#141A26;border:0;border-radius:8px;padding:7px 13px;" +
            "font:500 13px system-ui,sans-serif;cursor:pointer");
          btn.onclick = function () { worker.postMessage("skip-waiting"); };
          bar.appendChild(btn);
          document.body.appendChild(bar);
        }
        if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
        reg.addEventListener("updatefound", function () {
          var w = reg.installing;
          if (!w) return;
          w.addEventListener("statechange", function () {
            if (w.state === "installed" && navigator.serviceWorker.controller) offer(w);
          });
        });
      }).catch(function () { /* http:// or unsupported — the app still runs */ });
    });
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }

  /* Chrome fires this when the app is installable; stash it so Settings can
     show a real Install button instead of hiding in the browser menu. */
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    window.__installPrompt = e;
    window.dispatchEvent(new CustomEvent("bank-installable"));
  });
  window.addEventListener("appinstalled", function () {
    window.__installPrompt = null;
    window.dispatchEvent(new CustomEvent("bank-installed"));
  });
})();
</script>

<script>
/* sql.js: SQLite compiled to WebAssembly. Classic script, so it is injected
   on demand rather than imported. Loaded at boot because it IS the store. */
window.__SQLJS_BASE = "https://cdn.jsdelivr.net/npm/sql.js@1/dist/";
window.__loadSqlJs = function () {
  if (window.__sqlPromise) return window.__sqlPromise;
  window.__sqlPromise = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = window.__SQLJS_BASE + "sql-wasm.js";
    s.onload = function () {
      if (typeof initSqlJs !== "function") return reject(new Error("sql.js did not initialise"));
      initSqlJs({ locateFile: function (f) { return window.__SQLJS_BASE + f; } }).then(resolve, reject);
    };
    s.onerror = function () { reject(new Error("sql.js CDN unreachable")); };
    document.head.appendChild(s);
  });
  return window.__sqlPromise;
};
</script>

<script type="module">
/* Transformers.js is an ES module, so it loads here and hands the pipeline
   back to the classic script below. Lazy on purpose: nothing downloads until
   the user turns semantic matching on. */
window.__loadTransformers = async function (onProgress) {
  const mod = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
  mod.env.allowLocalModels = false;
  mod.env.useBrowserCache = true;
  return await mod.pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2", {
    quantized: true,
    progress_callback: onProgress,
  });
};
</script>

/* ======================= MOTION =======================
   Two rules govern everything below.
   1. Nothing on the typing path animates. The collision gauge has to read as
      a live instrument, so its ticks move immediately; only the readout counts.
   2. No element is left at opacity:0 in a static rule. Every reveal lives in
      a keyframe, so when prefers-reduced-motion kills animation the content
      is simply there rather than permanently invisible.
   ====================================================== */

/* drifting light behind everything — the only thing that moves unprompted */
.qb::before{
  content:""; position:fixed; inset:-25%; z-index:0; pointer-events:none;
  background:
    radial-gradient(closest-side, rgba(45,59,212,.13), transparent 72%) 18% 10% / 58% 58% no-repeat,
    radial-gradient(closest-side, rgba(107,63,160,.10), transparent 72%) 80% 34% / 52% 52% no-repeat;
  animation:drift 26s ease-in-out infinite alternate;
}
.qb[data-theme="dark"]::before{
  background:
    radial-gradient(closest-side, rgba(139,150,255,.15), transparent 72%) 18% 10% / 58% 58% no-repeat,
    radial-gradient(closest-side, rgba(186,156,232,.12), transparent 72%) 80% 34% / 52% 52% no-repeat;
}
@keyframes drift{
  from{transform:translate3d(-2%,-1%,0) scale(1);}
  to{transform:translate3d(3%,2.5%,0) scale(1.09);}
}
.shell, .wrap{position:relative; z-index:1;}

/* staggered arrival, replayed whenever the tab changes (main is keyed on it) */
@keyframes riseIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
.main > *{animation:riseIn .46s var(--ease-out) both;}
.main > *:nth-child(1){animation-delay:0ms;}
.main > *:nth-child(2){animation-delay:45ms;}
.main > *:nth-child(3){animation-delay:90ms;}
.main > *:nth-child(4){animation-delay:135ms;}
.main > *:nth-child(5){animation-delay:180ms;}
.main > *:nth-child(6){animation-delay:215ms;}
.main > *:nth-child(n+7){animation-delay:245ms;}
/* the overlay is fixed and owns its own entrance */
.main > .fc-overlay{animation:fadeIn .2s var(--ease-out) both; animation-delay:0ms;}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

.sidebar .brand{animation:riseIn .5s var(--ease-out) both;}
.sidebar .side-stats{animation:riseIn .5s var(--ease-out) both; animation-delay:70ms;}
.sidebar .tabs{animation:riseIn .5s var(--ease-out) both; animation-delay:120ms;}

/* the gauge readout pops when it crosses into a new verdict band */
@keyframes bandPop{ 0%{transform:scale(.86);} 60%{transform:scale(1.05);} 100%{transform:scale(1);} }
.gauge-num{animation:bandPop .42s var(--ease-spring); transform-origin:left bottom;}
.gauge-verdict b{animation:fadeIn .3s var(--ease-out);}

/* measuring bar while an embedding is in flight */
@keyframes sweep{ from{transform:translateX(-100%);} to{transform:translateX(320%);} }
.measuring{position:relative; height:2px; margin-top:9px; background:var(--track);
  border-radius:99px; overflow:hidden;}
.measuring i{position:absolute; inset:0; width:32%; border-radius:99px;
  background:var(--grad); animation:sweep 1.05s var(--ease-out) infinite;}

/* coverage fills in on a diagonal rather than all at once */
@keyframes cellIn{ from{opacity:0; transform:scale(.6);} to{opacity:1; transform:none;} }
.cell{animation:cellIn .34s var(--ease-spring) both;}

/* beat verdicts land one after another, so you read them in order */
@keyframes beatIn{ from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:none;} }
.beat{animation:beatIn .34s var(--ease-out) both;}

/* press feedback: everything tappable acknowledges the tap */
.btn, .chip, .cell, .grade button, .tabs button, .mode-toggle button{
  transition:transform .13s var(--ease-out), background-color .18s ease,
             border-color .18s ease, color .18s ease, box-shadow .18s ease;}
.btn:active:not([disabled]), .chip:active, .grade button:active,
.mode-toggle button:active{transform:scale(.975);}
.cell:active{transform:scale(.88);}
.card{transition:border-color .2s ease;}

/* the due stamp breathes once when there is actually something due */
@keyframes stampIn{ 0%{transform:rotate(-2deg) scale(.82); opacity:0;}
  70%{transform:rotate(-2deg) scale(1.04);} 100%{transform:rotate(-2deg) scale(1); opacity:1;} }
.stamp{animation:stampIn .5s var(--ease-spring) both;}

/* the model pill sweeps while the model downloads */
.mlpill.load{position:relative; overflow:hidden;}
.mlpill.load::after{content:""; position:absolute; inset:0; width:40%;
  background:linear-gradient(90deg, transparent, rgba(169,107,4,.18), transparent);
  animation:sweep 1.4s linear infinite;}

/* One switch turns the whole system off. Because every reveal is a keyframe
   and no static rule hides anything, killing animation leaves the finished
   state on screen rather than a blank page. */
@media (prefers-reduced-motion: reduce){
  .qb *, .qb *::before, .qb *::after{transition:none !important; animation:none !important;}
}
@media (max-width:600px){
  .sidebar{padding:18px 0 10px;}
  .side-stats{margin-bottom:14px;}
  .card{padding:15px;}
  .stat-row{gap:6px;}
}
@media (max-width:420px){ .cell{width:22px; height:22px;} .brand h1{font-size:23px;} .tabs button{font-size:11px;}
  .stamp{padding:6px 11px;} .stamp b{font-size:20px;} }
`;

/* ---------------------------- lexical layer ---------------------------- */
const STOP = new Set(("a an the is are was were be been being am do does did doing you your yours my mine i we our us it its of to in on at for with and or as that this these those from by can could would should will shall may might what why how when which who whom whose please tell about explain describe give any some there their they them he she").split(" "));

const stem = (w) => {
  if (w.length <= 4) return w;
  if (w.endsWith("ies")) return w.slice(0, -3) + "y";
  if (w.endsWith("ing")) return w.slice(0, -3);
  if (w.endsWith("ed")) return w.slice(0, -2);
  if (w.endsWith("es")) return w.slice(0, -2);
  if (w.endsWith("s") && !w.endsWith("ss")) return w.slice(0, -1);
  return w;
};
const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
const toks = (s) => {
  const set = new Set();
  norm(s).split(" ").forEach((w) => { if (w && !STOP.has(w)) set.add(stem(w)); });
  return set;
};
const trigrams = (s) => {
  const t = " " + norm(s) + " ";
  const set = new Set();
  for (let i = 0; i < t.length - 2; i++) set.add(t.slice(i, i + 3));
  return set;
};
const dice = (a, b) => { if (!a.size || !b.size) return 0; let h = 0; a.forEach((x) => { if (b.has(x)) h++; }); return (2 * h) / (a.size + b.size); };
const jaccard = (a, b) => { if (!a.size || !b.size) return 0; let h = 0; a.forEach((x) => { if (b.has(x)) h++; }); return h / (a.size + b.size - h); };

function lexScore(a, b) {
  const ta = toks(a), tb = toks(b);
  if (ta.size && tb.size && ta.size === tb.size) {
    let same = true; ta.forEach((x) => { if (!tb.has(x)) same = false; });
    if (same) return 100;
  }
  return Math.round(Math.min(100, (0.55 * dice(trigrams(a), trigrams(b)) + 0.45 * jaccard(ta, tb)) * 118));
}

/* --------------------------- semantic layer ---------------------------- */
/* MiniLM cosine sits ~0.10-0.30 for unrelated text and ~0.55-0.95 for
   paraphrases, so remap that live band onto 0-100 before blending. */
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const semScore = (cos) => Math.round(clamp01((cos - 0.30) / 0.60) * 100);

function cosine(a, b) {
  if (!a || !b) return 0;
  let d = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
  return na && nb ? d / Math.sqrt(na * nb) : 0;
}

/* Blended verdict used everywhere a duplicate could hide.
   A weighted average alone under-reports the interesting case: a true
   paraphrase scores ~90 on meaning and ~10 on wording, averaging to a shrug.
   So each channel can also carry the verdict on its own, slightly discounted. */
function blend(lex, sem) {
  if (sem === null) return { score: lex, lex, sem: null };
  const avg = 0.6 * sem + 0.4 * lex;
  return { score: Math.round(Math.max(avg, sem - 12, lex - 8)), lex, sem };
}

/* ---------------------------- FSRS scheduler ---------------------------- */
/* Free Spaced Repetition Scheduler, v4.5 formulation with default weights.
   Replaces fixed Leitner boxes: each card carries its own stability (days
   until recall falls to 90%) and difficulty (1-10), fitted from your grades. */
const W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.0310,
           1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.5870, 0.2272, 2.8755];
const DECAY = -0.5;
const FACTOR = Math.pow(0.9, 1 / DECAY) - 1; /* 0.234568 */
const DAY = 86400000;
const now = () => Date.now();
const clampD = (d) => Math.min(10, Math.max(1, d));

/* grades: 1 Again, 2 Hard, 3 Good, 4 Easy */
const retrievability = (elapsedDays, S) => (S > 0 ? Math.pow(1 + FACTOR * (elapsedDays / S), DECAY) : 0);
const intervalFor = (S, retention) => (S / FACTOR) * (Math.pow(retention, 1 / DECAY) - 1);

const initStability = (g) => Math.max(0.1, W[g - 1]);
const initDifficulty = (g) => clampD(W[4] - (g - 3) * W[5]);

function nextDifficulty(D, g) {
  const d1 = D - W[6] * (g - 3);
  return clampD(W[7] * initDifficulty(3) + (1 - W[7]) * d1);
}
function stabilityRecall(D, S, R, g) {
  const hard = g === 2 ? W[15] : 1;
  const easy = g === 4 ? W[16] : 1;
  const inc = Math.exp(W[8]) * (11 - D) * Math.pow(S, -W[9]) * (Math.exp(W[10] * (1 - R)) - 1) * hard * easy;
  return S * (1 + inc);
}
function stabilityLapse(D, S, R) {
  return Math.min(S, W[11] * Math.pow(D, -W[12]) * (Math.pow(S + 1, W[13]) - 1) * Math.exp(W[14] * (1 - R)));
}

/** Returns the updated scheduling fields for a card given a grade. */
function schedule(card, g, retention) {
  const ret = retention || 0.9;
  const t = now();
  let S, D, R;
  if (!card.reps || card.stability == null) {
    S = initStability(g);
    D = initDifficulty(g);
    R = 1;
  } else {
    const elapsed = Math.max(0, (t - (card.last || card.created || t)) / DAY);
    R = retrievability(elapsed, card.stability);
    D = nextDifficulty(card.difficultyF != null ? card.difficultyF : 5, g);
    S = g === 1 ? stabilityLapse(D, card.stability, R) : stabilityRecall(D, card.stability, R, g);
  }
  S = Math.max(0.1, Math.min(36500, S));
  let days = intervalFor(S, ret);
  if (g === 1) days = Math.min(days, 0.007); /* ~10 minutes */
  else days = Math.max(1, Math.min(365, days));
  /* fuzz so a big import does not all come due on one day */
  if (days >= 3) days = days * (0.95 + Math.random() * 0.1);
  return {
    stability: S,
    difficultyF: D,
    lastR: R,
    reps: (card.reps || 0) + 1,
    lapses: (card.lapses || 0) + (g === 1 ? 1 : 0),
    last: t,
    due: t + days * DAY,
    interval: days,
  };
}
function previewDays(card, g, retention) {
  const probe = schedule({ ...card }, g, retention);
  return probe.interval < 1 ? "10 min" : Math.round(probe.interval) + "d";
}
const isDue = (q) => q.due <= now();
const fmtDue = (q) => {
  if (q.due <= now()) return "due now";
  const d = (q.due - now()) / DAY;
  if (d < 1) return "due in " + Math.max(1, Math.round(d * 24)) + "h";
  if (d < 2) return "due tomorrow";
  if (d < 60) return "due in " + Math.round(d) + "d";
  return "due in " + Math.round(d / 30) + "mo";
};
/* strength label from stability, replacing the old box number */
const strengthOf = (q) => {
  const s = q.stability || 0;
  if (!q.reps) return "new";
  if (s < 2) return "fragile";
  if (s < 10) return "settling";
  if (s < 45) return "solid";
  return "durable";
};


/* ---------------------------- motion helpers --------------------------- */
const reduceMotion = () =>
  typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;

/** Animates a number toward its target. Returns the target immediately when
    reduced motion is on, or when the jump is trivial. */
function useCountUp(target, ms) {
  const [shown, setShown] = useState(target);
  const cur = useRef(target);
  useEffect(() => {
    const from = cur.current;
    if (from === target || reduceMotion()) { cur.current = target; setShown(target); return; }
    const dur = ms || 460;
    const t0 = (typeof performance !== "undefined" ? performance.now() : Date.now());
    let raf = 0;
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      const v = Math.round(from + (target - from) * eased);
      cur.current = v;
      setShown(v);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => { if (raf) cancelAnimationFrame(raf); };
  }, [target, ms]);
  return shown;
}


/* ======================================================================
   PROGRESS — streaks, levels, badges and the honest retention numbers.
   Everything here is derived from the append-only reviews table, so none
   of it can drift out of sync with what you actually did. Nothing is
   stored that could be corrupted or gamed by editing a counter.
   ====================================================================== */

const dayKey = (ts) => {
  const d = new Date(ts);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
const keyToDate = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const shiftDay = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

/** Reviews per local day, plus today's count. */
function dailyCounts(reviews) {
  const m = new Map();
  reviews.forEach((r) => { const k = dayKey(r.at); m.set(k, (m.get(k) || 0) + 1); });
  return m;
}

/* A streak that punishes one missed day is a streak people abandon after
   their first slip. This one banks a rest day for every 7 completed, so a
   single gap costs a credit instead of the whole run. */
const FREEZE_EVERY = 7;

function computeStreak(counts, goal) {
  const met = [...counts.entries()].filter(([, n]) => n >= 1).map(([k]) => k).sort();
  if (!met.length) return { current: 0, longest: 0, freezesLeft: 0, usedFreeze: false, activeToday: false, lastDay: null };
  const set = new Set(met);
  const today = dayKey(now());
  const activeToday = (counts.get(today) || 0) >= (goal || 1);
  const hitToday = set.has(today);

  /* walk backwards from today (or yesterday, if today is still untouched) */
  let cursor = keyToDate(today);
  if (!hitToday) cursor = shiftDay(cursor, -1);
  let current = 0, earned = 0, spent = 0, usedFreeze = false;
  for (let guard = 0; guard < 2000; guard++) {
    const k = dayKey(cursor.getTime());
    if (set.has(k)) {
      current++;
      if (current % FREEZE_EVERY === 0) earned++;
      cursor = shiftDay(cursor, -1);
      continue;
    }
    /* a single missed day can be covered by a banked credit */
    const prev = dayKey(shiftDay(cursor, -1).getTime());
    if (set.has(prev) && earned - spent > 0) {
      spent++; usedFreeze = true;
      cursor = shiftDay(cursor, -1);
      continue;
    }
    break;
  }

  let longest = 0, run = 0, prevD = null;
  met.forEach((k) => {
    const d = keyToDate(k);
    if (prevD && (d - prevD) / DAY === 1) run++; else run = 1;
    if (run > longest) longest = run;
    prevD = d;
  });

  return { current, longest: Math.max(longest, current), freezesLeft: Math.max(0, earned - spent),
           usedFreeze, activeToday, hitToday, lastDay: met[met.length - 1] };
}

/* XP rewards showing up, not just being right — a blank still scores,
   because the alternative is skipping the card you most need to see. */
const XP_FOR_GRADE = { 1: 5, 2: 9, 3: 13, 4: 15 };
const XP_DIFF = { easy: 1, medium: 1.15, hard: 1.35 };

function xpOf(reviews, questions) {
  const byId = new Map(questions.map((q) => [q.id, q]));
  return reviews.reduce((sum, r) => {
    const q = byId.get(r.qid);
    const mult = XP_DIFF[(q && q.difficulty) || "medium"] || 1;
    const cov = r.coverage != null ? 1 + r.coverage * 0.4 : 1;   /* spoken and thorough pays more */
    return sum + Math.round((XP_FOR_GRADE[r.grade] || 8) * mult * cov);
  }, 0);
}
/* level L starts at 150 * L(L-1)/2 XP: 150, 450, 900, 1500, 2250 ... */
const xpForLevel = (L) => Math.round(150 * (L * (L - 1)) / 2);
function levelOf(xp) {
  let L = 1;
  while (xpForLevel(L + 1) <= xp) L++;
  const base = xpForLevel(L), next = xpForLevel(L + 1);
  return { level: L, base, next, into: xp - base, span: next - base, pct: Math.round(((xp - base) / (next - base)) * 100) };
}

/** True retention: of the reviews that were genuinely due, how many passed.
    Same-day relearns are excluded, as they measure nothing about memory. */
function retentionStats(reviews) {
  const byQ = new Map();
  reviews.slice().sort((a, b) => a.at - b.at).forEach((r) => {
    const prev = byQ.get(r.qid);
    r._gap = prev ? (r.at - prev) / DAY : null;
    byQ.set(r.qid, r.at);
  });
  const real = reviews.filter((r) => r._gap != null && r._gap >= 0.9);
  const passed = real.filter((r) => r.grade >= 2).length;
  const buckets = [
    { label: "1–3d", lo: 0.9, hi: 3 },
    { label: "3–7d", lo: 3, hi: 7 },
    { label: "1–3w", lo: 7, hi: 21 },
    { label: "3w+", lo: 21, hi: 1e9 },
  ].map((b) => {
    const inB = real.filter((r) => r._gap >= b.lo && r._gap < b.hi);
    return { ...b, n: inB.length, rate: inB.length ? inB.filter((r) => r.grade >= 2).length / inB.length : null };
  });
  return { n: real.length, rate: real.length ? passed / real.length : null, buckets };
}

const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function weekdayStats(reviews) {
  return WEEKDAYS.map((label, i) => {
    const inD = reviews.filter((r) => new Date(r.at).getDay() === i);
    return { label, n: inD.length, rate: inD.length ? inD.filter((r) => r.grade >= 2).length / inD.length : null };
  });
}

/** Achievements, all recomputed from data — nothing to store or fake. */
function badgesOf({ reviews, questions, concepts, languages, streak, level }) {
  const spoken = reviews.filter((r) => r.transcript_len > 0 || r.transcriptLen > 0).length;
  const full = reviews.filter((r) => r.coverage != null && r.coverage >= 0.999).length;
  const angleFull = concepts.filter((c) => {
    const set = new Set(questions.filter((q) => q.conceptId === c.id && !q.variantOf).map((q) => q.angle));
    return set.size >= ANGLES.length;
  }).length;
  const durable = questions.filter((q) => (q.stability || 0) >= 21).length;
  const def = (icon, name, have, need, note) => ({
    icon, name, have, need, note, got: have >= need,
    pct: Math.min(100, Math.round((have / need) * 100)),
  });
  return [
    def("🔥", "Unbroken", streak.longest, 7, "7-day streak"),
    def("🗓", "Month deep", streak.longest, 30, "30-day streak"),
    def("💯", "Century", reviews.length, 100, "100 reviews"),
    def("🎙", "Out loud", spoken, 25, "25 spoken answers"),
    def("🎯", "Nothing skipped", full, 10, "10 full-coverage answers"),
    def("🗺", "Cartographer", angleFull, 1, "a concept at 6/6 angles"),
    def("🏛", "Vault", durable, 20, "20 cards held 3wk+"),
    def("📚", "Stocked", questions.length, 50, "50 questions banked"),
    def("🌐", "Polyglot", languages.length, 3, "3 languages"),
    def("⭐", "Level 5", level.level, 5, "reach level 5"),
  ];
}

/* --------------------------- concept helpers --------------------------- */
const cnorm = (s) => norm(s).replace(/\s+/g, "");
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

function resolveConcept(input, concepts) {
  const k = cnorm(input);
  if (!k) return { kind: "empty" };
  for (const c of concepts) {
    if (cnorm(c.name) === k || (c.aliases || []).some((a) => cnorm(a) === k)) return { kind: "exact", concept: c };
  }
  let best = null, score = 0;
  for (const c of concepts) { const s = lexScore(c.name, input); if (s > score) { score = s; best = c; } }
  if (best && score >= 66) return { kind: "similar", concept: best, score };
  return { kind: "new" };
}

/* -------------------------- answer beat parsing ------------------------- */
function splitBeats(answer) {
  if (!answer) return [];
  return answer
    .split(/\n+|(?<=[.;!?])\s+/)
    .map((s) => s.trim().replace(/^[-*\u2022]\s*/, ""))
    .filter((s) => s.length >= 12);
}
function splitSentences(t) {
  if (!t) return [];
  return t.split(/(?<=[.;!?])\s+|\n+/).map((s) => s.trim()).filter((s) => s.length > 3);
}
/* lexical fallback coverage when embeddings are off */
function lexCoverage(beat, transcript) {
  const b = toks(beat), t = toks(transcript);
  if (!b.size) return 0;
  let hit = 0; b.forEach((w) => { if (t.has(w)) hit++; });
  return hit / b.size;
}

/* ======================================================================
   STORAGE — SQLite compiled to WASM, persisted as one real database file
   in the Origin Private File System.

   Schema is applied in three steps, and the order matters: an index cannot
   reference a column that ALTER TABLE has not added yet. Creating them all
   in one statement blows up on any database written before the languages
   feature shipped, which then looks like a silent fallback to IndexedDB.
   ====================================================================== */

/* Step 1 — tables only. CREATE TABLE IF NOT EXISTS never modifies a table
   that already exists on disk, so an older bank.sqlite3 keeps its old shape
   here and gets grown by upgradeSchema below. */
const SCHEMA = `
CREATE TABLE IF NOT EXISTS concepts (
  id TEXT PRIMARY KEY, name TEXT NOT NULL, aliases TEXT DEFAULT '[]',
  updated_at INTEGER, deleted_at INTEGER
);
CREATE TABLE IF NOT EXISTS languages (
  id TEXT PRIMARY KEY, name TEXT NOT NULL, aliases TEXT DEFAULT '[]',
  updated_at INTEGER, deleted_at INTEGER
);
CREATE TABLE IF NOT EXISTS questions (
  id TEXT PRIMARY KEY,
  text TEXT NOT NULL,
  answer TEXT,
  code_example TEXT,
  concept_id TEXT REFERENCES concepts(id) ON DELETE SET NULL,
  language_id TEXT REFERENCES languages(id) ON DELETE SET NULL,
  angle TEXT DEFAULT 'def',
  difficulty TEXT DEFAULT 'medium',
  due INTEGER, created INTEGER, last INTEGER,
  reps INTEGER DEFAULT 0, lapses INTEGER DEFAULT 0,
  stability REAL, difficulty_f REAL, interval REAL,
  variant_of TEXT,
  updated_at INTEGER, deleted_at INTEGER
);
CREATE TABLE IF NOT EXISTS vectors (
  id TEXT PRIMARY KEY REFERENCES questions(id) ON DELETE CASCADE,
  dim INTEGER NOT NULL, v BLOB NOT NULL
);
CREATE TABLE IF NOT EXISTS reviews (
  rid INTEGER PRIMARY KEY AUTOINCREMENT,
  qid TEXT, at INTEGER, grade INTEGER, elapsed INTEGER,
  stability REAL, difficulty REAL, interval REAL,
  coverage REAL, transcript_len INTEGER
);
CREATE TABLE IF NOT EXISTS meta (k TEXT PRIMARY KEY, v TEXT);
`;

/* Step 3 — indexes, applied only after every column is guaranteed present. */
const INDEXES = `
CREATE INDEX IF NOT EXISTS idx_q_due ON questions(due);
CREATE INDEX IF NOT EXISTS idx_q_concept ON questions(concept_id);
CREATE INDEX IF NOT EXISTS idx_q_language ON questions(language_id);
CREATE INDEX IF NOT EXISTS idx_q_variant ON questions(variant_of);
CREATE INDEX IF NOT EXISTS idx_r_qid ON reviews(qid);
CREATE INDEX IF NOT EXISTS idx_q_deleted ON questions(deleted_at);
CREATE UNIQUE INDEX IF NOT EXISTS idx_r_unique ON reviews(qid, at);
`;

const SCHEMA_VERSION = 3;
const DB_FILE = "bank.sqlite3";
const LEGACY_KEY = "qbank:v1";
const IDB_NAME = "qbank";

/* Step 2 — grow an older table to the current shape. Idempotent: reads
   PRAGMA table_info first, so a second boot adds nothing. */
function upgradeSchema(db) {
  const cols = (t) => {
    const info = db.exec("PRAGMA table_info(" + t + ")");
    return info.length ? info[0].values.map((r) => r[1]) : [];
  };
  const add = (t, col, type) => {
    const have = cols(t);
    if (have.length && !have.includes(col)) db.run("ALTER TABLE " + t + " ADD COLUMN " + col + " " + type);
  };
  add("questions", "language_id", "TEXT");
  add("questions", "code_example", "TEXT");
  /* v3: sync needs to know when a row changed and whether it was deleted.
     A hard delete is invisible to the other device, which would push the
     row straight back on the next sync. */
  ["questions", "concepts", "languages"].forEach((t) => {
    add(t, "updated_at", "INTEGER");
    add(t, "deleted_at", "INTEGER");
  });
  /* backfill so pre-v3 rows are not all treated as older than everything */
  db.run("UPDATE questions SET updated_at = coalesce(updated_at, last, created, 0) WHERE updated_at IS NULL");
  db.run("UPDATE concepts SET updated_at = coalesce(updated_at, 0) WHERE updated_at IS NULL");
  db.run("UPDATE languages SET updated_at = coalesce(updated_at, 0) WHERE updated_at IS NULL");
}

/** Tables, then columns, then indexes. Every database opens through this. */
function openBank(db) {
  db.run(SCHEMA);
  upgradeSchema(db);
  db.run(INDEXES);
}

/* ---- row mapping: snake_case on disk, camelCase in the app ---- */

const Q_MARKS = "(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)";

/* ====================== fallback backend: IndexedDB ==================== */
let _idb = null;
function openIDB() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
    const req = indexedDB.open(IDB_NAME, 2);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      const tx = e.target.transaction;
      let qStore;
      if (!db.objectStoreNames.contains("questions")) {
        qStore = db.createObjectStore("questions", { keyPath: "id" });
        qStore.createIndex("due", "due"); qStore.createIndex("conceptId", "conceptId");
      } else {
        qStore = tx.objectStore("questions");
      }
      if (!qStore.indexNames.contains("languageId")) qStore.createIndex("languageId", "languageId");
      if (!db.objectStoreNames.contains("concepts")) db.createObjectStore("concepts", { keyPath: "id" });
      if (!db.objectStoreNames.contains("languages")) db.createObjectStore("languages", { keyPath: "id" });
      if (!db.objectStoreNames.contains("vectors")) db.createObjectStore("vectors", { keyPath: "id" });
      if (!db.objectStoreNames.contains("reviews")) db.createObjectStore("reviews", { keyPath: "rid", autoIncrement: true });
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "k" });
    };
    req.onsuccess = () => { _idb = req.result; resolve(_idb); };
    req.onerror = () => reject(req.error);
  });
}
function idbTx(store, mode, fn) {
  return openIDB().then((db) => new Promise((resolve, reject) => {
    const t = db.transaction(store, mode), s = t.objectStore(store);
    let out; try { out = fn(s); } catch (e) { reject(e); return; }
    t.oncomplete = () => resolve(out && out.result !== undefined ? out.result : out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  }));
}
const IDB = {
  all: (s) => idbTx(s, "readonly", (o) => o.getAll()),
  put: (s, row) => idbTx(s, "readwrite", (o) => o.put(row)),
  putMany: (s, rows) => idbTx(s, "readwrite", (o) => { rows.forEach((r) => o.put(r)); }),
  del: (s, id) => idbTx(s, "readwrite", (o) => o.delete(id)),
  clear: (s) => idbTx(s, "readwrite", (o) => o.clear()),
};

/* ============================ the store =============================== */
const Storage = {
  backend: "none",        /* sqlite | idb | none */
  reason: null,           /* why we fell back */
  db: null,               /* sql.js Database */
  handle: null,           /* OPFS FileHandle */
  bytes: 0,
  persisted: false,
  saving: false,
  dirty: false,
  timer: null,
  lastSaved: null,
  onError: () => {},

  async init() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        this.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
      }
    } catch (e) {}

    try {
      if (!navigator.storage || !navigator.storage.getDirectory) throw new Error("OPFS not supported in this browser");
      if (!window.__loadSqlJs) throw new Error("sql.js loader missing");
      const SQL = await window.__loadSqlJs();
      const root = await navigator.storage.getDirectory();
      this.handle = await root.getFileHandle(DB_FILE, { create: true });
      if (!this.handle.createWritable) throw new Error("OPFS is read-only here");
      const file = await this.handle.getFile();
      const buf = new Uint8Array(await file.arrayBuffer());
      this.db = buf.byteLength ? new SQL.Database(buf) : new SQL.Database();
      openBank(this.db);
      this.db.run("INSERT OR REPLACE INTO meta(k,v) VALUES('schema_version',?)", [String(SCHEMA_VERSION)]);
      this.bytes = buf.byteLength;
      this.backend = "sqlite";
      if (!buf.byteLength) await this.flush();
    } catch (e) {
      this.reason = (e && e.message) || "unknown";
      try { await openIDB(); this.backend = "idb"; } catch (e2) { this.backend = "none"; throw e2; }
    }

    /* best-effort flush when the tab goes away */
    const bye = () => { if (this.dirty) this.flush(); };
    window.addEventListener("pagehide", bye);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") bye(); });
    return this.backend;
  },

  /* ---- SQL helpers ---- */
  all(sql, params) {
    const st = this.db.prepare(sql);
    if (params) st.bind(params);
    const out = [];
    while (st.step()) out.push(st.getAsObject());
    st.free();
    return out;
  },
  run(sql, params) { this.db.run(sql, params || []); this.markDirty(); },

  markDirty() {
    this.dirty = true;
    if (this.timer) return;
    this.timer = setTimeout(() => { this.timer = null; this.flush(); }, 500);
  },

  /** Serialise the whole database and commit it atomically. */
  async flush() {
    if (this.backend !== "sqlite" || !this.dirty || this.saving) return;
    this.saving = true;
    let bytes;
    try { bytes = this.db.export(); this.dirty = false; }
    catch (e) { this.saving = false; this.onError("Could not serialise the database."); return; }
    try {
      const w = await this.handle.createWritable();
      await w.write(bytes);
      await w.close();
      this.bytes = bytes.byteLength;
      this.lastSaved = Date.now();
    } catch (e) {
      this.dirty = true;
      this.onError("Writing " + DB_FILE + " failed: " + ((e && e.message) || "unknown") + ". Data is still in memory — export a backup now.");
    } finally {
      this.saving = false;
      if (this.dirty) this.markDirty();
    }
  },

  /** Raw bytes of the database, for download or inspection. */
  async exportFile() {
    if (this.backend === "sqlite") { await this.flush(); return this.db.export(); }
    return null;
  },

  async importFile(bytes) {
    if (this.backend !== "sqlite") throw new Error("SQLite is not the active backend here");
    const SQL = await window.__loadSqlJs();
    const probe = new SQL.Database(new Uint8Array(bytes));
    const t = probe.exec("SELECT count(*) c FROM sqlite_master WHERE type='table' AND name IN ('questions','concepts')");
    const found = t.length ? t[0].values[0][0] : 0;
    if (found < 2) { probe.close(); throw new Error("that file is not a Bank database"); }
    /* same three-step upgrade, so an older backup restores cleanly */
    openBank(probe);
    if (this.db) this.db.close();
    this.db = probe;
    this.dirty = true;
    await this.flush();
  },

  info() {
    return {
      backend: this.backend, reason: this.reason, bytes: this.bytes,
      persisted: this.persisted, file: DB_FILE, lastSaved: this.lastSaved, dirty: this.dirty,
    };
  },
};

/* One-way migration flags. These must survive a wipe, otherwise clearing the
   bank makes it look empty and every migration source floods back in on the
   next refresh. Kept in localStorage first (a SQLite wipe cannot touch it),
   mirrored into meta as a backup for when localStorage is unavailable. */
const MIG = {
  key: (kind) => "qbank:migrated:" + kind,
  read(kind) {
    try { if (localStorage.getItem(this.key(kind))) return true; } catch (e) {}
    if (Storage.backend === "sqlite" && Storage.db) {
      try { if (Storage.all("SELECT v FROM meta WHERE k=?", ["migrated:" + kind]).length) return true; } catch (e) {}
    }
    return false;
  },
  write(kind) {
    try { localStorage.setItem(this.key(kind), String(Date.now())); } catch (e) {}
    if (Storage.backend === "sqlite" && Storage.db) {
      try { Storage.run("INSERT OR REPLACE INTO meta(k,v) VALUES(?,?)", ["migrated:" + kind, String(Date.now())]); } catch (e) {}
    }
  },
};

/* ====================== Repo — the app's only API ====================== */
/* Identical surface for both backends, so no view code knows the difference. */
const Repo = {
  async load() {
    if (Storage.backend === "sqlite") {
      const questions = Storage.all("SELECT " + Q_COLS + " FROM questions WHERE deleted_at IS NULL").map(rowToQ);
      const parseNamed = (r) => {
        let aliases = [];
        try { aliases = JSON.parse(r.aliases || "[]"); } catch (e) {}
        return { id: r.id, name: r.name, aliases, updated: r.updated_at || 0, deleted: r.deleted_at || null };
      };
      const concepts = Storage.all("SELECT id,name,aliases,updated_at,deleted_at FROM concepts WHERE deleted_at IS NULL").map(parseNamed);
      const languages = Storage.all("SELECT id,name,aliases,updated_at,deleted_at FROM languages WHERE deleted_at IS NULL").map(parseNamed);
      const m = Storage.all("SELECT v FROM meta WHERE k='settings'");
      let settings = {};
      if (m.length) { try { settings = JSON.parse(m[0].v); } catch (e) {} }
      return { questions, concepts, languages, settings };
    }
    const [questions, concepts, languages, meta] = await Promise.all([
      IDB.all("questions"), IDB.all("concepts"),
      IDB.all("languages").catch(() => []), IDB.all("meta"),
    ]);
    const s = meta.find((x) => x.k === "settings");
    const live = (a) => a.filter((x) => !x.deleted);
    return { questions: live(questions), concepts: live(concepts), languages: live(languages), settings: (s && s.v) || {} };
  },

  async saveQuestion(q, keepStamp) {
    const row = keepStamp ? q : { ...q, updated: now() };
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT OR REPLACE INTO questions(" + Q_COLS + ") VALUES " + Q_MARKS, qToRow(row));
      return;
    }
    return IDB.put("questions", row);
  },
  async saveQuestions(qs, keepStamp) {
    if (!keepStamp) qs = qs.map((q) => ({ ...q, updated: q.updated || now() }));
    if (Storage.backend === "sqlite") {
      Storage.db.run("BEGIN");
      try {
        const st = Storage.db.prepare("INSERT OR REPLACE INTO questions(" + Q_COLS + ") VALUES " + Q_MARKS);
        qs.forEach((q) => { st.run(qToRow(q)); });
        st.free();
        Storage.db.run("COMMIT");
      } catch (e) { Storage.db.run("ROLLBACK"); throw e; }
      Storage.markDirty();
      return;
    }
    return IDB.putMany("questions", qs);
  },
  /* Soft delete. The row stays as a tombstone so the other device learns
     about the deletion instead of pushing its copy back. Purged after 90
     days, by which point every device has long since seen it. */
  async removeQuestion(id) {
    const t = now();
    if (Storage.backend === "sqlite") {
      Storage.run("UPDATE questions SET deleted_at=?, updated_at=? WHERE id=? OR variant_of=?", [t, t, id, id]);
      Storage.run("DELETE FROM vectors WHERE id=? OR id IN (SELECT id FROM questions WHERE variant_of=?)", [id, id]);
      return;
    }
    const all = await IDB.all("questions");
    const hit = all.filter((q) => q.id === id || q.variantOf === id);
    await IDB.putMany("questions", hit.map((q) => ({ ...q, deleted: t, updated: t })));
    return IDB.del("vectors", id);
  },
  async saveConcept(c, keepStamp) {
    const row = keepStamp ? c : { ...c, updated: now() };
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT OR REPLACE INTO concepts(id,name,aliases,updated_at,deleted_at) VALUES (?,?,?,?,?)",
        [row.id, row.name, JSON.stringify(row.aliases || []), row.updated || now(), row.deleted || null]);
      return;
    }
    return IDB.put("concepts", row);
  },
  async saveConcepts(cs, keepStamp) { for (const c of cs) await this.saveConcept(c, keepStamp); },
  async removeConcept(id) {
    const t = now();
    if (Storage.backend === "sqlite") { Storage.run("UPDATE concepts SET deleted_at=?, updated_at=? WHERE id=?", [t, t, id]); return; }
    const c = await IDB.all("concepts").then((a) => a.find((x) => x.id === id));
    if (c) return IDB.put("concepts", { ...c, deleted: t, updated: t });
  },
  async saveLanguage(l, keepStamp) {
    const row = keepStamp ? l : { ...l, updated: now() };
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT OR REPLACE INTO languages(id,name,aliases,updated_at,deleted_at) VALUES (?,?,?,?,?)",
        [row.id, row.name, JSON.stringify(row.aliases || []), row.updated || now(), row.deleted || null]);
      return;
    }
    return IDB.put("languages", row);
  },
  async saveLanguages(ls, keepStamp) { for (const l of ls) await this.saveLanguage(l, keepStamp); },
  async removeLanguage(id) {
    const t = now();
    if (Storage.backend === "sqlite") { Storage.run("UPDATE languages SET deleted_at=?, updated_at=? WHERE id=?", [t, t, id]); return; }
    const l = await IDB.all("languages").then((a) => a.find((x) => x.id === id));
    if (l) return IDB.put("languages", { ...l, deleted: t, updated: t });
  },
  async saveSettings(v) {
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT OR REPLACE INTO meta(k,v) VALUES('settings',?)", [JSON.stringify(v)]);
      return;
    }
    return IDB.put("meta", { k: "settings", v });
  },

  /* vectors live as raw little-endian float32 blobs: 1536 bytes each */
  async allVectors() {
    const m = new Map();
    if (Storage.backend === "sqlite") {
      Storage.all("SELECT id,v FROM vectors").forEach((r) => {
        const u8 = r.v instanceof Uint8Array ? r.v : new Uint8Array(r.v);
        const copy = new Uint8Array(u8.length);
        copy.set(u8);
        m.set(r.id, new Float32Array(copy.buffer));
      });
      return m;
    }
    (await IDB.all("vectors")).forEach((r) => m.set(r.id, r.v));
    return m;
  },
  async putVector(id, v) {
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT OR REPLACE INTO vectors(id,dim,v) VALUES (?,?,?)",
        [id, v.length, new Uint8Array(v.buffer, v.byteOffset, v.byteLength)]);
      return;
    }
    return IDB.put("vectors", { id, v });
  },
  async removeVector(id) {
    if (Storage.backend === "sqlite") { Storage.run("DELETE FROM vectors WHERE id=?", [id]); return; }
    return IDB.del("vectors", id);
  },
  async clearVectors() {
    if (Storage.backend === "sqlite") { Storage.run("DELETE FROM vectors"); return; }
    return IDB.clear("vectors");
  },

  async logReview(r) {
    if (Storage.backend === "sqlite") {
      Storage.run("INSERT INTO reviews(qid,at,grade,elapsed,stability,difficulty,interval,coverage,transcript_len) VALUES (?,?,?,?,?,?,?,?,?)",
        [r.qid, r.at, r.grade, r.elapsed, r.stability, r.difficulty, r.interval,
         r.coverage == null ? null : r.coverage, r.transcriptLen || 0]);
      return;
    }
    return IDB.put("reviews", r);
  },
  async allReviews() {
    if (Storage.backend === "sqlite") return Storage.all("SELECT * FROM reviews ORDER BY at");
    return IDB.all("reviews");
  },

  /** Tombstones included — only sync should ever see these. */
  async loadAll() {
    if (Storage.backend === "sqlite") {
      const parseNamed = (r) => {
        let aliases = [];
        try { aliases = JSON.parse(r.aliases || "[]"); } catch (e) {}
        return { id: r.id, name: r.name, aliases, updated: r.updated_at || 0, deleted: r.deleted_at || null };
      };
      return {
        questions: Storage.all("SELECT " + Q_COLS + " FROM questions").map(rowToQ),
        concepts: Storage.all("SELECT id,name,aliases,updated_at,deleted_at FROM concepts").map(parseNamed),
        languages: Storage.all("SELECT id,name,aliases,updated_at,deleted_at FROM languages").map(parseNamed),
        reviews: await this.allReviews(),
      };
    }
    return {
      questions: await IDB.all("questions"),
      concepts: await IDB.all("concepts"),
      languages: await IDB.all("languages").catch(() => []),
      reviews: await IDB.all("reviews"),
    };
  },

  /** Reviews are append-only; a (qid, at) pair identifies one uniquely. */
  async saveReviews(rows) {
    if (!rows.length) return 0;
    if (Storage.backend === "sqlite") {
      let n = 0;
      Storage.db.run("BEGIN");
      try {
        const st = Storage.db.prepare(
          "INSERT OR IGNORE INTO reviews(qid,at,grade,elapsed,stability,difficulty,interval,coverage,transcript_len) VALUES (?,?,?,?,?,?,?,?,?)");
        rows.forEach((r) => {
          st.run([r.qid, r.at, r.grade, r.elapsed == null ? null : r.elapsed,
                  r.stability == null ? null : r.stability, r.difficulty == null ? null : r.difficulty,
                  r.interval == null ? null : r.interval,
                  r.coverage == null ? null : r.coverage,
                  r.transcript_len || r.transcriptLen || 0]);
          n++;
        });
        st.free();
        Storage.db.run("COMMIT");
      } catch (e) { Storage.db.run("ROLLBACK"); throw e; }
      Storage.markDirty();
      return n;
    }
    await IDB.putMany("reviews", rows);
    return rows.length;
  },

  /** Tombstones have done their job once every device has synced. */
  async purgeTombstones(olderThanDays) {
    if (Storage.backend !== "sqlite") return 0;
    const cut = now() - (olderThanDays || 90) * DAY;
    const before = Storage.all("SELECT count(*) c FROM questions WHERE deleted_at IS NOT NULL AND deleted_at < " + cut)[0].c;
    if (!before) return 0;
    ["questions", "concepts", "languages"].forEach((t) =>
      Storage.db.run("DELETE FROM " + t + " WHERE deleted_at IS NOT NULL AND deleted_at < " + cut));
    Storage.markDirty();
    return before;
  },

  /** Aggregates the old code did in JS. Free once the data is in SQL. */
  async stats() {
    if (Storage.backend !== "sqlite") return null;
    const g = (sql) => { const r = Storage.all(sql); return r.length ? r[0] : {}; };
    return {
      totals: g("SELECT count(*) questions, count(DISTINCT concept_id) concepts, sum(variant_of IS NOT NULL) variants FROM questions"),
      due: g("SELECT count(*) n FROM questions WHERE due<=" + now() + " AND variant_of IS NULL AND deleted_at IS NULL").n,
      reviewed: g("SELECT count(*) n, avg(elapsed) avg_secs, avg(coverage) avg_cov FROM reviews"),
      byAngle: Storage.all("SELECT angle, count(*) n, avg(stability) avg_stab FROM questions WHERE variant_of IS NULL GROUP BY angle"),
      weakest: Storage.all(
        "SELECT c.name, count(q.id) n, count(DISTINCT q.angle) angles, avg(coalesce(q.stability,0)) stab " +
        "FROM concepts c LEFT JOIN questions q ON q.concept_id=c.id AND q.variant_of IS NULL " +
        "GROUP BY c.id ORDER BY angles ASC, stab ASC LIMIT 5"),
      lapsing: Storage.all("SELECT text, lapses FROM questions WHERE lapses>0 ORDER BY lapses DESC LIMIT 5"),
    };
  },

  async wipe() {
    if (Storage.backend === "sqlite") {
      ["reviews", "vectors", "questions", "concepts", "languages", "meta"].forEach((t) => Storage.db.run("DELETE FROM " + t));
      /* DELETE only frees pages inside the file; VACUUM actually shrinks it */
      Storage.db.run("VACUUM");
    }
    /* Clear the migration sources too, or they repopulate on the next refresh. */
    let cleared = { idb: false, legacy: false };
    try {
      await Promise.all(["questions", "concepts", "languages", "vectors", "reviews", "meta"].map((n) => IDB.clear(n)));
      cleared.idb = true;
    } catch (e) {}
    try { localStorage.removeItem(LEGACY_KEY); cleared.legacy = true; } catch (e) {}
    /* Re-assert after the meta table was truncated, so nothing migrates again. */
    MIG.write("idb"); MIG.write("legacy");
    if (Storage.backend === "sqlite") { Storage.markDirty(); await Storage.flush(); }
    return cleared;
  },

  /** IndexedDB -> SQLite, once, on the first run after this upgrade. */
  async migrateIDB() {
    if (Storage.backend !== "sqlite") return 0;
    if (MIG.read("idb")) return 0;
    const have = Storage.all("SELECT count(*) c FROM questions");
    if (have[0].c > 0) { MIG.write("idb"); return 0; }
    let qs = [], cs = [], ls = [], vs = [], rs = [];
    try {
      qs = await IDB.all("questions"); cs = await IDB.all("concepts");
      ls = await IDB.all("languages").catch(() => []);
      vs = await IDB.all("vectors"); rs = await IDB.all("reviews");
    } catch (e) { return 0; }   /* could not read: do not mark, try again later */
    MIG.write("idb");
    if (!qs.length && !cs.length && !ls.length) return 0;
    await this.saveConcepts(cs);
    await this.saveLanguages(ls);
    await this.saveQuestions(qs);
    for (const v of vs) if (v.v) await this.putVector(v.id, v.v);
    for (const r of rs) await this.logReview(r);
    await Storage.flush();
    return qs.length;
  },

  /** localStorage -> whatever backend is active, once. */
  async migrateLegacy() {
    if (MIG.read("legacy")) return 0;
    let raw = null;
    try { raw = localStorage.getItem(LEGACY_KEY); } catch (e) { return 0; }
    if (!raw) { MIG.write("legacy"); return 0; }
    const cur = await this.load();
    if (cur.questions.length) { MIG.write("legacy"); return 0; }
    try {
      const old = JSON.parse(raw);
      const qs = (old.questions || []).map((q) => ({
        ...q,
        stability: q.box ? [0.5, 1.4, 3.7, 9, 21, 55][Math.min(q.box, 5)] : null,
        difficultyF: 5, interval: null,
      }));
      await this.saveConcepts(old.concepts || []);
      await this.saveLanguages(old.languages || []);
      await this.saveQuestions(qs);
      if (Storage.backend === "sqlite") await Storage.flush();
      MIG.write("legacy");
      return qs.length;
    } catch (e) { MIG.write("legacy"); return 0; }
  },
};

/* ====================== portable JSON backup (Tier 2) ================== */
const EXPORT_VERSION = 2;

function buildExport(data, reviews) {
  return JSON.stringify({
    format: "thebank", version: EXPORT_VERSION,
    exportedAt: new Date().toISOString(),
    counts: { questions: data.questions.length, concepts: data.concepts.length, languages: (data.languages || []).length, reviews: reviews.length },
    settings: data.settings, concepts: data.concepts, languages: data.languages || [], questions: data.questions, reviews,
  }, null, 2);
}
const stamp = () => new Date().toISOString().slice(0, 10);

async function saveBlob(data, name, mime) {
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description: "Bank data", accept: { [mime]: ["." + name.split(".").pop()] } }],
      });
      const w = await handle.createWritable();
      await w.write(data); await w.close();
      return { ok: true, how: "picker", name };
    } catch (e) { if (e && e.name === "AbortError") return { ok: false, how: "cancelled" }; }
  }
  const blob = new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return { ok: true, how: "download", name };
}

function mergeImport(current, incoming) {
  const qById = new Map(current.questions.map((q) => [q.id, q]));
  const cById = new Map(current.concepts.map((c) => [c.id, c]));
  const cByName = new Map(current.concepts.map((c) => [cnorm(c.name), c]));
  const lById = new Map((current.languages || []).map((l) => [l.id, l]));
  const lByName = new Map((current.languages || []).map((l) => [cnorm(l.name), l]));
  let added = 0, updated = 0, skipped = 0, newConcepts = 0, newLanguages = 0;
  const remap = new Map();
  const remapLang = new Map();

  (incoming.concepts || []).forEach((c) => {
    const sameName = cByName.get(cnorm(c.name));
    if (cById.has(c.id)) { remap.set(c.id, c.id); return; }
    if (sameName) { remap.set(c.id, sameName.id); return; }
    cById.set(c.id, c); cByName.set(cnorm(c.name), c); remap.set(c.id, c.id); newConcepts++;
  });
  (incoming.languages || []).forEach((l) => {
    const sameName = lByName.get(cnorm(l.name));
    if (lById.has(l.id)) { remapLang.set(l.id, l.id); return; }
    if (sameName) { remapLang.set(l.id, sameName.id); return; }
    lById.set(l.id, l); lByName.set(cnorm(l.name), l); remapLang.set(l.id, l.id); newLanguages++;
  });
  (incoming.questions || []).forEach((q) => {
    const mapped = {
      ...q,
      conceptId: q.conceptId ? (remap.get(q.conceptId) || q.conceptId) : null,
      languageId: q.languageId ? (remapLang.get(q.languageId) || q.languageId) : null,
    };
    const mine = qById.get(q.id);
    if (!mine) {
      const clash = [...qById.values()].find((x) => lexScore(x.text, mapped.text) >= 92);
      if (clash) { skipped++; return; }
      qById.set(mapped.id, mapped); added++;
    } else if ((mapped.last || mapped.created || 0) > (mine.last || mine.created || 0)) {
      qById.set(q.id, mapped); updated++;
    } else skipped++;
  });
  return {
    data: { questions: [...qById.values()], concepts: [...cById.values()], languages: [...lById.values()] },
    report: { added, updated, skipped, newConcepts, newLanguages },
  };
}

/* ====================== ML manager (unchanged surface) ================= */
const ML = {
  state: "off", progress: 0, error: null, extractor: null, angleVecs: null,
  listeners: new Set(), cache: new Map(),
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit() { this.listeners.forEach((f) => f(this.state, this.progress, this.error)); },
  async enable() {
    if (this.state === "ready" || this.state === "loading") return this.state === "ready";
    this.state = "loading"; this.progress = 0; this.error = null; this.emit();
    try {
      if (!window.__loadTransformers) throw new Error("module loader missing");
      this.extractor = await window.__loadTransformers((p) => {
        if (p && p.status === "progress" && p.total) { this.progress = Math.round((p.loaded / p.total) * 100); this.emit(); }
      });
      this.state = "ready"; this.progress = 100; this.emit();
      this.angleVecs = {};
      for (const a of ANGLES) this.angleVecs[a.id] = await this.embed(a.name + ". " + a.probe);
      this.emit();
      return true;
    } catch (e) {
      this.state = "failed"; this.error = (e && e.message) || "load failed"; this.emit(); return false;
    }
  },
  async embed(text) {
    if (this.state !== "ready" || !text) return null;
    const key = text.slice(0, 400);
    if (this.cache.has(key)) return this.cache.get(key);
    const out = await this.extractor(key, { pooling: "mean", normalize: true });
    const v = new Float32Array(out.data);
    if (this.cache.size > 300) this.cache.clear();
    this.cache.set(key, v);
    return v;
  },
  async embedMany(texts) { const o = []; for (const t of texts) o.push(await this.embed(t)); return o; },
};


/* ======================================================================
   SYNC — a private GitHub Gist as the whole backend.

   No server, no account system, no cost: the Gist is a file you own and
   can read or revoke at any time. Merge is last-write-wins per record,
   using an updated_at stamp that every write refreshes. Deletions travel
   as tombstones, so removing a question on one device removes it on the
   other instead of being resurrected by the next push.

   The token is never included in the payload — settings stay per device.
   ====================================================================== */
const GIST_FILE = "the-bank.json";
const SYNC_FORMAT = "thebank-sync";

/* newest wins; a tombstone counts as a write like any other */
const stampOf = (r) => Math.max(r.updated || 0, r.deleted || 0, r.last || 0, r.created || 0);

function mergeRecords(mine, theirs) {
  const out = new Map();
  let added = 0, updated = 0, deletedIn = 0, kept = 0;
  mine.forEach((r) => out.set(r.id, r));
  theirs.forEach((r) => {
    const local = out.get(r.id);
    if (!local) { out.set(r.id, r); if (r.deleted) deletedIn++; else added++; return; }
    if (stampOf(r) > stampOf(local)) {
      out.set(r.id, r);
      if (r.deleted && !local.deleted) deletedIn++; else updated++;
    } else kept++;
  });
  return { rows: [...out.values()], added, updated, deletedIn, kept };
}

/** Reviews are append-only facts: the union, keyed by question and moment. */
function mergeReviews(mine, theirs) {
  const key = (r) => r.qid + "|" + r.at;
  const have = new Set(mine.map(key));
  const fresh = theirs.filter((r) => !have.has(key(r)));
  return { rows: mine.concat(fresh), added: fresh.length };
}

function mergeSync(local, remote) {
  const q = mergeRecords(local.questions, remote.questions || []);
  const c = mergeRecords(local.concepts, remote.concepts || []);
  const l = mergeRecords(local.languages, remote.languages || []);
  const r = mergeReviews(local.reviews, remote.reviews || []);
  return {
    merged: { questions: q.rows, concepts: c.rows, languages: l.rows, reviews: r.rows },
    report: {
      questionsIn: q.added, questionsUpdated: q.updated, questionsDeleted: q.deletedIn,
      conceptsIn: c.added + l.added, reviewsIn: r.added,
      unchanged: q.kept,
    },
  };
}

function syncPayload(all, device) {
  return {
    format: SYNC_FORMAT, version: 3,
    pushedAt: new Date().toISOString(), device: device || "unknown",
    questions: all.questions, concepts: all.concepts,
    languages: all.languages, reviews: all.reviews,
  };
}

const GH = "https://api.github.com";
async function gh(path, token, init) {
  const res = await fetch(GH + path, {
    ...(init || {}),
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json",
      ...((init && init.headers) || {}),
    },
  });
  if (res.status === 401) throw new Error("GitHub rejected the token. Check it has the gist scope and has not expired.");
  if (res.status === 404) throw new Error("That gist no longer exists, or the token cannot see it.");
  if (res.status === 403) throw new Error("GitHub rate limit or permission refused. Wait a minute and retry.");
  if (!res.ok) throw new Error("GitHub returned " + res.status + ".");
  return res.json();
}

async function gistRead(token, gistId) {
  const g = await gh("/gists/" + gistId, token);
  const f = g.files && g.files[GIST_FILE];
  if (!f) return null;
  /* the API truncates files over ~1 MB and hands back a raw URL instead */
  const text = f.truncated ? await fetch(f.raw_url).then((r) => r.text()) : f.content;
  try {
    const parsed = JSON.parse(text);
    if (parsed.format !== SYNC_FORMAT) throw new Error("wrong format");
    return parsed;
  } catch (e) { throw new Error("The gist contents could not be read as a Bank sync file."); }
}

async function gistWrite(token, gistId, payload) {
  const body = JSON.stringify({
    description: "The Bank — interview question bank sync",
    files: { [GIST_FILE]: { content: JSON.stringify(payload) } },
  });
  if (gistId) { await gh("/gists/" + gistId, token, { method: "PATCH", body }); return gistId; }
  const made = await gh("/gists", token, { method: "POST", body: JSON.stringify({
    description: "The Bank — interview question bank sync",
    public: false,
    files: { [GIST_FILE]: { content: JSON.stringify(payload) } },
  }) });
  return made.id;
}

const deviceName = () => {
  const ua = (typeof navigator !== "undefined" && navigator.userAgent) || "";
  if (/Android/i.test(ua)) return "Android";
  if (/iPhone|iPad/i.test(ua)) return "iOS";
  if (/Mac/i.test(ua)) return "Mac";
  if (/Windows/i.test(ua)) return "Windows";
  return "device";
};

const STARTER = () => {

    ["When would you reach for a WeakMap instead of a Map?", "JavaScript", "trade", "When the keys are objects whose lifetime you do not control, like DOM nodes or private metadata.\nEntries disappear when the key is collected, so you cannot leak memory.\nThe cost is that it is not iterable and has no size."],
    ["What problem do React keys solve during reconciliation?", "React", "def", "Keys give each child a stable identity across renders.\nWith them React moves existing nodes instead of tearing down and rebuilding.\nIndex keys break the moment the list reorders, because identity shifts with position."],
    ["What happens if you mutate React state directly instead of replacing it?", "React", "fail", "The object reference does not change, so bail-out checks and memo comparisons see no difference.\nThe re-render is skipped entirely.\nThe symptom is a stale UI that mysteriously corrects itself on the next unrelated update."],

    ["When is eventual consistency an acceptable trade?", "System design", "trade", "When a stale read is cheap but a write stall is expensive: counts, feeds, recommendations.\nNot for balances, seat booking, or inventory.\nNever where a user reads back their own write immediately after making it."],
    ["A query got 50x slower after a deploy. How do you find out why?", "SQL", "debug", "Compare the execution plan before and after.\nCheck whether row estimates match reality.\nLook for a dropped index, or a changed column type forcing an implicit cast.\nConsider whether data volume crossed a threshold that flipped the planner's choice."],
    ["What does a database index actually store, and why does that speed up reads?", "SQL", "def", "Usually a B-tree of sorted key values plus pointers to rows.\nLookups become log-n descents rather than a full table scan.\nWrites pay the maintenance cost.\nThe sort order decides which queries can actually use it."],
    ["Describe a disagreement with a senior engineer and how it ended.", "Behavioural", "story", "Keep it technical rather than personal.\nSay what you argued and what evidence you brought.\nSay what you conceded and why.\nEnd with what shipped and what you would do differently."],
  ];
  const t = now();
  return {

    questions: raw.map(([text, concept, angle, answer], i) => ({

      difficulty: i % 3 === 0 ? "hard" : "medium",
      due: t, created: t - i * 1000, last: null,

const DEFAULT_SETTINGS = { talkTarget: 90, retention: 0.9, mlEnabled: false, voice: true, theme: "light", reviewMode: "spoken", dailyGoal: 10 };

/* ============================== app shell ============================== */
function QuestionBank() {
  const [boot, setBoot] = useState("loading");
  const [questions, setQuestions] = useState([]);
  const [concepts, setConcepts] = useState([]);
  const [languages, setLanguages] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [vecs, setVecs] = useState(new Map());
  const [mlState, setMlState] = useState({ state: "off", progress: 0, error: null });
  const [backfill, setBackfill] = useState(null);
  const TABS = ["add", "review", "coverage", "stats", "bank", "data"];
  const [tab, setTabState] = useState(() => {
    const h = (typeof location !== "undefined" ? location.hash : "").replace("#", "");
    return TABS.indexOf(h) >= 0 ? h : "add";
  });
  /* pushState per tab so Android's back button walks back through tabs
     rather than dropping straight out of the app */
  const setTab = useCallback((next) => {
    setTabState((cur) => {
      if (cur !== next && typeof history !== "undefined" && history.pushState) {
        try { history.pushState({ tab: next }, "", "#" + next); } catch (e) {}
      }
      return next;
    });
  }, []);
  useEffect(() => {
    const onPop = (e) => {
      const fromState = e.state && e.state.tab;
      const fromHash = (location.hash || "").replace("#", "");
      setTabState(TABS.indexOf(fromState) >= 0 ? fromState : (TABS.indexOf(fromHash) >= 0 ? fromHash : "add"));
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  const [prefill, setPrefill] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [fatal, setFatal] = useState(null);
  const [notice, setNotice] = useState(null);
  const [store, setStore] = useState(null);
  const [migrated, setMigrated] = useState(null);
  const [reviews, setReviews] = useState([]);

  useEffect(() => ML.on((state, progress, error) => setMlState({ state, progress, error })), []);

  useEffect(() => {
    Storage.onError = (m) => setFatal(m);
    (async () => {
      try {
        const backend = await Storage.init();
        await Repo.purgeTombstones(90).catch(() => {});
        const lifted = await Repo.migrateIDB();
        const legacy = await Repo.migrateLegacy();
        const d = await Repo.load();
        const v = await Repo.allVectors();
        const rv = await Repo.allReviews().catch(() => []);
        setReviews(rv);
        setQuestions(d.questions);
        setConcepts(d.concepts);
        setLanguages(d.languages || []);
        setSettings({ ...DEFAULT_SETTINGS, ...d.settings });
        setVecs(v);
        setStore(Storage.info());
        /* smart default: land on Review when there's a queue to clear,
           otherwise Add — so opening the app is never a dead end. */
        const asked = (location.hash || "").replace("#", "");
        if (TABS.indexOf(asked) < 0) {
          const dueNow = d.questions.filter((q) => !q.variantOf && isDue(q)).length;
          setTabState(dueNow > 0 ? "review" : "add");
        }
        if (lifted) setMigrated({ from: "IndexedDB", n: lifted });
        else if (legacy) setMigrated({ from: "localStorage", n: legacy });
        setBoot("ready");
        if (backend === "idb") {
          setNotice("Running on IndexedDB instead of the SQLite file: " + (Storage.reason || "unknown") + ". Everything works, but there is no single database file to copy out.");
        }
        if (d.settings && d.settings.mlEnabled) enableML(d.questions, v);
      } catch (e) {
        setFatal("This browser blocked local storage entirely, so nothing can be saved. Private mode often does this — try a normal window.");
        setBoot("ready");
      }
    })();
  }, []);

  /* ---- writes go through here so the store and memory never diverge ---- */
  const putQ = useCallback(async (q) => {
    setQuestions((prev) => { const i = prev.findIndex((x) => x.id === q.id); if (i < 0) return [q, ...prev]; const c = [...prev]; c[i] = q; return c; });
    try { await Repo.saveQuestion(q); setStore(Storage.info()); } catch (e) { setFatal("Save failed. Your last change is only in memory."); }
  }, []);
  const dropQ = useCallback(async (id) => {
    setQuestions((prev) => prev.filter((x) => x.id !== id && x.variantOf !== id));
    try { await Repo.removeQuestion(id); setStore(Storage.info()); } catch (e) {}
  }, []);
  const putC = useCallback(async (c) => {
    setConcepts((prev) => { const i = prev.findIndex((x) => x.id === c.id); if (i < 0) return [...prev, c]; const n = [...prev]; n[i] = c; return n; });
    try { await Repo.saveConcept(c); } catch (e) {}
  }, []);
  const putL = useCallback(async (l) => {
    setLanguages((prev) => { const i = prev.findIndex((x) => x.id === l.id); if (i < 0) return [...prev, l]; const n = [...prev]; n[i] = l; return n; });
    try { await Repo.saveLanguage(l); } catch (e) {}
  }, []);
  const putSettings = useCallback(async (patch) => {
    setSettings((prev) => { const next = { ...prev, ...patch }; Repo.saveSettings(next).catch(() => {}); return next; });
  }, []);
  /* Pull, merge, push, then reload from the store — so what is on screen
     is exactly what was written, not an optimistic guess. */
  const runSync = useCallback(async () => {
    const token = (settings.ghToken || "").trim();
    if (!token) throw new Error("No token saved yet.");
    let gistId = settings.gistId || null;
    const all = await Repo.loadAll();
    let remote = null;
    if (gistId) remote = await gistRead(token, gistId);
    const { merged, report } = mergeSync(
      { questions: all.questions, concepts: all.concepts, languages: all.languages, reviews: all.reviews },
      remote || {});
    /* keepStamp: a merge must never restamp rows, or every sync would look
       like a fresh edit and last-write-wins would stop meaning anything */
    await Repo.saveConcepts(merged.concepts, true);
    await Repo.saveLanguages(merged.languages, true);
    await Repo.saveQuestions(merged.questions, true);
    await Repo.saveReviews(merged.reviews.filter((r) => !all.reviews.some((x) => x.qid === r.qid && x.at === r.at)));
    const after = await Repo.loadAll();
    gistId = await gistWrite(token, gistId, syncPayload(after, deviceName()));
    if (Storage.backend === "sqlite") await Storage.flush();
    const d = await Repo.load();
    setQuestions(d.questions); setConcepts(d.concepts); setLanguages(d.languages || []);
    setReviews(await Repo.allReviews().catch(() => []));
    setStore(Storage.info());
    await putSettings({ gistId, lastSyncAt: now() });
    return { report, gistId };
  }, [settings.ghToken, settings.gistId]);

  const pushReview = useCallback(async (r) => {
    setReviews((prev) => [...prev, r]);
    try { await Repo.logReview(r); } catch (e) {}
  }, []);
  const putVec = useCallback(async (id, v) => {
    setVecs((prev) => { const m = new Map(prev); m.set(id, v); return m; });
    try { await Repo.putVector(id, v); } catch (e) {}
  }, []);

  /* ---- turn on embeddings and backfill every question that lacks one ---- */
  const enableML = useCallback(async (qs, existing) => {
    const ok = await ML.enable();
    if (!ok) return false;
    const list = qs || questions;
    const have = existing || vecs;
    const todo = list.filter((q) => !have.get(q.id));
    if (todo.length) {
      setBackfill({ done: 0, total: todo.length });
      const next = new Map(have);
      for (let i = 0; i < todo.length; i++) {
        const v = await ML.embed(todo[i].text);
        if (v) { next.set(todo[i].id, v); Repo.putVector(todo[i].id, v).catch(() => {}); }
        if (i % 3 === 0 || i === todo.length - 1) setBackfill({ done: i + 1, total: todo.length });
      }
      setVecs(next);
      setBackfill(null);
    }
    return true;
  }, [questions, vecs]);

  const mlReady = mlState.state === "ready" && !backfill;
  const dueCount = questions.filter((q) => !q.variantOf && isDue(q)).length;
  const dueShown = useCountUp(dueCount, 620);
  const counts = useMemo(() => dailyCounts(reviews), [reviews]);
  const streak = useMemo(() => computeStreak(counts, settings.dailyGoal || 1), [counts, settings.dailyGoal]);
  const xp = useMemo(() => xpOf(reviews, questions), [reviews, questions]);
  const level = useMemo(() => levelOf(xp), [xp]);
  const streakShown = useCountUp(streak.current, 620);
  const todayCount = counts.get(dayKey(now())) || 0;

  if (boot === "loading") {
    return <div className="qb" data-theme={settings.theme || "light"}><style>{CSS}</style><div className="wrap">
      <div className="brand"><h1>The <em>Bank</em></h1><p>Opening bank.sqlite3…</p></div>
    </div></div>;
  }

  const ctx = { questions, concepts, languages, settings, vecs, mlReady, putQ, dropQ, putC, putL, putVec,
    putSettings, store, refreshStore: () => setStore(Storage.info()),
    reviews, pushReview, counts, streak, xp, level, todayCount, runSync };

  return (
    <div className="qb" data-theme={settings.theme || "light"}>
      <style>{CSS}</style>
      <div className="shell">
        <aside className="sidebar">
          <div className="brand">
            <span className="mast-eyebrow">Local file · no sync</span>
            <h1>The <em>Bank</em></h1>
            <p>{questions.length} questions · {concepts.length} concepts · no duplicates</p>
          </div>

          <div className="side-stats">
            <div className={"stamp" + (dueCount === 0 ? " zero" : "")} title="Questions due for review today">
              <b>{dueShown}</b>
              <span>due today</span>
            </div>
            <button className={"streak" + (streak.current > 0 ? " live" : "")} onClick={() => setTab("stats")}
              title={streak.current > 0
                ? streak.current + " day streak · " + streak.freezesLeft + " rest day" + (streak.freezesLeft === 1 ? "" : "s") + " banked"
                : "Review anything today to start a streak"}>
              <span className="fire">🔥</span>
              <span><b>{streakShown}</b><small>day streak</small></span>
            </button>
            <button
              className={"mlpill " + (mlState.state === "ready" ? "on" : mlState.state === "loading" ? "load" : "")}
              onClick={() => setTab("data")}
              title="Semantic matching status"
            >
              <span className="led" />
              {mlState.state === "ready" ? (backfill ? "indexing" : "semantic") : mlState.state === "loading" ? mlState.progress + "%" : mlState.state === "failed" ? "lexical" : "lexical"}
            </button>
            <button
              className="theme-toggle"
              onClick={() => putSettings({ theme: settings.theme === "dark" ? "light" : "dark" })}
              title="Switch between light and dark mode"
            >
              {settings.theme === "dark" ? "☀ Light" : "● Dark"}
            </button>
          </div>

          <div className="tabs" role="tablist">
            {[["add", "Add"], ["review", "Review"], ["coverage", "Coverage"], ["stats", "Stats"], ["bank", "Bank"], ["data", "Settings"]].map(([k, label]) => (
              <button key={k} role="tab" aria-selected={tab === k} className={tab === k ? "on" : ""} onClick={() => setTab(k)}>
                {label}{k === "review" && dueCount > 0 && <span className="badge">{dueCount}</span>}
              </button>
            ))}
          </div>
        </aside>

        <main className="main" key={tab}>
          {fatal && <div className="alert stop" style={{ marginTop: 0, marginBottom: 14 }}><b>Storage problem</b>{fatal}</div>}
          {notice && <div className="alert warn" style={{ marginTop: 0, marginBottom: 14 }}>
            <b>Fallback storage</b>{notice}
            <button className="btn tiny line" style={{ marginTop: 9 }} onClick={() => setNotice(null)}>Got it</button>
          </div>}
          {migrated && <div className="alert ok" style={{ marginTop: 0, marginBottom: 14 }}>
            <b>Moved into the database file</b>
            {migrated.n} question{migrated.n === 1 ? "" : "s"} lifted out of {migrated.from} into bank.sqlite3, with review history intact.
            <button className="btn tiny line" style={{ marginTop: 9 }} onClick={() => setMigrated(null)}>Dismiss</button>
          </div>}
          {backfill && (
            <div className="alert ml" style={{ marginTop: 0, marginBottom: 14 }}>
              <b>Indexing your bank</b>
              Building meaning vectors — {backfill.done} of {backfill.total}.
              <div className="bar"><i style={{ width: Math.round((backfill.done / backfill.total) * 100) + "%" }} /></div>
            </div>
          )}

          {tab === "add" && <AddView ctx={ctx} prefill={prefill} clearPrefill={() => setPrefill(null)}
            editItem={editItem} clearEdit={() => setEditItem(null)} />}
          {tab === "review" && <ReviewView ctx={ctx} goAdd={() => setTab("add")} />}
          {tab === "coverage" && <CoverageView ctx={ctx} onGap={(p) => { setPrefill(p); setTab("add"); }} />}
          {tab === "bank" && <BankView ctx={ctx} goAdd={() => setTab("add")}
            onEdit={(item) => { setEditItem(item); setTab("add"); }} seed={async () => {
            const s = STARTER();
            await Repo.saveConcepts(s.concepts); await Repo.saveQuestions(s.questions);
            setConcepts(s.concepts); setQuestions(s.questions);
          }} />}
          {tab === "stats" && <StatsView ctx={ctx} />}
          {tab === "data" && <DataView ctx={ctx} mlState={mlState} backfill={backfill} store={store}
            enableML={() => { putSettings({ mlEnabled: true }); enableML(); }}
            setAll={(q, c, l) => { setQuestions(q); setConcepts(c); if (l) setLanguages(l); }} />}
        </main>
      </div>
    </div>
  );
}

  const [draft, setDraft] = useState(value || "");
  const n = splitBeats(draft).length;
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-panel" onClick={(e) => e.stopPropagation()}>

          <span className="eyebrow" style={{ margin: 0 }}>{title}</span>
