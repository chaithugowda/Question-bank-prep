        </div>
      </div>
    </div>
  );
}

/* ================================ ADD ================================== */
function AddView({ ctx, prefill, clearPrefill, editItem, clearEdit }) {
  const { questions, concepts, languages, vecs, mlReady, putQ, putC, putL, putVec } = ctx;
  const [text, setText] = useState("");
  const [answer, setAnswer] = useState("");
  const [codeExample, setCodeExample] = useState("");
  const [conceptInput, setConceptInput] = useState("");
  const [conceptId, setConceptId] = useState(null);
  const [languageInput, setLanguageInput] = useState("");
  const [languageId, setLanguageId] = useState(null);
  const [touchedLanguage, setTouchedLanguage] = useState(false);
  const [angle, setAngle] = useState(null);
  const [angleAuto, setAngleAuto] = useState(null);
  const [difficulty, setDifficulty] = useState("medium");
  const [override, setOverride] = useState(false);
  const [flash, setFlash] = useState(null);
  const [debounced, setDebounced] = useState("");
  const [liveVec, setLiveVec] = useState(null);
  const [thinking, setThinking] = useState(false);
  const [touchedConcept, setTouchedConcept] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [answerEditorOpen, setAnswerEditorOpen] = useState(false);
  const [codeEditorOpen, setCodeEditorOpen] = useState(false);

  const conceptOf = (id) => concepts.find((c) => c.id === id);
  const languageOf = (id) => languages.find((l) => l.id === id);

  useEffect(() => {
    if (!prefill) return;
    setText(prefill.text || "");
    setConceptId(prefill.conceptId || null);
    setTouchedConcept(true);
    if (prefill.angle) { setAngle(prefill.angle); }
    setConceptInput("");
    clearPrefill();
  }, [prefill, clearPrefill]);

  /* load an existing question into the same form, checks and all, rather
     than a separate edit screen — so an edit is held to the exact same
     duplicate and concept checks a new question would face. */
  useEffect(() => {
    if (!editItem) return;
    setEditingId(editItem.id);
    setText(editItem.text || "");
    setAnswer(editItem.answer || "");
    setCodeExample(editItem.codeExample || "");
    setConceptId(editItem.conceptId || null);
    setLanguageId(editItem.languageId || null);
    setAngle(editItem.angle || null);
    setDifficulty(editItem.difficulty || "medium");
    setConceptInput("");
    setLanguageInput("");
    setTouchedConcept(true);
    setTouchedLanguage(true);
    setOverride(false);
    setFlash(null);
  }, [editItem]);

  function cancelEdit() {
    setEditingId(null);
    setText(""); setAnswer(""); setCodeExample(""); setConceptId(null); setLanguageId(null); setAngle(null); setDifficulty("medium");
    setConceptInput(""); setLanguageInput(""); setTouchedConcept(false); setTouchedLanguage(false); setOverride(false);
    setDebounced(""); setLiveVec(null);
    clearEdit();
  }

  useEffect(() => { const t = setTimeout(() => setDebounced(text), 220); return () => clearTimeout(t); }, [text]);

  const active = debounced.trim().length >= 8;
  /* progressive disclosure: keep concept/angle/answer out of the way until
     there's an actual question worth categorizing — instant, not debounced,
     so the extra fields don't lag behind typing. */
  const showMore = text.trim().length >= 8 || !!editingId;

  /* embed what is being typed, cancel if it changes underneath us */
  useEffect(() => {
    let dead = false;
    if (!active || !mlReady) { setLiveVec(null); return; }
    setThinking(true);
    ML.embed(debounced).then((v) => { if (!dead) { setLiveVec(v); setThinking(false); } })
      .catch(() => { if (!dead) setThinking(false); });
    return () => { dead = true; };
  }, [debounced, active, mlReady]);

  /* ---- the collision check: lexical always, semantic when available ---- */
  const matches = useMemo(() => {
    if (!active) return [];
    return questions
      .filter((q) => q.id !== editingId)
      .map((q) => {
        const lex = lexScore(debounced, q.text);
        let sem = null;
        if (liveVec) { const v = vecs.get(q.id); if (v) sem = semScore(cosine(liveVec, v)); }
        const b = blend(lex, sem);
        return { q, ...b };
      })
      .sort((a, b) => b.score - a.score)
      .slice(0, 3)
      .filter((m) => m.score >= 22);
  }, [debounced, active, questions, vecs, liveVec, editingId]);

  const top = matches.length ? matches[0] : null;
  const score = top ? top.score : 0;
  /* the ticks track the score instantly; only the big readout eases, so the
     gauge still reads as a live measurement rather than a progress bar */
  const scoreShown = useCountUp(active ? score : 0, 380);
  const bnd = active ? band(score) : "clear";
  const blocked = active && bnd === "collide" && !override;

  /* ---- auto-tag: nearest angle probe, and kNN vote for the concept ---- */
  useEffect(() => {
    if (!active) { setAngleAuto(null); return; }
    if (liveVec && ML.angleVecs) {
      let best = null, bs = -1;
      ANGLES.forEach((a) => { const s = cosine(liveVec, ML.angleVecs[a.id]); if (s > bs) { bs = s; best = a.id; } });
      setAngleAuto({ id: best, conf: Math.round(clamp01((bs - 0.15) / 0.45) * 100), how: "meaning" });
    } else {
      setAngleAuto({ id: guessAngleLexical(debounced), conf: null, how: "wording" });
    }
  }, [liveVec, debounced, active]);

  useEffect(() => { if (angleAuto && angle === null) setAngle(angleAuto.id); }, [angleAuto, angle]);

  const conceptSuggestions = useMemo(() => {
    if (!active) return [];
    if (liveVec) {
      /* k nearest neighbours, similarity-weighted vote */
      const scored = questions
        .filter((q) => q.conceptId && vecs.get(q.id) && q.id !== editingId)
        .map((q) => ({ q, s: cosine(liveVec, vecs.get(q.id)) }))
        .sort((a, b) => b.s - a.s)
        .slice(0, 5)
        .filter((x) => x.s > 0.25);
      const votes = {};
      scored.forEach(({ q, s }) => { votes[q.conceptId] = (votes[q.conceptId] || 0) + s; });
      const total = Object.values(votes).reduce((a, b) => a + b, 0) || 1;
      return Object.keys(votes)
        .sort((a, b) => votes[b] - votes[a]).slice(0, 3)
        .map((id) => ({ c: conceptOf(id), conf: Math.round((votes[id] / total) * 100) }))
        .filter((x) => x.c);
    }
    const t = toks(debounced);
    return concepts
      .map((c) => {
        const bag = new Set();
        questions.filter((q) => q.conceptId === c.id).forEach((q) => toks(q.text).forEach((w) => bag.add(w)));
        toks(c.name).forEach((w) => bag.add(w));
        let hit = 0; t.forEach((w) => { if (bag.has(w)) hit++; });
        return { c, conf: null, hit };
      })
      .filter((x) => x.hit > 0).sort((a, b) => b.hit - a.hit).slice(0, 4);
  }, [debounced, active, liveVec, questions, concepts, vecs, editingId]);

  /* accept the top suggestion automatically until the user overrides it */
  useEffect(() => {
    if (touchedConcept || conceptId || !conceptSuggestions.length) return;
    const top0 = conceptSuggestions[0];
    if (top0.conf === null || top0.conf >= 55) setConceptId(top0.c.id);
  }, [conceptSuggestions, touchedConcept, conceptId]);

  const difficultyHint = useMemo(() => {
    const near = matches.filter((m) => m.score >= 40);
    if (near.length < 2) return null;
    const counts = {};
    near.forEach((m) => { counts[m.q.difficulty] = (counts[m.q.difficulty] || 0) + 1; });
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  }, [matches]);

  const resolution = useMemo(() => (conceptInput.trim() ? resolveConcept(conceptInput, concepts) : null), [conceptInput, concepts]);
  const languageResolution = useMemo(() => (languageInput.trim() ? resolveConcept(languageInput, languages) : null), [languageInput, languages]);

  const gapAngles = useMemo(() => {
    if (!conceptId) return [];
    const have = new Set(questions.filter((q) => q.conceptId === conceptId && q.id !== editingId).map((q) => q.angle));
    return ANGLES.filter((a) => !have.has(a.id));
  }, [conceptId, questions, editingId]);

  function pickConcept(c) { setConceptId(c.id); setConceptInput(""); setTouchedConcept(true); }

  function useAliasFor(c) {
    const typed = conceptInput.trim();
    putC({ ...c, aliases: [...(c.aliases || []), typed] });
    pickConcept(c);
    setFlash({ kind: "ok", title: "Folded in", body: '"' + typed + '" now points at ' + c.name + '. Type it again any time.' });
  }
  function createConcept() {
    const name = conceptInput.trim().replace(/\s+/g, " ");
    const c = { id: uid(), name: name.charAt(0).toUpperCase() + name.slice(1), aliases: [] };
    putC(c); pickConcept(c);
  }

  function pickLanguage(l) { setLanguageId(l.id); setLanguageInput(""); setTouchedLanguage(true); }

  function useAliasForLanguage(l) {
    const typed = languageInput.trim();
    putL({ ...l, aliases: [...(l.aliases || []), typed] });
    pickLanguage(l);
    setFlash({ kind: "ok", title: "Folded in", body: '"' + typed + '" now points at ' + l.name + '. Type it again any time.' });
  }
  function createLanguage() {
    const name = languageInput.trim().replace(/\s+/g, " ");
    const l = { id: uid(), name: name.charAt(0).toUpperCase() + name.slice(1), aliases: [] };
    putL(l); pickLanguage(l);
  }

  async function save(asVariant) {
    const clean = text.trim().replace(/\s+/g, " ");

    if (editingId) {
      const prev = questions.find((x) => x.id === editingId) || {};
      const textChanged = prev.text !== clean;
      const q = { ...prev, text: clean, answer: answer.trim(), codeExample: codeExample.trim(), conceptId, languageId, angle: angle || "def", difficulty };
      await putQ(q);
      if (mlReady) {
        const v = textChanged ? (liveVec || (await ML.embed(clean))) : (liveVec || vecs.get(editingId));
        if (v) putVec(q.id, v);
      }
      cancelEdit();
      setFlash({
        kind: "ok",
        title: "Question updated",
        body: "Saved in place — review history, streak, and due date are untouched.",
      });
      return;
    }

    const q = {
      id: uid(), text: clean, answer: answer.trim(), codeExample: codeExample.trim(), conceptId, languageId, angle: angle || "def", difficulty,
      due: now(), created: now(), last: null,
      reps: 0, lapses: 0, stability: null, difficultyF: null, interval: null,
      variantOf: asVariant && top ? top.q.id : null,
    };
    await putQ(q);
    if (mlReady) { const v = liveVec || (await ML.embed(clean)); if (v) putVec(q.id, v); }
    setText(""); setAnswer(""); setCodeExample(""); setAngle(null); setOverride(false); setDebounced(""); setLiveVec(null);
    setTouchedConcept(false); setTouchedLanguage(false);
    setFlash({
      kind: "ok",
      title: asVariant ? "Saved as a variant" : "Added to the bank",
      body: asVariant
        ? "Filed under the question it resembles, so review shows one of them at a time."
        : "Queued for today. " + (conceptId ? angleName(q.angle) + " covered for " + conceptOf(conceptId).name + "." : "No concept, so it stays outside Coverage."),
    });
  }

  const empty = !questions.length && !concepts.length;

  return (
    <>
      {editingId && (
        <div className="alert info" style={{ marginTop: 0, marginBottom: 14 }}>
          <b>Editing an existing question</b>
          Same duplicate, concept, and angle checks as adding a new one. Its due date, streak, and review history stay exactly as they are.
        </div>
      )}
      {flash && <div className={"alert " + (flash.kind === "ok" ? "ok" : "warn")} style={{ marginTop: 0, marginBottom: 14 }}><b>{flash.title}</b>{flash.body}</div>}

      <div className="card">
        <div className="field">
          <span className="eyebrow">The question</span>
          <textarea className="q" value={text}
            onChange={(e) => { setText(e.target.value); setOverride(false); setFlash(null); }}
            placeholder="Type the question as an interviewer would ask it…" />
          <p className="hint">
            {empty ? "Nothing to compare against yet — load the starter set from the Bank tab."
              : mlReady ? "Compared against the other " + Math.max(0, questions.length - (editingId ? 1 : 0)) + " by meaning and by wording."
              : "Compared against the other " + Math.max(0, questions.length - (editingId ? 1 : 0)) + " by wording. Turn on semantic matching in Settings to catch paraphrases."}
          </p>
        </div>

        <div className="gauge">
          <div className="gauge-top">
            <div className="gauge-num" key={bnd} style={{ color: active ? BAND_COLOR[bnd] : "var(--ledoff)" }}>
              {active ? scoreShown : "—"}<span>{active ? "%" : ""}</span>
            </div>
            <div className="gauge-verdict">
              <b style={{ color: active ? BAND_COLOR[bnd] : "var(--soft)" }}>{active ? BAND_TEXT[bnd][0] : "Waiting for a question"}</b>
              <small>{active ? BAND_TEXT[bnd][1] : "eight characters to start"}</small>
            </div>
          </div>
          <div className="ticks" aria-hidden="true">
            {Array.from({ length: 20 }).map((_, i) => {
              const lit = active && score >= (i + 1) * 5;
              const d = { transitionDelay: (lit ? i * 13 : (19 - i) * 7) + "ms" };
              return <i key={i} className={lit ? "lit" : ""}
                style={lit ? { ...d, background: BAND_COLOR[bnd] } : d} />;
            })}
          </div>
          <div className="ticks-scale"><span>NEW</span><span>OVERLAP</span><span>DUPLICATE</span></div>
          {active && thinking && <div className="measuring" aria-hidden="true"><i /></div>}
          {active && top && (
            <div className="split">
              <span>wording <b>{top.lex}%</b></span>
              <span>meaning <b>{top.sem === null ? (thinking ? "…" : "off") : top.sem + "%"}</b></span>
            </div>
          )}
        </div>

        {matches.length > 0 && (
          <div className="near">
            <span className="eyebrow">Closest in the bank</span>
            {matches.map((m) => {
              const c = conceptOf(m.q.conceptId);
              return (
                <div className="near-row" key={m.q.id}>
                  <span className="pct" style={{ color: BAND_COLOR[band(m.score)] }}>{m.score}%</span>
                  <div>
                    <div className="near-q">{m.q.text}</div>
                    <div className="near-meta">
                      {c ? c.name : "unfiled"} · {angleName(m.q.angle)} · {strengthOf(m.q)}
                      {m.sem !== null && m.sem - m.lex >= 22 ? " · caught by meaning" : ""}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {active && bnd === "collide" && !override && (
          <div className="alert stop">
            <b>This one's already asked.</b>
            {editingId
              ? "Sharpen the wording so it doesn't overlap the question above, or save anyway if the overlap is intentional."
              : "Sharpen the wording, or keep it as a variant of the existing question so review never shows you both."}
            <div className="row" style={{ marginTop: 10 }}>
              <button className="btn tiny line" onClick={() => setOverride(true)}>{editingId ? "Save anyway" : "Keep as a variant"}</button>
            </div>
          </div>
        )}
        {active && bnd === "near" && (
          <div className="alert warn">
            <b>Close, but maybe not the same.</b>
            If it tests a different angle, keep it. If it has the same answer in new words, edit the one above instead.
          </div>
        )}
      </div>

      {showMore && (
        <>
          <div className="card">
            <span className="eyebrow">Concept {liveVec && conceptSuggestions.length > 0 && !conceptId ? "— suggested from nearest questions" : ""}</span>
            {conceptId ? (
              <div className="chips">
                <button className="chip on" onClick={() => { setConceptId(null); setTouchedConcept(true); }}>
                  {conceptOf(conceptId) ? conceptOf(conceptId).name : "?"}<span className="x">✕</span>
                </button>
              </div>
            ) : (
              <>
                <input className="t" value={conceptInput} onChange={(e) => { setConceptInput(e.target.value); setTouchedConcept(true); }} placeholder="Search or name a concept…" />
                {conceptInput.trim() === "" && conceptSuggestions.length > 0 && (
                  <div className="chips">
                    {conceptSuggestions.map(({ c, conf }) => (
                      <button key={c.id} className="chip" onClick={() => pickConcept(c)}>
                        {c.name}{conf !== null && <span className="conf">{conf}%</span>}
                      </button>
                    ))}
                  </div>
                )}
                {conceptInput.trim() !== "" && (
                  <div className="chips">
                    {concepts.filter((c) => cnorm(c.name).includes(cnorm(conceptInput)) || (c.aliases || []).some((a) => cnorm(a).includes(cnorm(conceptInput))))
                      .slice(0, 6).map((c) => <button key={c.id} className="chip" onClick={() => pickConcept(c)}>{c.name}</button>)}
                  </div>
                )}
                {resolution && resolution.kind === "exact" && (
                  <div className="alert ok"><b>{resolution.concept.name} already exists.</b>
                    <button className="btn tiny line" style={{ marginTop: 8 }} onClick={() => pickConcept(resolution.concept)}>Use it</button></div>
                )}
                {resolution && resolution.kind === "similar" && (
                  <div className="alert warn">
                    <b>Did you mean {resolution.concept.name}?</b>
                    Two spellings of one concept split your coverage in half.
                    <div className="row" style={{ marginTop: 10 }}>
                      <button className="btn tiny" onClick={() => useAliasFor(resolution.concept)}>Use {resolution.concept.name}</button>
                      <button className="btn tiny line" onClick={createConcept}>Keep separate</button>
                    </div>
                  </div>
                )}
                {resolution && resolution.kind === "new" && (
                  <button className="btn tiny line" style={{ marginTop: 10 }} onClick={createConcept}>Create “{conceptInput.trim()}”</button>
                )}
              </>
            )}
          </div>

          <div className="card">
            <span className="eyebrow">Language</span>
            {languageId ? (
              <div className="chips">
                <button className="chip on" onClick={() => { setLanguageId(null); setTouchedLanguage(true); }}>
                  {languageOf(languageId) ? languageOf(languageId).name : "?"}<span className="x">✕</span>
                </button>
              </div>
            ) : (
              <>
                <input className="t" value={languageInput} onChange={(e) => { setLanguageInput(e.target.value); setTouchedLanguage(true); }} placeholder="Search or name a language…" />
                {languageInput.trim() === "" && languages.length > 0 && (
                  <div className="chips">
                    {languages.slice(0, 10).map((l) => (
                      <button key={l.id} className="chip" onClick={() => pickLanguage(l)}>{l.name}</button>
                    ))}
                  </div>
                )}
                {languageInput.trim() !== "" && (
                  <div className="chips">
                    {languages.filter((l) => cnorm(l.name).includes(cnorm(languageInput)) || (l.aliases || []).some((a) => cnorm(a).includes(cnorm(languageInput))))
                      .slice(0, 6).map((l) => <button key={l.id} className="chip" onClick={() => pickLanguage(l)}>{l.name}</button>)}
                  </div>
                )}
                {languageResolution && languageResolution.kind === "exact" && (
                  <div className="alert ok"><b>{languageResolution.concept.name} already exists.</b>
                    <button className="btn tiny line" style={{ marginTop: 8 }} onClick={() => pickLanguage(languageResolution.concept)}>Use it</button></div>
                )}
                {languageResolution && languageResolution.kind === "similar" && (
                  <div className="alert warn">
                    <b>Did you mean {languageResolution.concept.name}?</b>
                    Two spellings of one language split your coverage in half.
                    <div className="row" style={{ marginTop: 10 }}>
                      <button className="btn tiny" onClick={() => useAliasForLanguage(languageResolution.concept)}>Use {languageResolution.concept.name}</button>
                      <button className="btn tiny line" onClick={createLanguage}>Keep separate</button>
                    </div>
                  </div>
                )}
                {languageResolution && languageResolution.kind === "new" && (
                  <button className="btn tiny line" style={{ marginTop: 10 }} onClick={createLanguage}>Create “{languageInput.trim()}”</button>
                )}
              </>
            )}
            <p className="hint">Optional. Useful when the same concept gets asked differently across languages — e.g. concurrency in Java vs. Go.</p>
          </div>

          <div className="card">
            <span className="eyebrow">
              Angle
              {angleAuto && <span style={{ textTransform: "none", letterSpacing: 0 }}>
                {" — read as " + angleName(angleAuto.id) + " from " + angleAuto.how}
                {angleAuto.conf !== null ? " (" + angleAuto.conf + "%)" : ""}
              </span>}
            </span>
            <div className="chips">
              {ANGLES.map((a) => <button key={a.id} className={"chip" + (angle === a.id ? " on" : "")} onClick={() => setAngle(a.id)}>{a.name}</button>)}
            </div>
            <p className="hint">Every concept is worth asking six ways. The angle is how Coverage finds your blind spots.</p>

            {conceptId && gapAngles.length > 0 && (
              <>
                <span className="eyebrow" style={{ marginTop: 16 }}>Still unasked for {conceptOf(conceptId) ? conceptOf(conceptId).name : ""}</span>
                <div className="chips">
                  {gapAngles.map((a) => <button key={a.id} className="chip ghost" onClick={() => setAngle(a.id)}>{a.name}</button>)}
                </div>
              </>
            )}

            <div className="field">
              <span className="eyebrow">Difficulty {difficultyHint && <span style={{ textTransform: "none", letterSpacing: 0 }}>— similar ones are {difficultyHint}</span>}</span>
              <div className="chips">
                {["easy", "medium", "hard"].map((d) => <button key={d} className={"chip" + (difficulty === d ? " on" : "")} onClick={() => setDifficulty(d)}>{d}</button>)}
              </div>
            </div>
          </div>

          <div className="card">
            <span className="eyebrow">What a strong answer covers</span>
            <textarea className="q sm" value={answer} onChange={(e) => setAnswer(e.target.value)}
              placeholder={"One beat per line.\nReview checks your spoken answer against each one."} />
            <p className="hint">
              {splitBeats(answer).length > 0
                ? splitBeats(answer).length + " beat" + (splitBeats(answer).length === 1 ? "" : "s") + " detected. Review will tell you which ones you skipped."
                : "Write one beat per line. Review scores your spoken answer against them individually."}
            </p>
            <button type="button" className="expand-btn" onClick={() => setAnswerEditorOpen(true)}>⤢ Open full editor</button>
          </div>

          <div className="card">
            <span className="eyebrow">Code example / reference (optional)</span>
            <textarea className="q sm mono" value={codeExample} onChange={(e) => setCodeExample(e.target.value)}
              placeholder={"Paste a snippet, sample output, or a link worth remembering…"} />
            <p className="hint">Shown alongside the answer in Review and Bank, formatted as code. Not graded — just there for reference.</p>
            <button type="button" className="expand-btn" onClick={() => setCodeEditorOpen(true)}>⤢ Open full editor</button>
          </div>
        </>
      )}

      {answerEditorOpen && (
        <AnswerEditorModal
          title="What a strong answer covers"
          value={answer}
          onSave={setAnswer}
          onClose={() => setAnswerEditorOpen(false)}
        />
      )}

      {codeEditorOpen && (
        <AnswerEditorModal
          title="Code example / reference"
          value={codeExample}
          onSave={setCodeExample}
          onClose={() => setCodeEditorOpen(false)}
          mono
          placeholder="Paste a snippet, sample output, or a link worth remembering…"
          hint="Not graded — shown as reference alongside the answer."
          saveLabel="Save example"
        />
      )}

      <div className="card">
        <div className="row">
          <button className="btn" disabled={!text.trim() || !showMore || blocked} onClick={() => save(!editingId && override && bnd === "collide")}>
            {blocked ? "Too close to save"
              : !showMore ? "Keep typing…"
              : editingId ? "Save changes"
              : override && bnd === "collide" ? "Save as a variant"
              : "Add to the bank"}
          </button>
          {editingId && <button className="btn line" onClick={cancelEdit}>Cancel</button>}
        </div>
      </div>
    </>
  );
}

/* ============================== REVIEW ================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function useDictation() {
  const [supported] = useState(!!SR);
  const [listening, setListening] = useState(false);
  const [text, setText] = useState("");
  const [interim, setInterim] = useState("");
  const [error, setError] = useState(null);
  const ref = useRef(null);
  const finalRef = useRef("");

  const start = useCallback(() => {
    if (!SR) return;
    setError(null); setText(""); setInterim(""); finalRef.current = "";
    let r;
    try { r = new SR(); } catch (e) { setError("mic unavailable"); return; }
    r.continuous = true; r.interimResults = true; r.lang = navigator.language || "en-US";
    r.onresult = (e) => {
      let live = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const chunk = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalRef.current += chunk + " ";
        else live += chunk;
      }
      setText(finalRef.current); setInterim(live);
    };
    r.onerror = (e) => {
      const k = e.error;
      setError(k === "not-allowed" || k === "service-not-allowed"
        ? "Microphone blocked. Allow it in your browser's site settings, or answer without it."
        : k === "no-speech" ? "Didn't hear anything." : "Speech recognition stopped (" + k + ").");
      setListening(false);
    };
    r.onend = () => { if (ref.current === r) setListening(false); };
    ref.current = r;
    try { r.start(); setListening(true); } catch (e) { setError("Could not start the mic."); }
  }, []);

  const stop = useCallback(() => {
    const r = ref.current;
    if (r) { try { r.stop(); } catch (e) {} }
    setListening(false);
    setInterim("");
    return (finalRef.current || "").trim();
  }, []);

  useEffect(() => () => { const r = ref.current; if (r) { try { r.abort(); } catch (e) {} } }, []);
  return { supported, listening, text, interim, error, start, stop, setText };
}

/** Score a spoken answer beat by beat. Semantic when available, lexical otherwise. */
async function gradeBeats(beats, transcript, mlReady) {
  if (!beats.length || !transcript) return null;
  const sents = splitSentences(transcript);
  const pool = sents.length ? sents : [transcript];
  if (mlReady) {
    const [bv, pv] = [await ML.embedMany(beats), await ML.embedMany(pool)];
    return beats.map((b, i) => {
      let best = 0;
      pv.forEach((v) => { const s = cosine(bv[i], v); if (s > best) best = s; });
      /* whole-transcript check catches beats spread across sentences */
      return { beat: b, score: best, state: best >= 0.46 ? "hit" : best >= 0.33 ? "part" : "miss" };
    });
  }
  return beats.map((b) => {
    const s = lexCoverage(b, transcript);
    return { beat: b, score: s, state: s >= 0.5 ? "hit" : s >= 0.3 ? "part" : "miss" };
  });
}

function suggestGrade(results, elapsed, target) {
  if (!results || !results.length) return null;
  const pts = results.reduce((a, r) => a + (r.state === "hit" ? 1 : r.state === "part" ? 0.5 : 0), 0);
  const ratio = pts / results.length;
  let g = ratio >= 0.85 ? 4 : ratio >= 0.6 ? 3 : ratio >= 0.3 ? 2 : 1;
  if (g === 4 && elapsed > target * 1.5) g = 3;   /* rambling is not fluent */
  if (g >= 3 && elapsed < 15) g = 2;              /* too short to be a real answer */
  return { grade: g, ratio };
}

const GRADES = [
  { g: 1, name: "Blanked", sub: "start over" },
  { g: 2, name: "Shaky", sub: "" },
  { g: 3, name: "Solid", sub: "" },
  { g: 4, name: "Fluent", sub: "" },
];


/* ==================== FLASHCARD FOCUS MODE (overlay) ==================== */
/* A full-screen stage rather than a section of the page: one card at a time,
   tap or Space to flip, 1-4 or a swipe to grade. The flip is a real rotateY
   on a preserve-3d element, so the back is physically the other side. */
function FlashcardOverlay({ ctx, queue, doneCount, onGrade, onClose }) {
  const { concepts, languages, settings } = ctx;
  const card = queue[0];
  const [flipped, setFlipped] = useState(false);
  const [exit, setExit] = useState("");
  const [hintSwipe, setHintSwipe] = useState(false);
  const touch = useRef(null);
  const busy = useRef(false);

  /* the page behind must not scroll while the stage is up */
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, []);

  useEffect(() => { setFlipped(false); setExit(""); busy.current = false; }, [card && card.id]);

  /* animate the card off the stage first, then let the parent reschedule it */
  const commit = useCallback((g) => {
    if (!card || busy.current) return;
    busy.current = true;
    setExit(g === 1 ? "left" : g === 4 ? "right" : "up");
    setTimeout(() => onGrade(card, g), 235);
  }, [card, onGrade]);

  useEffect(() => {
    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); onClose(); return; }
      if (!card || e.metaKey || e.ctrlKey || e.repeat) return;
      if (e.code === "Space") { e.preventDefault(); setFlipped(true); return; }
      if (flipped && (e.key === "1" || e.key === "2" || e.key === "3" || e.key === "4")) {
        e.preventDefault(); commit(Number(e.key));
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [flipped, card, commit, onClose]);

  function onTouchStart(e) {
    const t = e.touches[0];
    touch.current = { x: t.clientX, y: t.clientY };
  }
  function onTouchEnd(e) {
    if (!touch.current) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.current.x, dy = t.clientY - touch.current.y;
    touch.current = null;
    if (Math.abs(dx) < 62 && Math.abs(dy) < 62) return;   /* a tap, handled by onClick */
    if (!flipped) { setFlipped(true); return; }
    /* only a decisive sideways swipe grades, so a scroll never counts as one */
    if (Math.abs(dx) > Math.abs(dy) * 1.6) commit(dx < 0 ? 1 : 3);
  }

  const total = doneCount + queue.length;
  const pct = total ? Math.round((doneCount / total) * 100) : 100;
  const concept = card && concepts.find((c) => c.id === card.conceptId);
  const language = card && languages.find((l) => l.id === card.languageId);
  const beats = card ? splitBeats(card.answer) : [];

  return (
    <div className="fc-overlay" role="dialog" aria-modal="true" aria-label="Flashcard session">
      <div className="fc-top">
        <span className="fc-count">{Math.min(doneCount + 1, total)} / {total}</span>
        <div className="fc-progress"><i style={{ width: pct + "%" }} /></div>
        <button className="fc-close" onClick={onClose}>Esc ✕</button>
      </div>

      {card ? (
        <>
          <div className="fc-stage" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
            {queue.length > 2 && <div className="fc-ghost g2" />}
            {queue.length > 1 && <div className="fc-ghost g1" />}
            <div className={"fc-slot in" + (exit ? " out-" + exit : "")}>
              <div className={"fc-card" + (flipped ? " flipped" : "")}
                onClick={() => { if (!flipped) { setFlipped(true); setHintSwipe(true); } }}>

                <div className="fc-face fc-front">
                  <span className="fc-meta">
                    {concept ? concept.name : "Unfiled"}{language ? " · " + language.name : ""} · {angleName(card.angle)}
                  </span>
                  <div className="fc-q">{card.text}</div>
                  <span className="fc-tap">Tap to flip</span>
                </div>

                <div className="fc-face fc-back">
                  <span className="eyebrow">Answer</span>
                  {card.answer ? (
                    beats.length > 1
                      ? beats.map((b, i) => (
                          <div className="fc-beat" key={i}
                            style={{ animation: "beatIn .34s var(--ease-out) both", animationDelay: (120 + i * 70) + "ms" }}>
                            <i>{i + 1}</i><p>{b}</p>
                          </div>
                        ))
                      : <p className="fc-plain">{card.answer}</p>
                  ) : (
                    <p className="fc-plain" style={{ color: "var(--soft)" }}>
                      No notes on this one yet. Add them from Bank while it's fresh.
                    </p>
                  )}
                  {card.codeExample && <pre className="code-block">{card.codeExample}</pre>}
                </div>
              </div>
            </div>
          </div>

          {flipped ? (
            <>
              <div className="fc-grade">
                {GRADES.map(({ g, name }) => (
                  <button key={g} className={"g" + g} onClick={() => commit(g)}>
                    <b>{name}</b>
                    <small>{previewDays(card, g, settings.retention)}</small>
                  </button>
                ))}
              </div>
              <p className="fc-foot">{hintSwipe ? "1–4 · or swipe ← blanked / solid →" : "Press 1–4"}</p>
            </>
          ) : (
            <p className="fc-foot">Space to flip · Esc to leave</p>
          )}
        </>
      ) : (
        <div className="fc-done">
          <h3>Deck clear.</h3>
          <p>{doneCount} card{doneCount === 1 ? "" : "s"} through. Every one is rescheduled by how well it went.</p>
          <button className="btn" onClick={onClose}>Done</button>
        </div>
      )}
    </div>
  );
}

function ReviewView({ ctx, goAdd }) {
  const { questions, concepts, languages, settings, mlReady, putQ, putSettings, pushReview, todayCount, streak, level } = ctx;
  const mode = settings.reviewMode === "flashcard" ? "flashcard" : "spoken";
  /* only spoken practice runs through phases now; flashcards live in the overlay */
  const [phase, setPhase] = useState("ask");
  const [elapsed, setElapsed] = useState(0);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState([]);
  const [results, setResults] = useState(null);
  const [scoring, setScoring] = useState(false);
  const [manual, setManual] = useState("");
  const [focus, setFocus] = useState(false);
  const dict = useDictation();

  const queue = useMemo(() => questions
    .filter((q) => !q.variantOf && isDue(q) && !done.includes(q.id))
    .sort((a, b) => a.due - b.due), [questions, done]);
  const ahead = useMemo(() => questions.filter((q) => !q.variantOf && !isDue(q)).sort((a, b) => a.due - b.due), [questions]);
  const card = queue[0];

  useEffect(() => { if (!running) return; const t = setInterval(() => setElapsed((e) => e + 1), 1000); return () => clearInterval(t); }, [running]);
  useEffect(() => {
    setPhase("ask");
    setElapsed(0); setRunning(false); setResults(null); setManual("");
  }, [card && card.id, mode]);

  const target = settings.talkTarget || 90;
  const beats = useMemo(() => (card ? splitBeats(card.answer) : []), [card]);
  const queueShown = useCountUp(queue.length, 520);
  const doneShown = useCountUp(done.length, 520);
  const goal = settings.dailyGoal || 10;
  const goalPct = Math.min(100, Math.round((todayCount / goal) * 100));
  const justHit = useRef(false);
  const [celebrate, setCelebrate] = useState(false);
  useEffect(() => {
    if (todayCount >= goal && !justHit.current) { justHit.current = true; setCelebrate(true); }
    if (todayCount < goal) justHit.current = false;
  }, [todayCount, goal]);

  async function finishTalking() {
    setRunning(false);
    const spoken = dict.listening ? dict.stop() : (dict.text || manual).trim();
    setPhase("check");
    if (beats.length && spoken) {
      setScoring(true);
      try { setResults(await gradeBeats(beats, spoken, mlReady)); } catch (e) { setResults(null); }
      setScoring(false);
    }
  }

  async function grade(g) {
    const patch = schedule(card, g, settings.retention);
    const next = { ...card, ...patch };
    await putQ(next);
    pushReview({
      qid: card.id, at: now(), grade: g, elapsed,
      stability: patch.stability, difficulty: patch.difficultyF, interval: patch.interval,
      coverage: results ? results.filter((r) => r.state === "hit").length / results.length : null,
      transcriptLen: (dict.text || manual || "").length,
    });
    setDone((d) => [...d, card.id]);
  }

  /* Anki-style keyboard flow: Space advances (start answering / flip, then
     reveal), 1–4 grade once the answer is up. Ignored while typing in a field. */
  useEffect(() => {
    function onKey(e) {
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
      if (focus) return;   /* the overlay handles its own keys */
      if (!card) return;
      if (e.code === "Space") {
        if (mode === "flashcard") {
          e.preventDefault(); setFocus(true);
        } else if (phase === "ask") {
          e.preventDefault();
          if (dict.supported) dict.start();
          setRunning(true);
          setPhase("talk");
        } else if (phase === "talk") {
          e.preventDefault();
          finishTalking();
        }
      } else if (
        (e.key === "1" || e.key === "2" || e.key === "3" || e.key === "4") &&
        mode === "spoken" && phase === "check"
      ) {
        e.preventDefault();
        grade(Number(e.key));
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [phase, mode, focus, dict, manual, card, beats, mlReady, results, elapsed, target, settings.retention]);

  if (!questions.length) {
    return <div className="card"><div className="empty">
      <h3>Nothing to review yet.</h3>
      <p>Review pulls from the bank on a spacing schedule. Add a question and it shows up here today.</p>
      <button className="btn" onClick={goAdd}>Add a question</button>
    </div></div>;
  }

  const modeSwitch = (
    <div className="mode-toggle" role="tablist">
      <button className={mode === "spoken" ? "on" : ""} onClick={() => putSettings({ reviewMode: "spoken" })}>Spoken practice</button>
      <button className={mode === "flashcard" ? "on" : ""} onClick={() => putSettings({ reviewMode: "flashcard" })}>Flashcards</button>
    </div>
  );

  if (!card) {
    const nxt = ahead[0];
    return <>
      {modeSwitch}
      {goalPanel}
      <div className="card"><div className="empty">
        <h3>Queue clear.</h3>
        <p>{done.length ? "You worked through " + done.length + ". " : ""}{nxt ? "Next one comes back " + fmtDue(nxt).replace("due ", "") + "." : "Add more and they'll queue for today."}</p>
        <button className="btn line" onClick={goAdd}>Add a question</button>
      </div></div>
    </>;
  }


  /* The session panel: one ring, one number, one line of consequence.
     Progress is counted from the reviews table, so closing the tab
     mid-session does not lose it. */
  const goalPanel = (
    <div className={"card" + (celebrate ? " burst" : "")}>
      {celebrate && Array.from({ length: 16 }).map((_, i) => {
        const ang = (i / 16) * Math.PI * 2, dist = 70 + (i % 4) * 26;
        const hues = ["var(--indigo)", "var(--violet)", "var(--clear)", "var(--gold)"];
        return <span key={i} style={{
          background: hues[i % 4],
          "--dx": Math.cos(ang) * dist + "px", "--dy": Math.sin(ang) * dist + "px",
          animationDelay: (i * 18) + "ms",
        }} />;
      })}
      <div className="ring-row">
        <div className="ring">
          <svg width="78" height="78" viewBox="0 0 78 78">
            <defs>
              <linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stopColor="var(--indigo)" /><stop offset="100%" stopColor="var(--violet)" />
              </linearGradient>
            </defs>
            <circle className="track" cx="39" cy="39" r="33" />
            <circle className="fill" cx="39" cy="39" r="33"
              strokeDasharray={2 * Math.PI * 33}
              strokeDashoffset={2 * Math.PI * 33 * (1 - goalPct / 100)} />
          </svg>
          <div className="label"><b>{todayCount}</b><span>OF {goal}</span></div>
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <span className="eyebrow" style={{ marginBottom: 5 }}>Today's session</span>
          <p className="note" style={{ marginTop: 0 }}>
            {todayCount >= goal
              ? "Goal met — day " + streak.current + " of the streak is locked in. Anything more is free."
              : streak.current > 0
                ? (goal - todayCount) + " more keeps a " + streak.current + "-day streak alive."
                : (goal - todayCount) + " more starts a streak."}
          </p>
          <div className="level">
            <div className="level-top">
              <b>Level {level.level}</b>
              <span>{level.into} / {level.span} XP</span>
            </div>
            <div className="level-bar"><i style={{ width: level.pct + "%" }} /></div>
          </div>
        </div>
      </div>
      {streak.freezesLeft > 0 && (
        <p className="hint">
          {streak.freezesLeft} rest day{streak.freezesLeft === 1 ? "" : "s"} banked — miss one and the streak survives.
        </p>
      )}
      {streak.usedFreeze && <p className="hint">A banked rest day is currently covering a gap.</p>}
    </div>
  );

  /* Flashcards run as a full-screen stage rather than inline, so the launcher
     is all that lives on the page. Spoken practice keeps the page layout. */
  if (mode === "flashcard") {
    const withAnswers = queue.filter((x) => x.answer && x.answer.trim()).length;
    return (
      <>
        {modeSwitch}
        {goalPanel}
        <div className="card">
          <span className="eyebrow">Ready to run</span>
          <div className="deck">
            <div>
              <div className="deck-num">{queue.length}</div>
              <small>card{queue.length === 1 ? "" : "s"} in the deck</small>
            </div>
            <div style={{ flex: 1 }}>
              <p className="note" style={{ marginTop: 0 }}>
                One card at a time, full screen. Tap to flip, then grade — the same FSRS
                scheduling as spoken practice, just faster.
              </p>
            </div>
          </div>
          <button className="btn" style={{ marginTop: 16 }} onClick={() => setFocus(true)}>
            Start session
          </button>
          <p className="hint">
            {withAnswers === queue.length
              ? "Every card has answer notes."
              : (queue.length - withAnswers) + " of " + queue.length + " have no answer notes yet — they'll flip to a blank back."}
            {" "}Space starts, Esc leaves, 1–4 grade.
          </p>
        </div>

        {done.length > 0 && (
          <div className="stat-row" style={{ marginTop: 14, marginBottom: 0 }}>
            <div className="stat"><b>{doneShown}</b><small>done today</small></div>
            <div className="stat"><b>{queueShown}</b><small>still due</small></div>
          </div>
        )}

        {focus && (
          <FlashcardOverlay
            ctx={ctx}
            queue={queue}
            doneCount={done.length}
            onGrade={(c, g) => grade(g)}
            onClose={() => setFocus(false)}
          />
        )}
      </>
    );
  }

  const concept = concepts.find((c) => c.id === card.conceptId);
  const language = languages.find((l) => l.id === card.languageId);
  const variants = questions.filter((q) => q.variantOf === card.id);
  const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
  const ss = String(elapsed % 60).padStart(2, "0");
  const sug = suggestGrade(results, elapsed, target);

  return (
    <>
      {modeSwitch}
      {goalPanel}

      <div className="stat-row">
        <div className="stat"><b>{queueShown}</b><small>in queue</small></div>
        <div className="stat"><b>{doneShown}</b><small>done today</small></div>
        <div className="stat"><b>{strengthOf(card)}</b><small>strength</small></div>
      </div>

      <div className="card">
        <span className="eyebrow">{concept ? concept.name : "Unfiled"}{language ? " · " + language.name : ""} · {angleName(card.angle)} · {card.difficulty}</span>
        <div className="rev-q">{card.text}</div>
        {variants.length > 0 && <p className="hint" style={{ marginTop: 10 }}>Also asked as: {variants.map((v) => v.text).join(" / ")}</p>}

        {phase === "ask" && (
          <>
            <div className="alert info">
              <b>Say it out loud, on the clock.</b>
              Interviews are spoken. Reading the answer in your head is the reason it falls apart in the room.
              {beats.length > 0 && dict.supported && " Your mic transcript gets checked against all " + beats.length + " beats."}
            </div>
            <div className="row" style={{ marginTop: 12 }}>
              {dict.supported && (
                <button className="btn" onClick={() => { dict.start(); setRunning(true); setPhase("talk"); }}>
                  Answer with mic
                </button>
              )}
              <button className={"btn " + (dict.supported ? "line" : "")} onClick={() => { setRunning(true); setPhase("talk"); }}>
                {dict.supported ? "Without mic" : "Start answering"}
              </button>
            </div>
            {!dict.supported && <p className="hint">This browser has no speech recognition, so grading falls back to self-assessment. Chrome handles it best.</p>}
            <p className="hint">Press <b>Space</b> to start.</p>
          </>
        )}

        {phase === "talk" && (
          <div style={{ marginTop: 16 }}>
            <div className="mic">
              <div className={"mic-orb" + (dict.listening ? " live" : "")}>{dict.listening ? "●" : "○"}</div>
              <div style={{ flex: 1 }}>
                <div className="timer" style={{ color: elapsed > target ? "var(--warn)" : "var(--ink)" }}>{mm}:{ss}</div>
                <div className="timer-bar"><i style={{ width: Math.min(100, (elapsed / target) * 100) + "%", background: elapsed > target ? "var(--warn)" : "var(--indigo)" }} /></div>
              </div>
            </div>
            <p className="hint">Aim for {target}s. Over that and you're rambling; under 20s and you're thin.</p>
            {dict.error && <div className="alert warn"><b>Mic trouble</b>{dict.error}</div>}
            {(dict.text || dict.interim) && (
              <div className="transcript">{dict.text}<em>{dict.interim}</em></div>
            )}
            {!dict.listening && !dict.text && (
              <textarea className="q sm" style={{ marginTop: 12 }} value={manual} onChange={(e) => setManual(e.target.value)}
                placeholder="Optional: type the gist of what you said, and it gets scored the same way." />
            )}
            <button className="btn line" style={{ marginTop: 12 }} onClick={finishTalking}>Done — show me the answer</button>
            <p className="hint">Press <b>Space</b> to finish and reveal the answer.</p>
          </div>
        )}

        {phase === "check" && (
          <div style={{ marginTop: 16 }}>
            <span className="eyebrow">You spoke for {mm}:{ss} · target {target}s</span>

            {scoring && <div className="alert ml"><b>Checking what you covered</b>Comparing your answer against each beat…</div>}

            {results && (
              <>
                <div className="alert" style={{
                  background: sug.ratio >= 0.6 ? "var(--okbg)" : "var(--warnbg)",
                  border: "1px solid " + (sug.ratio >= 0.6 ? "var(--okborder)" : "var(--warnborder)"),
                  color: sug.ratio >= 0.6 ? "var(--oktext)" : "var(--warntext)",
                }}>
                  <b>You covered {results.filter((r) => r.state === "hit").length} of {results.length} beats.</b>
                  {results.some((r) => r.state === "miss")
                    ? "Missed: " + results.filter((r) => r.state === "miss").length + ". Read them below, then answer it again tomorrow."
                    : "Nothing skipped."}
                </div>
                <span className="eyebrow" style={{ marginTop: 16 }}>Beat by beat</span>
                {results.map((r, i) => (
                  <div className={"beat" + (r.state === "miss" ? " miss" : "")} key={i}
                    style={{ animationDelay: (i * 85) + "ms" }}>
                    <div className="beat-mark" style={{ color: r.state === "hit" ? "var(--clear)" : r.state === "part" ? "var(--warn)" : "var(--collide)" }}>
                      {r.state === "hit" ? "✓" : r.state === "part" ? "~" : "✗"}
                    </div>
                    <div style={{ flex: 1 }}>
                      <div className="beat-txt">{r.beat}</div>
                      <div className="beat-score">{r.state === "hit" ? "covered" : r.state === "part" ? "touched on" : "not mentioned"} · {Math.round(r.score * 100)}%</div>
                    </div>
                  </div>
                ))}
              </>
            )}

            {!results && !scoring && (card.answer
              ? <div className="item-ans" style={{ fontSize: 16, whiteSpace: "pre-line" }}>{card.answer}</div>
              : <p className="hint">No answer notes saved for this one. Add them from the Bank tab while it's fresh — then review can grade you properly.</p>)}
            {card.codeExample && <pre className="code-block">{card.codeExample}</pre>}

            <span className="eyebrow" style={{ marginTop: 18 }}>
              How did that go?{sug && <span style={{ textTransform: "none", letterSpacing: 0 }}> — coverage suggests {GRADES[sug.grade - 1].name.toLowerCase()}</span>}
            </span>
            <div className="grade">
              {GRADES.map(({ g, name }) => (
                <button key={g} className={sug && sug.grade === g ? "rec" : ""} onClick={() => grade(g)}>
                  <b>{g} · {name}</b>
                  <small>{previewDays(card, g, settings.retention)}</small>
                </button>
              ))}
            </div>
            <p className="hint">Intervals come from FSRS, fitted to this card's own stability and difficulty — not a fixed ladder. Press <b>1–4</b> to grade.</p>
          </div>
        )}
      </div>
    </>
  );
}

/* ============================= COVERAGE ================================ */
function CoverageView({ ctx, onGap }) {
  const { questions, concepts, vecs, mlReady } = ctx;
  const [clusters, setClusters] = useState(null);

  const rows = useMemo(() => concepts.map((c) => {
    const qs = questions.filter((q) => q.conceptId === c.id && !q.variantOf);
    const byAngle = {};
    qs.forEach((q) => { (byAngle[q.angle] = byAngle[q.angle] || []).push(q); });
    const covered = Object.keys(byAngle).length;
    const stab = qs.length ? qs.reduce((s, q) => s + (q.stability || 0), 0) / qs.length : 0;
    return { c, qs, byAngle, covered, stab };
  }).sort((a, b) => a.covered - b.covered || b.qs.length - a.qs.length), [questions, concepts]);

  /* near-duplicate sweep across the whole bank, only possible with vectors */
  useEffect(() => {
    if (!mlReady) { setClusters(null); return; }
    const list = questions.filter((q) => !q.variantOf && vecs.get(q.id));
    const pairs = [];
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const s = blend(lexScore(list[i].text, list[j].text), semScore(cosine(vecs.get(list[i].id), vecs.get(list[j].id)))).score;
        if (s >= 72) pairs.push({ a: list[i], b: list[j], s });
      }
    }
    setClusters(pairs.sort((x, y) => y.s - x.s).slice(0, 5));
  }, [questions, vecs, mlReady]);

  const unfiled = questions.filter((q) => !q.conceptId).length;
  const totalCells = concepts.length * ANGLES.length;
  const filled = rows.reduce((s, r) => s + r.covered, 0);
  const durable = questions.filter((q) => (q.stability || 0) >= 21).length;
  const thin = rows.filter((r) => r.covered <= 2).length;
  const filledShown = useCountUp(filled, 700);
  const durableShown = useCountUp(durable, 700);
  const thinShown = useCountUp(thin, 700);

  if (!concepts.length) {
    return <div className="card"><div className="empty">
      <h3>Coverage needs concepts.</h3>
      <p>Tag your questions with a concept and this becomes a map of what you can and can't talk about.</p>
    </div></div>;
  }

  return (
    <>
      <div className="stat-row">
        <div className="stat"><b>{filledShown}<span style={{ fontSize: 13, color: "var(--soft)" }}>/{totalCells}</span></b><small>angles covered</small></div>
        <div className="stat"><b>{durableShown}</b><small>held durably</small></div>
        <div className="stat"><b>{thinShown}</b><small>thin concepts</small></div>
      </div>

      <div className="card">
        <span className="eyebrow">Weakest concepts first · tap an empty cell to write that question</span>
        {rows.map(({ c, qs, byAngle, covered, stab }, ri) => (
          <div className="cov" key={c.id}>
            <div className="cov-name">
              {c.name}
              <small>{qs.length} question{qs.length === 1 ? "" : "s"} · {covered}/6 angles{stab >= 21 ? " · durable" : stab >= 7 ? " · settling" : ""}</small>
            </div>
            <div className="cells">
              {ANGLES.map((a, ci) => {
                const list = byAngle[a.id] || [];
                const avg = list.length ? list.reduce((s, q) => s + (q.stability || 0), 0) / list.length : 0;
                const cls = !list.length ? "cell" : avg >= 21 ? "cell strong" : "cell has";
                return (
                  <button key={a.id} className={cls}
                    style={{ animationDelay: (140 + ri * 32 + ci * 26) + "ms" }}
                    title={a.name + (list.length ? " · " + list.length + " question(s)" : " · not asked yet")}
                    aria-label={c.name + ", " + a.name + ", " + (list.length ? list.length + " questions" : "empty")}
                    onClick={() => !list.length && onGap({ conceptId: c.id, angle: a.id, text: "" })}>{a.short}</button>
                );
              })}
            </div>
          </div>
        ))}
        <div className="legend">{ANGLES.map((a) => <span key={a.id}>{a.short} — {a.name}</span>)}</div>
        <p className="note" style={{ marginTop: 14 }}>
          <b>Dark</b> means asked. <b>Green</b> means FSRS puts it three weeks or more from being forgotten.
          {unfiled > 0 && " " + unfiled + " question" + (unfiled === 1 ? " has" : "s have") + " no concept and sit outside this map."}
        </p>
      </div>

      {mlReady && clusters && clusters.length > 0 && (
        <div className="card">
          <span className="eyebrow">Possible duplicates already in the bank</span>
          <p className="note" style={{ marginTop: 0 }}>Found by comparing every pair by meaning. These slipped in before semantic matching was on.</p>
          {clusters.map((p, i) => (
            <div className="item" key={i}>
              <div className="near-meta" style={{ color: BAND_COLOR[band(p.s)] }}>{p.s}% match</div>
              <div className="item-q" style={{ fontSize: 15 }}>{p.a.text}</div>
              <div className="item-q" style={{ fontSize: 15, marginTop: 6, color: "var(--soft)" }}>{p.b.text}</div>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

/* =============================== BANK ================================== */
function BankView({ ctx, goAdd, onEdit, seed }) {
  const { questions, concepts, languages, vecs, mlReady, putQ, dropQ } = ctx;
  const [q, setQ] = useState("");
  const [qVec, setQVec] = useState(null);
  const [conceptFilter, setConceptFilter] = useState("all");
  const [languageFilter, setLanguageFilter] = useState("all");
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState("");
  const [notesEditorItem, setNotesEditorItem] = useState(null);

  useEffect(() => {
    let dead = false;
    if (!mlReady || q.trim().length < 4) { setQVec(null); return; }
    const t = setTimeout(() => { ML.embed(q).then((v) => { if (!dead) setQVec(v); }).catch(() => {}); }, 250);
    return () => { dead = true; clearTimeout(t); };
  }, [q, mlReady]);

  const list = useMemo(() => {
    let out = questions.filter((x) => !x.variantOf);
    if (conceptFilter !== "all") out = out.filter((x) => (conceptFilter === "none" ? !x.conceptId : x.conceptId === conceptFilter));
    if (languageFilter !== "all") out = out.filter((x) => (languageFilter === "none" ? !x.languageId : x.languageId === languageFilter));
    if (q.trim()) {
      out = out.map((x) => {
        const lex = lexScore(q, x.text);
        let sem = null;
        if (qVec) { const v = vecs.get(x.id); if (v) sem = semScore(cosine(qVec, v)); }
        return { x, s: blend(lex, sem).score };
      }).filter((r) => r.s >= 25 || norm(r.x.text).includes(norm(q)))
        .sort((a, b) => b.s - a.s).map((r) => r.x);
    } else out = [...out].sort((a, b) => b.created - a.created);
    return out;
  }, [questions, q, conceptFilter, languageFilter, qVec, vecs]);

  async function saveAnswer(item) {
    await putQ({ ...item, answer: draft.trim() });
    setEditing(null);
  }

  if (!questions.length) {
    return <div className="card"><div className="empty">
      <h3>The bank is empty.</h3>
      <p>Load ten real questions across five concepts, then try typing a paraphrase — the gauge will catch it.</p>
      <button className="btn" onClick={seed}>Load the starter set</button>
      <p style={{ marginTop: 14, marginBottom: 0, fontSize: 12.5 }}>Or <button className="btn tiny line" onClick={goAdd}>add your own</button></p>
    </div></div>;
  }

  return (
    <>
      <div className="card">
        <input className="t" value={q} onChange={(e) => setQ(e.target.value)}
          placeholder={mlReady ? "Search by meaning — synonyms count" : "Search — fuzzy, so near-misses show up"} />
        <div className="field">
          <select className="t" value={conceptFilter} onChange={(e) => setConceptFilter(e.target.value)}>
            <option value="all">All concepts</option>
            {concepts.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            <option value="none">Unfiled</option>
          </select>
        </div>
        {languages.length > 0 && (
          <div className="field">
            <select className="t" value={languageFilter} onChange={(e) => setLanguageFilter(e.target.value)}>
              <option value="all">All languages</option>
              {languages.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
              <option value="none">No language</option>
            </select>
          </div>
        )}
      </div>

      <div className="card">
        <span className="eyebrow">{list.length} question{list.length === 1 ? "" : "s"}</span>
        {list.length === 0 && <p className="note">Nothing matches. Clear the search, or add it — the gauge will confirm it's new.</p>}
        {list.map((item) => {
          const c = concepts.find((x) => x.id === item.conceptId);
          const l = languages.find((x) => x.id === item.languageId);
          const variants = questions.filter((v) => v.variantOf === item.id);
          return (
            <div className="item" key={item.id}>
              <div className="item-q">{item.text}</div>
              <div className="item-meta">
                <span>{c ? c.name : "unfiled"}</span><span className="dot" />
                {l && <><span>{l.name}</span><span className="dot" /></>}
                <span>{angleName(item.angle)}</span><span className="dot" />
                <span>{strengthOf(item)}{item.stability ? " · " + Math.round(item.stability) + "d" : ""}</span><span className="dot" />
                <span>{fmtDue(item)}</span>
                {item.lapses > 0 && <><span className="dot" /><span style={{ color: "var(--collide)" }}>{item.lapses} blank{item.lapses === 1 ? "" : "s"}</span></>}
              </div>
              {item.answer && editing !== item.id && <div className="item-ans" style={{ whiteSpace: "pre-line" }}>{item.answer}</div>}
              {item.codeExample && editing !== item.id && <pre className="code-block">{item.codeExample}</pre>}
              {editing === item.id ? (
                <>
                  <textarea className="q sm" style={{ marginTop: 10 }} value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="One beat per line…" />
                  <button type="button" className="expand-btn" onClick={() => setNotesEditorItem(item)}>⤢ Open full editor</button>
                  <div className="row" style={{ marginTop: 8 }}>
                    <button className="btn tiny" onClick={() => saveAnswer(item)}>Save notes</button>
                    <button className="btn tiny line" onClick={() => setEditing(null)}>Cancel</button>
                  </div>
                </>
              ) : (
                <div className="row" style={{ marginTop: 10 }}>
                  <button className="btn tiny line" onClick={() => onEdit(item)}>Edit question</button>
                  <button className="btn tiny line" onClick={() => { setEditing(item.id); setDraft(item.answer || ""); }}>{item.answer ? "Edit notes" : "Add notes"}</button>
                  <button className="btn tiny line" onClick={() => dropQ(item.id)}>Delete</button>
                </div>
              )}
              {variants.map((v) => (
                <div className="variant" key={v.id} style={{ marginTop: 10 }}>
                  <div className="near-meta">variant</div>
                  <div className="item-q" style={{ fontSize: 15 }}>{v.text}</div>
                  <div className="row" style={{ marginTop: 8 }}>
                    <button className="btn tiny line" onClick={() => onEdit(v)}>Edit</button>
                    <button className="btn tiny line" onClick={() => dropQ(v.id)}>Delete variant</button>
                  </div>
                </div>
              ))}
            </div>
          );
        })}
      </div>

      {notesEditorItem && (
        <AnswerEditorModal
          title="What a strong answer covers"
          /* hand over whatever is in the inline box, not the last saved copy,
             so opening the big editor never silently drops what you typed */
          value={editing === notesEditorItem.id ? draft : (notesEditorItem.answer || "")}
          onSave={async (v) => { setDraft(v); await putQ({ ...notesEditorItem, answer: v.trim() }); setEditing(null); }}
          onClose={() => setNotesEditorItem(null)}
        />
      )}
    </>
  );
}

/* Every number here is recomputed from the reviews table. The point of the
   page is the retention chart: it is the only honest check on whether the
   scheduler is calibrated to you rather than to its default weights. */
function StatsView({ ctx }) {
  const { reviews, questions, concepts, languages, settings, counts, streak, xp, level, todayCount } = ctx;

  const ret = useMemo(() => retentionStats(reviews), [reviews]);
  const wd = useMemo(() => weekdayStats(reviews), [reviews]);
  const badges = useMemo(() => badgesOf({ reviews, questions, concepts, languages, streak, level }),
    [reviews, questions, concepts, languages, streak, level]);

  /* 17 weeks back to the start of that week, so columns line up as weeks */
  const weeks = useMemo(() => {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const start = shiftDay(today, -(16 * 7 + today.getDay()));
    const cols = [];
    for (let w = 0; w < 17; w++) {
      const col = [];
      for (let d = 0; d < 7; d++) {
        const day = shiftDay(start, w * 7 + d);
        if (day > today) { col.push(null); continue; }
        const k = dayKey(day.getTime());
        col.push({ k, n: counts.get(k) || 0, today: k === dayKey(now()), month: day.getDate() <= 7 ? day.toLocaleString(undefined, { month: "short" }) : null });
      }
      cols.push(col);
    }
    return cols;
  }, [counts]);

  const xpShown = useCountUp(xp, 900);
  const totalShown = useCountUp(reviews.length, 900);
  const bestDay = useMemo(() => {
    let best = 0; counts.forEach((n) => { if (n > best) best = n; }); return best;
  }, [counts]);

  const heatLevel = (n) => (n === 0 ? "" : n < 5 ? " l1" : n < 12 ? " l2" : n < 25 ? " l3" : " l4");
  const pct = (x) => (x == null ? "—" : Math.round(x * 100) + "%");
  const target = settings.retention || 0.9;

  if (!reviews.length) {
    return <div className="card"><div className="empty">
      <h3>No history yet.</h3>
      <p>Grade a few cards and this fills with your retention curve, a heatmap of the last four months, and which days of the week actually go well.</p>
    </div></div>;
  }

  return (
    <>
      <div className="stat-row">
        <div className="stat"><b>{streak.current}</b><small>day streak</small></div>
        <div className="stat"><b>{totalShown}</b><small>reviews</small></div>
        <div className="stat"><b>{xpShown}</b><small>total xp</small></div>
      </div>

      <div className="card">
        <span className="eyebrow">True retention · target {Math.round(target * 100)}%</span>
        <div className="ring-row">
          <div>
            <div className="gauge-num" style={{
              color: ret.rate == null ? "var(--soft)"
                : ret.rate >= target - 0.03 ? "var(--clear)"
                : ret.rate >= target - 0.10 ? "var(--warn)" : "var(--collide)",
            }}>{ret.rate == null ? "—" : Math.round(ret.rate * 100)}<span>%</span></div>
          </div>
          <p className="note" style={{ marginTop: 0, flex: 1 }}>
            {ret.rate == null ? "Not enough spaced reviews yet."
              : ret.rate >= target - 0.03
                ? "You are recalling about as often as you asked to. The scheduler is calibrated."
                : ret.rate < target - 0.10
                  ? "You are forgetting more than you asked for. Raise target retention in Settings — the intervals are too long for you."
                  : "Slightly below target. Give it a few weeks before changing anything."}
          </p>
        </div>
        <p className="hint">Measured over {ret.n} reviews that were genuinely due. Same-day relearns are excluded — they test nothing about memory.</p>

        <span className="eyebrow" style={{ marginTop: 18 }}>Recall by how long it had been</span>
        <div className="chart">
          {ret.buckets.map((b, i) => (
            <div className="chart-col" key={b.label}>
              <span className="chart-val">{b.n ? pct(b.rate) : "–"}</span>
              <div className={"chart-bar" + (b.rate != null && b.rate < target - 0.05 ? " under" : "")}
                style={{ height: Math.max(3, (b.rate || 0) * 100) + "%", animationDelay: (i * 80) + "ms" }} />
            </div>
          ))}
        </div>
        <div className="target-line" style={{ marginTop: -Math.round(target * 104) + "px" }}><b>target</b></div>
        <div className="chart" style={{ height: "auto", marginTop: Math.round(target * 104) + "px" }}>
          {ret.buckets.map((b) => <div className="chart-col" key={b.label}><span className="chart-key">{b.label}<br />{b.n}</span></div>)}
        </div>
        <p className="hint">A bar well under the dashed line means those intervals are too long. If the long buckets sag, your stability estimates are optimistic.</p>
      </div>

      <div className="card">
        <span className="eyebrow">Last 17 weeks · best day {bestDay}</span>
        <div className="heat">
          {weeks.map((col, i) => (
            <div className="heat-col" key={i}>
              {col.map((d, j) => (
                <div key={j} className={"heat-cell" + (d ? heatLevel(d.n) + (d.today ? " today" : "") : "")}
                  style={{ visibility: d ? "visible" : "hidden" }}
                  title={d ? d.k + " · " + d.n + " review" + (d.n === 1 ? "" : "s") : ""} />
              ))}
            </div>
          ))}
        </div>
        <p className="hint">
          Longest run {streak.longest} day{streak.longest === 1 ? "" : "s"}
          {streak.freezesLeft > 0 ? " · " + streak.freezesLeft + " rest day" + (streak.freezesLeft === 1 ? "" : "s") + " banked" : ""}
          {" · "}{todayCount} today.
        </p>
      </div>

      <div className="card">
        <span className="eyebrow">How the week actually goes</span>
        <div className="chart">
          {wd.map((d, i) => (
            <div className="chart-col" key={d.label}>
              <span className="chart-val">{d.n ? pct(d.rate) : "–"}</span>
              <div className={"chart-bar" + (d.rate != null && d.rate < target - 0.05 ? " under" : "")}
                style={{ height: Math.max(3, (d.rate || 0) * 100) + "%", animationDelay: (i * 60) + "ms" }} />
            </div>
          ))}
        </div>
        <div className="chart" style={{ height: "auto" }}>
          {wd.map((d) => <div className="chart-col" key={d.label}><span className="chart-key">{d.label[0]}<br />{d.n}</span></div>)}
        </div>
        {(() => {
          const rated = wd.filter((d) => d.n >= 5 && d.rate != null);
          if (rated.length < 3) return <p className="hint">Needs a few more weeks before the day-of-week pattern means anything.</p>;
          const worst = rated.slice().sort((a, b) => a.rate - b.rate)[0];
          const best = rated.slice().sort((a, b) => b.rate - a.rate)[0];
          if (best.rate - worst.rate < 0.08) return <p className="note">No real difference between days — your recall is steady whenever you sit down.</p>;
          return <p className="note">
            <b>{worst.label}</b> is your worst day at {pct(worst.rate)}, against {pct(best.rate)} on <b>{best.label}</b>.
            {" "}Worth asking what is different — time of day, tiredness, or just cramming a backlog.
          </p>;
        })()}
      </div>

      <div className="card">
        <span className="eyebrow">Achievements · {badges.filter((b) => b.got).length} of {badges.length}</span>
        <div className="badges">
          {badges.map((b, i) => (
            <div className={"badge-tile" + (b.got ? " got" : "")} key={b.name} style={{ animationDelay: (i * 40) + "ms" }}>
              <div className="ico">{b.icon}</div>
              <b>{b.name}</b>
              <small>{b.got ? b.note : b.have + " / " + b.need}</small>
              {!b.got && <div className="prog"><i style={{ width: b.pct + "%" }} /></div>}
            </div>
          ))}
        </div>
      </div>
    </>
  );
}
